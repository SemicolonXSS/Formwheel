<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제작자들 · Formwheel</title>
<link rel="icon" type="image/svg+xml" href="./assets/formwheel-favicon.svg">
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#242424;background:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{padding:24px clamp(20px,5vw,72px)}header a{color:#303030;text-decoration:none;font-weight:750;font-size:15px}header a:hover{text-decoration:underline}
main{flex:1;display:grid;place-items:center;padding:24px 20px 80px}
.wrapper{width:min(100%,790px);text-align:center}
h1{display:flex;align-items:center;justify-content:center;gap:22px;font-size:clamp(28px,5vw,38px);margin:0 0 56px}
h1:before,h1:after{content:"";height:1px;background:#cfcfcf;width:clamp(30px,14vw,155px)}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,6vw,80px);max-width:620px;margin:auto}
.person{display:flex;flex-direction:column;align-items:center;gap:16px}
.avatar{width:100%;max-width:235px;aspect-ratio:1;border:1px solid #d0d0d0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f8f8f8)}
.avatar svg{width:72%;height:72%}.person strong{font-size:clamp(18px,3vw,23px);letter-spacing:-.03em}
footer{text-align:center;color:#888;font-size:12px;padding:30px}
@media(max-width:420px){h1{margin-bottom:36px}.people{gap:20px}.avatar svg{width:75%;height:75%}}
</style>
</head>
<body>
<header><a href="./">← Formwheel Home</a></header>
<main><div class="wrapper">
<h1>제작자</h1>
<section class="people" aria-label="Formwheel 제작자들">
<article class="person"><div class="avatar" role="img" aria-label="세미콜론 기호">
<svg viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="48" r="19" fill="#292929"/><path d="M90 82c24 0 34 17 29 41-5 23-26 37-48 40-6 1-9-6-5-10 11-10 18-20 21-31-19-2-28-12-28-23 0-10 12-17 31-17z" fill="#292929"/></svg>
</div><strong>Semicolon</strong></article>
<article class="person"><div class="avatar" role="img" aria-label="웃는 세콜 로봇">
<svg viewBox="0 0 180 180" aria-hidden="true">
<circle cx="90" cy="23" r="10" fill="#292929"/><path d="M90 33v16" stroke="#292929" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="32" cy="96" rx="12" ry="23" fill="#333"/><ellipse cx="148" cy="96" rx="12" ry="23" fill="#333"/>
<rect x="37" y="48" width="106" height="91" rx="37" fill="#fff" stroke="#303030" stroke-width="4"/>
<rect x="50" y="63" width="80" height="62" rx="25" fill="#292929"/>
<path d="M65 92q10-19 20 0M96 92q10-19 20 0" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
<ellipse cx="90" cy="153" rx="38" ry="5" fill="#e6e6e6"/>
</svg></div><strong>Secol</strong></article>
</section></div></main>
<footer>© Formwheel</footer>
</body></html>
