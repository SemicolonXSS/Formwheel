<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sports | Formwheel</title><meta name="theme-color" content="#101d35">
<style>
*{box-sizing:border-box}body{margin:0;background:#0d182b;color:#f6f8ff;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}main{max-width:980px;margin:auto;padding:18px}a{color:#b6dbff}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:10px 0}p{color:#b6c6df}.panel{background:#192b46;border:1px solid #3d5374;border-radius:18px;padding:15px;margin:12px 0}button,select{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid #587397;background:#263e62;color:white;cursor:pointer}button.active,button.primary{background:#4d6ef2;border-color:#90a8ff}button:focus-visible{outline:3px solid #ffd46d}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.score{font-size:22px;font-weight:850;text-align:center;margin:10px 0}.field{position:relative;width:100%;touch-action:none}canvas{width:100%;display:block;background:#196244;border-radius:14px;border:3px solid #aac6d7;touch-action:none}.hint{font-size:13px;line-height:1.7}.touch{display:grid;grid-template-columns:repeat(3,54px);gap:5px;justify-content:center;align-items:center;margin:12px 0}.touch button{padding:12px 0;user-select:none;touch-action:none}.touch button[data-key=ArrowUp]{grid-column:2}.touch button[data-key=ArrowLeft]{grid-column:1;grid-row:2}.touch button[data-key=ArrowDown]{grid-column:2;grid-row:2}.touch button[data-key=ArrowRight]{grid-column:3;grid-row:2}.touch button[data-key=Space]{grid-column:1/4;grid-row:3}#status{min-height:25px;font-weight:700;color:#ffe29c}@media(min-width:700px){.touch{display:none}}
</style></head><body><main>
<header><a href="../">← Formwheel Hub</a><strong>FORMWHEEL SPORTS · BETA</strong></header>
<h1>🏟️ Formwheel Sports</h1><p>축구와 농구를 브라우저에서 바로 플레이! 컴퓨터 상대와 짧은 경기를 즐겨보세요.</p>
<section class="panel"><nav aria-label="종목 선택"><button type="button" class="active" data-sport="soccer">⚽ 축구</button><button type="button" data-sport="basketball">🏀 농구</button><label>경기 시간 <select id="duration"><option value="60">60초</option><option value="120">120초</option><option value="180">180초</option></select></label><button type="button" class="primary" id="start">경기 시작 / 재시작</button><button type="button" id="pause">일시정지</button></nav>
<div class="score" id="score" aria-live="polite">나 0 : 0 CPU · 60초</div><div id="status" role="status" aria-live="polite">경기 시작을 눌러주세요.</div>
<div class="field"><canvas id="game" width="900" height="520" aria-label="스포츠 경기장"></canvas></div>
<div class="touch" aria-label="모바일 조작"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="Space">슛 / 킥</button></div>
<p class="hint" id="rules">축구: 방향키 또는 WASD로 움직이고 스페이스로 공을 차세요. 상대 골대(오른쪽)에 넣으면 득점! 모바일은 아래 조작 버튼을 길게 누르세요.</p>
</section></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),status=document.querySelector('#status'),rules=document.querySelector('#rules');
const W=900,H=520,keys=new Set();let sport='soccer',running=false,paused=false,last=0,time=60,duration=60,me=0,cpuScore=0,shotCooldown=0;
const player={x:180,y:260,r:18},cpu={x:720,y:260,r:19},ball={x:450,y:260,vx:0,vy:0,r:11};
function resetPositions(){player.x=180;player.y=260;cpu.x=720;cpu.y=260;ball.x=450;ball.y=260;ball.vx=0;ball.vy=0;shotCooldown=0}
function setSport(next){sport=next;running=false;paused=false;me=cpuScore=0;time=Number(document.querySelector('#duration').value);resetPositions();document.querySelectorAll('[data-sport]').forEach(b=>b.classList.toggle('active',b.dataset.sport===sport));rules.textContent=sport==='soccer'?'축구: 방향키/WASD로 이동, 스페이스로 킥! 오른쪽 골대에 넣으세요.':'농구: 방향키/WASD로 이동, 공 근처에서 스페이스로 오른쪽 골대에 슛! 가까이에서 쏠수록 정확해요.';status.textContent='경기 시작을 눌러주세요.';document.querySelector('#pause').textContent='일시정지';updateScore();draw()}
function updateScore(){scoreEl.textContent='나 '+me+' : '+cpuScore+' CPU · '+Math.ceil(time)+'초'}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function start(){duration=Number(document.querySelector('#duration').value);time=duration;me=cpuScore=0;running=true;paused=false;last=0;resetPositions();status.textContent='경기 진행 중!';document.querySelector('#pause').textContent='일시정지';updateScore();requestAnimationFrame(frame)}
function kick(by){if(shotCooldown>0||dist(by,ball)>by.r+ball.r+31)return;shotCooldown=.35;if(sport==='basketball'){let accuracy=clamp(1-Math.abs(by.x-(by===player?790:110))/850,.25,.85);if(Math.random()<accuracy){if(by===player)me+=by.x<570?3:2;else cpuScore+=cpu.x>330?3:2;status.textContent=(by===player?'슛 성공!':'CPU 득점!');resetPositions()}else{status.textContent='슛 실패! 리바운드!';ball.vx=(by===player?1:-1)*180;ball.vy=(Math.random()-.5)*220}}else{const dir=by===player?1:-1;ball.vx=dir*clamp(300+Math.abs(by.x-ball.x)*4,300,560);ball.vy=clamp((ball.y-by.y)*8,-300,300)}}
function goal(who){if(who==='me')me++;else cpuScore++;status.textContent=who==='me'?'⚽ 골!':'CPU가 득점했습니다.';resetPositions()}
function move(dt){let dx=Number(keys.has('ArrowRight')||keys.has('d'))-Number(keys.has('ArrowLeft')||keys.has('a'));let dy=Number(keys.has('ArrowDown')||keys.has('s'))-Number(keys.has('ArrowUp')||keys.has('w'));let len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*280*dt,20,W-20);player.y=clamp(player.y+dy/len*280*dt,20,H-20);
let target=sport==='soccer'?ball:ball;let vx=target.x-cpu.x,vy=target.y-cpu.y,vl=Math.hypot(vx,vy)||1;cpu.x=clamp(cpu.x+vx/vl*172*dt,20,W-20);cpu.y=clamp(cpu.y+vy/vl*172*dt,20,H-20);
if(keys.has(' ')||keys.has('Space'))kick(player);if(dist(cpu,ball)<cpu.r+ball.r+23&&shotCooldown<=0)kick(cpu);
for(const p of [player,cpu]){let d=dist(p,ball);if(d<p.r+ball.r&&d>0){let nx=(ball.x-p.x)/d,ny=(ball.y-p.y)/d;ball.x=p.x+nx*(p.r+ball.r);ball.y=p.y+ny*(p.r+ball.r);ball.vx+=nx*85;ball.vy+=ny*85}}
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;let friction=Math.exp(-1.5*dt);ball.vx*=friction;ball.vy*=friction;if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.8}if(ball.y>H-ball.r){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)*.8}
if(sport==='soccer'){if(ball.x>W-ball.r){if(ball.y>H*.35&&ball.y<H*.65)goal('me');else{ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.8}}if(ball.x<ball.r){if(ball.y>H*.35&&ball.y<H*.65)goal('cpu');else{ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.8}}}else{if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.6}if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.6}}
shotCooldown=Math.max(0,shotCooldown-dt)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=sport==='soccer'?'#217548':'#bf884a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffffa8';ctx.lineWidth=3;ctx.strokeRect(14,14,W-28,H-28);ctx.beginPath();ctx.moveTo(W/2,14);ctx.lineTo(W/2,H-14);ctx.moveTo(W/2+86,H/2);ctx.arc(W/2,H/2,86,0,Math.PI*2);ctx.stroke();if(sport==='soccer'){ctx.fillStyle='#fff8';ctx.fillRect(0,H*.35,15,H*.3);ctx.fillRect(W-15,H*.35,15,H*.3);ctx.strokeRect(14,H*.27,122,H*.46);ctx.strokeRect(W-136,H*.27,122,H*.46)}else{ctx.strokeStyle='#f7f0e6';ctx.beginPath();ctx.arc(110,H/2,110,-Math.PI/2,Math.PI/2);ctx.moveTo(W-110,H/2-110);ctx.arc(W-110,H/2,110,Math.PI/2,Math.PI*1.5);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(75,H/2-40,8,80);ctx.fillRect(W-83,H/2-40,8,80);ctx.strokeStyle='#f55';ctx.beginPath();ctx.arc(108,H/2,13,0,Math.PI*2);ctx.arc(W-108,H/2,13,0,Math.PI*2);ctx.stroke()}
for(const [p,color,label] of [[player,'#76b4ff','YOU'],[cpu,'#ff8c83','CPU']]){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0b213e';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(label,p.x,p.y-27)}
ctx.fillStyle=sport==='soccer'?'#fff':'#ed923b';ctx.strokeStyle='#202a3b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.stroke();if(!running||paused){ctx.fillStyle='#07162baa';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText(paused?'일시정지':(time<=0?'경기 종료':'SPORTS'),W/2,H/2)}}
function frame(ts){if(!running)return;if(!last)last=ts;let dt=Math.min((ts-last)/1000,.045);last=ts;if(!paused){time=Math.max(0,time-dt);move(dt);updateScore();if(time<=0){running=false;status.textContent='경기 종료! '+(me>cpuScore?'승리!':me<cpuScore?'패배!':'무승부!')}}draw();if(running)requestAnimationFrame(frame)}
document.querySelectorAll('[data-sport]').forEach(b=>b.addEventListener('click',()=>setSport(b.dataset.sport)));document.querySelector('#start').addEventListener('click',start);document.querySelector('#pause').addEventListener('click',()=>{if(!running)return;paused=!paused;last=0;status.textContent=paused?'일시정지 중':'경기 진행 중!';document.querySelector('#pause').textContent=paused?'계속하기':'일시정지';draw()});
const norm=k=>k===' '||k==='Space'?'Space':k.startsWith('Arrow')?k:k.toLowerCase();window.addEventListener('keydown',e=>{const k=norm(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','w','a','s','d'].includes(k)&&e.target.tagName!=='SELECT'){e.preventDefault();keys.add(k)}});window.addEventListener('keyup',e=>keys.delete(norm(e.key)));window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('.touch button').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys.add(k);if(b.setPointerCapture)b.setPointerCapture(e.pointerId)};const up=e=>{e.preventDefault();keys.delete(k)};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up))});setSport('soccer');
})();
</script></body></html>
