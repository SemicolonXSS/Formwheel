<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글로벌 이벤트 캘린더 · Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><link rel="stylesheet" href="./assets/formwheel-brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202638;font:15px system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid #dce2eb;padding:14px max(16px,calc((100vw - 900px)/2))}header a{color:#3439bd;font-weight:700}main{max-width:850px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(23px,5vw,34px);margin:0 0 8px}.muted{color:#59647a}.panel{background:white;border:1px solid #e1e5ef;border-radius:18px;padding:18px;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button{font:inherit;padding:10px;border:1px solid #cbd2e2;border-radius:10px;background:#fff;color:#202638}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #7782f4}#monthTitle{min-width:160px;text-align:center;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;color:#667085}.day{min-height:76px;padding:6px;border:1px solid #e2e6ef;border-radius:9px;background:#fff;overflow:hidden}.day.blank{background:transparent;border:0}.day.today{outline:2px solid #515ad0}.num{font-size:12px;font-weight:700}.dot{display:block;font-size:11px;background:#e9eafa;color:#3439bd;border-radius:5px;padding:3px;margin-top:4px;overflow-wrap:anywhere}.dot.local{background:#fff0d9;color:#84520b}.cards{display:grid;gap:10px}.event{background:white;border:1px solid #e1e5ef;border-radius:13px;padding:14px}.event h3{font-size:16px;margin:5px 0}.tag{display:inline-block;background:#e9eafa;color:#3439bd;padding:3px 7px;border-radius:8px;font-size:12px}.tag.local{background:#fff0d9;color:#84520b}.event p{margin:5px 0}.empty{text-align:center;padding:25px;color:#657089}@media(max-width:520px){.day{min-height:62px;padding:3px}.dot{font-size:9px;padding:2px}.panel{padding:10px}.controls select{max-width:100%}}
</style></head><body><header><a href="./more.html">← 더보기 / More</a></header><main><h1 id="title">🌍 글로벌 이벤트 캘린더</h1><p class="muted" id="intro">Formwheel Global Event Calendar v2.0 · 2026–2027</p><div class="panel"><div class="controls"><label for="region" id="regionLabel">지역</label><select id="region"><option value="all">🌍 전체 지역</option><option value="KR">🇰🇷 한국</option><option value="US">🇺🇸 미국</option><option value="FR">🇫🇷 프랑스</option><option value="IE">🇮🇪 아일랜드</option><option value="IN">🇮🇳 인도</option><option value="asia">🧧 음력 설 지역</option></select><label for="type" id="typeLabel">종류</label><select id="type"><option value="all">전체</option><option value="global">글로벌</option><option value="local">지역별</option></select></div><p class="muted" id="note">글로벌 이벤트는 모든 지역에서 볼 수 있어요. 일정은 기획안이며 실제 게임 내 보상·미션 구현 여부와 별개입니다.</p></div><div class="panel"><div class="controls" style="justify-content:center"><button id="prev" aria-label="이전 달">‹</button><span id="monthTitle" aria-live="polite"></span><button id="next" aria-label="다음 달">›</button></div><div class="calendar" id="calendar"></div></div><h2 id="listTitle">이벤트 일정</h2><div id="events" class="cards"></div></main><script>
const EVENTS=[["2026-10-31","2026-11-02","global","Halloween: Haunted Wheel","할로윈: 헌티드 휠","Maze 유령 모드와 Secret 암호","Ghost maze and Secret puzzles"],["2026-12-24","2026-12-27","global","Winter Festival 2026","윈터 페스티벌 2026","겨울 테마와 선물 미션","Winter theme and gift missions"],["2027-01-01","2027-01-03","global","New Year Festival","새해 축제","신년 목표 카드와 업적","New year goals and achievements"],["2027-03-27","2027-03-29","global","Spring Egg Hunt","봄 달걀 찾기","숨겨진 달걀 찾기","Find hidden eggs"],["2027-05-05","2027-05-09","global","Global Game Festival","글로벌 게임 축제","스피드런과 게임 도전","Speedruns and game challenges"],["2027-10-29","2027-10-31","global","Haunted Wheel","헌티드 휠","Maze와 Secret 특별 이벤트","Maze and Secret challenges"],["2027-12-24","2027-12-27","global","Winter Festival","윈터 페스티벌","겨울 테마와 미션","Winter themes and missions"],["2027-02-06","2027-02-09","asia","Lunar New Year","음력 설","행운 돌림판","Lucky wheel"],["2027-03-01","2027-03-01","KR","Independence Movement Day","삼일절","역사 퀴즈","History quiz"],["2027-03-17","2027-03-17","IE","St. Patrick's Day","성 패트릭의 날","초록 테마","Green theme"],["2027-04-22","2027-04-22","global-small","Earth Day","지구의 날","환경 미션","Eco challenge"],["2027-05-13","2027-05-13","KR","Buddha's Birthday","부처님오신날","평화 테마","Peace theme"],["2027-07-04","2027-07-04","US","Independence Day","미국 독립기념일","기념 퀴즈","Commemorative quiz"],["2027-07-14","2027-07-14","FR","Bastille Day","프랑스 혁명 기념일","역사 퀴즈","History quiz"],["2027-08-15","2027-08-15","KR","Liberation Day","광복절","역사 퍼즐","History puzzle"],["2027-09-14","2027-09-16","KR","Chuseok","추석","달맞이 미션","Moon mission"],["2027-10-09","2027-10-09","KR","Hangeul Day","한글날","한글 퍼즐","Korean word puzzle"],["2027-10-29","2027-10-29","IN","Diwali","디왈리","빛 축제 테마","Festival of lights"],["2027-11-25","2027-11-25","US","Thanksgiving","추수감사절","감사 카드","Gratitude cards"]];
const ko=!(navigator.language||'ko').toLowerCase().startsWith('en');const lang=ko?'ko-KR':'en-US';
const $=id=>document.getElementById(id);let year=2026,month=9;
try{const saved=localStorage.getItem('fw-event-region-v2');if(saved&&Array.from($('region').options).some(o=>o.value===saved))$('region').value=saved;}catch(e){}
const now=new Date();if(now.getFullYear()===2027){year=2027;month=now.getMonth()}else if(now.getFullYear()===2026&&now.getMonth()>9){month=now.getMonth()}
if(!ko){$('title').textContent='🌍 Global Event Calendar';$('regionLabel').textContent='Region';$('typeLabel').textContent='Type';$('listTitle').textContent='Event schedule';$('note').textContent='Global events are available in all regions. Dates are planned; in-game rewards and missions may not yet be implemented.';$('region').options[0].text='🌍 All regions';$('region').options[1].text='🇰🇷 Korea';$('region').options[2].text='🇺🇸 United States';$('region').options[3].text='🇫🇷 France';$('region').options[4].text='🇮🇪 Ireland';$('region').options[5].text='🇮🇳 India';$('region').options[6].text='🧧 Lunar New Year regions';$('type').options[0].text='All';$('type').options[1].text='Global';$('type').options[2].text='Regional';$('prev').setAttribute('aria-label','Previous month');$('next').setAttribute('aria-label','Next month')}
function global(e){return e[2]==='global'||e[2]==='global-small'}
function visible(e){const r=$('region').value,t=$('type').value;if(t==='global'&&!global(e))return false;if(t==='local'&&global(e))return false;return r==='all'||global(e)||e[2]===r||(e[2]==='asia'&&r==='KR')}
function render(){const start=year+'-'+String(month+1).padStart(2,'0')+'-01';const first=new Date(year,month,1);$('monthTitle').textContent=new Intl.DateTimeFormat(lang,{year:'numeric',month:'long'}).format(first);const c=$('calendar');c.replaceChildren();const days=ko?['일','월','화','수','목','금','토']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];days.forEach(s=>{const d=document.createElement('div');d.className='weekday';d.textContent=s;c.append(d)});for(let i=0;i<first.getDay();i++){const d=document.createElement('div');d.className='day blank';c.append(d)}const shown=EVENTS.filter(visible);for(let n=1;n<=new Date(year,month+1,0).getDate();n++){const date=year+'-'+String(month+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');const cell=document.createElement('div');cell.className='day'+(date===now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')?' today':'');const num=document.createElement('span');num.className='num';num.textContent=n;cell.append(num);shown.filter(e=>e[0]<=date&&e[1]>=date).forEach(e=>{const tag=document.createElement('span');tag.className='dot'+(global(e)?'':' local');tag.textContent=ko?e[4]:e[3];cell.append(tag)});c.append(cell)}const list=$('events');list.replaceChildren();const inMonth=shown.filter(e=>e[0].slice(0,7)<=start.slice(0,7)&&e[1].slice(0,7)>=start.slice(0,7));if(!inMonth.length){const p=document.createElement('p');p.className='empty';p.textContent=ko?'이번 달에는 해당 이벤트가 없어요.':'No matching events this month.';list.append(p)}inMonth.forEach(e=>{const article=document.createElement('article');article.className='event';const tag=document.createElement('span');tag.className='tag'+(global(e)?'':' local');tag.textContent=global(e)?(ko?'글로벌':'Global'):(ko?'지역별':'Regional');const h=document.createElement('h3');h.textContent=ko?e[4]:e[3];const date=document.createElement('p');date.className='muted';date.textContent=e[0]===e[1]?e[0]:e[0]+' ~ '+e[1];const detail=document.createElement('p');detail.textContent=ko?e[5]:e[6];article.append(tag,h,date,detail);list.append(article)})}
$('prev').onclick=()=>{if(year===2026&&month===9)return;month--;if(month<0){year--;month=11}render()};$('next').onclick=()=>{if(year===2027&&month===11)return;month++;if(month>11){year++;month=0}render()};$('region').onchange=()=>{try{localStorage.setItem('fw-event-region-v2',$('region').value)}catch(e){}render()};$('type').onchange=render;render();
</script></body></html>
