<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOOD ROUTER | Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111324;color:#f5f2ff}main{max-width:920px;margin:auto;padding:24px 16px 65px}a{color:#c7b0ff}.hero,.panel{background:#201e34;border:1px solid #50456f;border-radius:18px;padding:20px;margin:15px 0}.hero{background:linear-gradient(120deg,#3c285e,#20243b)}h1{margin:0;font-size:clamp(28px,6vw,42px)}.muted{color:#cbc5db;line-height:1.65}button,select{border:1px solid #aa92d6;border-radius:10px;background:#3d315c;color:#fff;padding:11px 14px;font:inherit;min-height:44px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffbd76;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{padding:18px;background:#28223c;border:1px solid #665283;border-radius:15px}.pill{display:inline-block;padding:4px 10px;border-radius:30px;background:#47375e;margin:4px 4px 4px 0}.notice{border:1px solid #806b44;border-radius:13px;padding:14px;background:#352c25}.result{margin-top:14px;padding:15px;border:1px solid #8069a8;border-radius:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;margin:8px 0}input{accent-color:#b89cff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#131322;padding:12px;border-radius:12px;max-height:300px;overflow:auto}</style></head><body><main><a href="./index.html">← Formwheel 허브</a><section class="hero"><h1>🧭 MOOD ROUTER</h1><p class="muted">지금 어떤 게임이 끌려? 분위기와 시간을 고르면 추천해 줄게!</p></section><section class="panel"><div class="grid"><div><label for="mood">원하는 분위기</label><select id="mood"><option value="fast">⚡ 빠른 도전</option><option value="relax">🌿 차분한 플레이</option><option value="creative">🎨 창작</option><option value="think">🧠 생각하는 재미</option></select></div><div><label for="minutes">플레이 시간</label><select id="minutes"><option value="3">3분 이내</option><option value="10">10분 이내</option><option value="30">여유롭게</option></select></div></div><p class="muted">선택 내용은 서버에 전송하거나 저장하지 않아.</p><button id="recommend" type="button">게임 추천받기</button></section><section class="panel"><h2>추천 결과</h2><div id="results" class="grid" aria-live="polite"></div></section><p class="notice">게임별 소요 시간은 예상치이며 실제 플레이 시간과 다를 수 있어. 추천은 공개된 게임 링크와 미리 정한 태그를 기준으로 해.</p></main><script>
'use strict';const games=[
{name:'Reflex',emoji:'⚡',moods:['fast'],minutes:3,url:'./reflex.html',why:'짧은 반응속도 도전'},
{name:'Polyrhythm',emoji:'🎵',moods:['fast','think'],minutes:10,url:'./polyrhythm.html',why:'리듬과 타이밍에 집중'},
{name:'Afterbeat',emoji:'🎶',moods:['fast'],minutes:10,url:'./afterbeat.html',why:'리듬게임에 몰입'},
{name:'Cook',emoji:'🍳',moods:['creative','relax'],minutes:10,url:'./cook.html',why:'요리를 자유롭게 조합'},
{name:'Paint',emoji:'🎨',moods:['creative','relax'],minutes:30,url:'./paint.html',why:'그림 그리며 쉬어가기'},
{name:'Maze',emoji:'🌀',moods:['think','relax'],minutes:10,url:'./maze.html',why:'길을 찾는 퍼즐 도전'},
{name:'Clicker',emoji:'🖱️',moods:['relax','fast'],minutes:30,url:'https://semicolonxss.github.io/Formwheel_Clicker/',why:'원하는 속도로 성장'}
];function recommend(){const mood=document.getElementById('mood').value,minutes=Number(document.getElementById('minutes').value);const ranked=games.map(g=>({...g,score:(g.moods.includes(mood)?10:0)+(g.minutes<=minutes?4:0)-Math.max(0,g.minutes-minutes)/10})).sort((a,b)=>b.score-a.score).slice(0,3);const root=document.getElementById('results');root.replaceChildren();for(const g of ranked){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=g.emoji+' '+g.name;const p=document.createElement('p');p.className='muted';p.textContent=g.why+' · 예상 '+g.minutes+'분';const a=document.createElement('a');a.href=g.url;a.textContent='게임 열기 →';card.append(h,p,a);root.append(card)}}document.getElementById('recommend').addEventListener('click',recommend);recommend();</script></body></html>
