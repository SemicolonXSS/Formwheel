<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel EDU · 고등수학 BETA</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
:root{font-family:system-ui,sans-serif;color:#243047;background:#f6f7fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe4ee;padding:16px max(16px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#b34e08}main{max-width:960px;margin:auto;padding:20px 14px 60px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}h2{margin:0 0 10px}p{line-height:1.7}.muted{color:#657084}.card{background:#fff;border:1px solid #e0e4ee;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #1a25430a}button,select{font:inherit;border-radius:11px;padding:11px 15px;border:1px solid #cbd2e2;background:#fff;color:#243047;cursor:pointer;min-height:44px}button.primary{background:#ea741f;border-color:#ea741f;color:white;font-weight:750}button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.choice{display:block;width:100%;text-align:left;margin:8px 0}.choice[aria-pressed=true]{border:2px solid #ea741f;background:#fff2e7}.tag{color:#ad4c0a;font-weight:750}.bar{height:9px;border-radius:9px;background:#e8eaf1;overflow:hidden}.fill{height:100%;background:#ea741f}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}#feedback{border-left:4px solid #ea741f;padding:12px;background:#fff8ef;border-radius:8px;margin-top:10px}small{color:#637086}@media(max-width:520px){.card{padding:15px}header{padding:12px 15px}} </style></head><body>
<header><strong>🎓 Formwheel EDU <small>BETA 0.1</small></strong><a href="./">← Hub로</a></header><main><span class="tag">고등수학 · 함수</span><h1>배우고, 풀고, 성장하자.</h1><p class="muted">합성함수와 역함수를 차근차근 익혀요. 로그인 없이도 이 브라우저에 학습 기록이 저장됩니다.</p>
<section class="card"><div class="row"><strong id="level">EDU Lv. 1</strong><span id="xp">0 XP</span><button id="tutorial" type="button">사용법 보기</button><button id="reset" type="button">EDU 기록 초기화</button></div><div class="bar" aria-label="레벨 진행도"><div id="progress" class="fill" style="width:0%"></div></div><small id="stats"></small></section>
<div class="grid"><section class="card"><h2>🔗 합성함수</h2><p>두 함수를 순서대로 연결해 계산해요.</p><button class="primary" data-topic="composition">학습 시작</button></section><section class="card"><h2>🔁 역함수</h2><p>입력과 출력을 거꾸로 연결해요.</p><button class="primary" data-topic="inverse">학습 시작</button></section></div>
<section id="lesson" class="card hidden"><div class="row"><span id="topic" class="tag"></span><button id="back" type="button">목록으로</button></div><h2 id="lesson-title"></h2><p id="concept"></p><p id="example"></p><button id="practice" class="primary">문제 풀기</button></section>
<section id="quiz" class="card hidden"><div class="row"><strong id="question-count"></strong><span id="score"></span></div><h2 id="question"></h2><div id="choices"></div><button id="check" class="primary" disabled>정답 확인</button><div id="feedback" role="status" class="hidden"></div><button id="next" class="primary hidden">다음 문제</button></section>
<section class="card"><h2>📒 오답 노트</h2><p id="mistakes"></p><button id="retry">오답 다시 풀기</button></section>
<section class="card"><h2>⏱️ 공부 타이머</h2><p id="clock" aria-live="off">00:00</p><div class="row"><button id="start">시작</button><button id="pause">일시정지</button><button id="timer-reset">초기화</button></div></section>
<p class="muted"><small>베타 안내: XP는 이 기기에만 저장되며 Rapid 및 전체 AQS에는 반영되지 않습니다. 친구 대결·문제 제작·계정 동기화는 추후 버전에서 제공됩니다.</small></p></main>
<script>
(()=>{'use strict';const KEY='fw-edu-math-beta-01';const $=id=>document.getElementById(id);
const bank={
composition:{title:'합성함수',concept:'(f∘g)(x)는 g(x)를 먼저 계산한 뒤 그 결과를 f에 넣는 함수입니다. 일반적으로 (f∘g)(x)와 (g∘f)(x)는 달라요.',example:'예: f(x)=2x+1, g(x)=x²이면 (f∘g)(2)=f(4)=9.',questions:[
['f(x)=2x+1, g(x)=x²일 때 (f∘g)(2)는?',['5','9','16','25'],1,'g(2)=4, f(4)=9입니다.'],
['f(x)=x+3, g(x)=2x일 때 (g∘f)(1)은?',['5','6','8','10'],2,'f(1)=4, g(4)=8입니다.'],
['f(x)=x², g(x)=x−1일 때 (f∘g)(3)은?',['2','4','8','9'],1,'g(3)=2, f(2)=4입니다.'],
['f(x)=3x, g(x)=x+2일 때 (f∘g)(x)는?',['3x+2','3x+6','x+6','3x²'],1,'f(g(x))=3(x+2)=3x+6입니다.'],
['f(x)=x+1, g(x)=x²일 때 (g∘f)(2)는?',['5','6','8','9'],3,'f(2)=3, g(3)=9입니다.']
]},
inverse:{title:'역함수',concept:'역함수는 함수의 입력과 출력을 바꿉니다. 정의역에서 일대일인 함수는 치역을 새 정의역으로 하는 역함수를 가질 수 있어요.',example:'예: y=2x+3에서 x와 y를 바꾸고 풀면 f⁻¹(x)=(x−3)/2입니다.',questions:[
['f(x)=2x+3의 역함수는?',['(x−3)/2','2x−3','(x+3)/2','3x+2'],0,'y=2x+3을 x에 대해 풀면 x=(y−3)/2입니다.'],
['f(x)=x−5의 역함수는?',['x−5','5−x','x+5','5x'],2,'y=x−5를 뒤집으면 y=x+5입니다.'],
['f(x)=3x의 역함수는?',['x+3','x/3','3/x','−3x'],1,'y=3x에서 x=y/3입니다.'],
['f(x)=x² (정의역 x≥0)의 역함수는?',['−√x','x/2','√x','x²'],2,'x≥0으로 제한하면 역함수는 √x입니다.'],
['f(x)=x+4일 때 f⁻¹(10)은?',['4','6','10','14'],1,'f⁻¹(x)=x−4이므로 10−4=6입니다.']
]}};
let data={xp:0,solved:{},wrong:{}};try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(s&&typeof s==='object'){data.xp=Math.max(0,Number(s.xp)||0);data.solved=s.solved||{};data.wrong=s.wrong||{};}}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch{}};let topic=null,queue=[],pos=0,selected=null,answered=false,retry=false;
const key=(t,i)=>t+':'+i;function render(){const level=Math.floor(data.xp/100)+1;$('level').textContent='EDU Lv. '+level;$('xp').textContent=data.xp+' XP';$('progress').style.width=(data.xp%100)+'%';$('stats').textContent='완료한 문제 '+Object.keys(data.solved).length+'개 · 오답 '+Object.keys(data.wrong).length+'개';const wrong=Object.keys(data.wrong);$('mistakes').textContent=wrong.length?wrong.map(k=>bank[k.split(':')[0]].title+' '+(Number(k.split(':')[1])+1)+'번').join(' · '):'아직 저장된 오답이 없어요.';$('retry').disabled=!wrong.length;}
function showLesson(t){topic=t;retry=false;$('lesson').classList.remove('hidden');$('quiz').classList.add('hidden');$('topic').textContent=bank[t].title;$('lesson-title').textContent=bank[t].title+' 개념';$('concept').textContent=bank[t].concept;$('example').textContent=bank[t].example;$('lesson').scrollIntoView({behavior:'smooth'});}
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>showLesson(b.dataset.topic));$('back').onclick=()=>{$('lesson').classList.add('hidden');$('quiz').classList.add('hidden');};
function startQuiz(items,isRetry){queue=items;pos=0;retry=isRetry;$('lesson').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion();$('quiz').scrollIntoView({behavior:'smooth'});}
$('practice').onclick=()=>startQuiz(bank[topic].questions.map((_,i)=>[topic,i]),false);
function showQuestion(){if(pos>=queue.length){$('quiz').classList.add('hidden');render();alert('학습 완료! 수고했어요.');return;}selected=null;answered=false;const [t,i]=queue[pos],q=bank[t].questions[i];$('question-count').textContent=bank[t].title+' · '+(pos+1)+'/'+queue.length;$('question').textContent=q[0];$('score').textContent=retry?'오답 복습':'연습 퀴즈';$('choices').replaceChildren();q[1].forEach((v,n)=>{const b=document.createElement('button');b.className='choice';b.textContent=(n+1)+'. '+v;b.setAttribute('aria-pressed','false');b.onclick=()=>{if(answered)return;selected=n;document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');$('check').disabled=false;};$('choices').append(b);});$('check').disabled=true;$('check').classList.remove('hidden');$('next').classList.add('hidden');$('feedback').classList.add('hidden');}
$('check').onclick=()=>{if(answered||selected===null)return;answered=true;const [t,i]=queue[pos],q=bank[t].questions[i],k=key(t,i),correct=selected===q[2];if(correct){if(!data.solved[k]){data.xp+=5;data.solved[k]=true;}delete data.wrong[k];}else{data.wrong[k]=true;}save();render();$('feedback').textContent=(correct?'정답입니다!':'아쉬워요. 정답은 '+(q[2]+1)+'번입니다.')+' '+q[3];$('feedback').classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=pos+1===queue.length?'학습 마치기':'다음 문제';};
$('next').onclick=()=>{pos++;showQuestion();};$('retry').onclick=()=>{const items=Object.keys(data.wrong).map(k=>{const [t,i]=k.split(':');return[t,Number(i)];}).filter(([t,i])=>bank[t]&&bank[t].questions[i]);if(items.length)startQuiz(items,true);};
$('tutorial').onclick=()=>alert('1. 과목을 선택해 개념을 읽으세요.\n2. 문제를 풀고 정답 해설을 확인하세요.\n3. 틀린 문제는 오답 노트에서 다시 풀 수 있어요.\n4. 학습 기록은 이 브라우저에 저장됩니다.');
$('reset').onclick=()=>{if(!confirm('EDU 베타의 이 브라우저 학습 기록만 초기화할까요? 다른 Formwheel 데이터는 유지됩니다.'))return;data={xp:0,solved:{},wrong:{}};save();render();};
let elapsed=0,started=null,interval=null;const display=()=>{const n=elapsed+(started===null?0:Math.floor((Date.now()-started)/1000));$('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};$('start').onclick=()=>{if(started!==null)return;started=Date.now();interval=setInterval(display,1000);};$('pause').onclick=()=>{if(started===null)return;elapsed+=Math.floor((Date.now()-started)/1000);started=null;clearInterval(interval);display();};$('timer-reset').onclick=()=>{elapsed=0;started=null;clearInterval(interval);display();};render();
})();
</script></body></html>
