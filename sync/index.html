<script type="module">

["주말에 친구들과?","보드게임 🎲","영화 🎬","운동 ⚽","요리 🍳"]
];
const MAX_ROUNDS=6,MAX_PLAYERS=6,CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const el=document.getElementById("screen"),notice=document.getElementById("notice");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const codeUrl=c=>location.origin+location.pathname+"?room="+encodeURIComponent(c);
let mode="home",local=null,online=null,roomCode="",uid="",db=null,refFn=null,getFn=null,setFn=null,onValueFn=null,offRoom=null,auth=null;
const rand=n=>{let b=new Uint32Array(1);crypto.getRandomValues(b);return b[0]%n};
const question=(seed,round)=>QUESTIONS[(seed+(round-1)*11)%QUESTIONS.length];
const fmt=(s)=>safe(s).slice(0,50);
function msg(s){notice.innerHTML=s?'<div class="notice">'+safe(s)+'</div>':""}
function stats(round,score,streak){return '<div class="statrow"><div class="stat"><b>'+round+' / '+MAX_ROUNDS+'</b><small>라운드</small></div><div class="stat"><b>'+score+'</b><small>팀 점수</small></div><div class="stat"><b>🔥 '+streak+'</b><small>연속 완벽</small></div></div>'}
function calc(votes,total){const counts=[0,0,0,0];votes.forEach(v=>{if(Number.isInteger(v)&&v>=0&&v<4)counts[v]++});const most=Math.max(...counts);const all=total>=2&&votes.length===total&&most===total;return{points:most?Math.round(most/total*100)+(all?25:0):0,perfect:all,most,counts}}
function options(q){return '<div class="options">'+q.slice(1).map((v,i)=>'<button class="option" data-act="vote" data-choice="'+i+'">'+safe(v)+'</button>').join("")+'</div>'}
function bestScore(){try{return Number(localStorage.getItem("fw-sync-best")||0)}catch{return 0}}
function home(){
mode="home";msg("");
const supplied=new URLSearchParams(location.search).get("room")||"";
el.innerHTML='<h2>🧠 텔레파시 실험실</h2><p class="subtitle">6라운드 동안 서로 같은 답을 골라 봐. 완벽히 일치하면 보너스 +25점! 힌트나 채팅 없이 도전해 봐.</p><div class="modes"><div class="mode"><strong>📱 한 기기 파티</strong><p>2~6명이 같은 기기를 돌아가며 사용해요. 인터넷 없이 바로 플레이!</p><label for="names">참가자 이름 (쉼표로 구분)</label><input id="names" maxlength="100" value="나, 친구" autocomplete="off"><button data-act="localStart" class="wide">즉시 시작</button></div><div class="mode"><strong>🌐 온라인 방</strong><p>각자 휴대폰에서 같은 방에 들어오세요. 로그인 사용자·게스트 모두 참여 가능해요.</p><label for="nickname">내 닉네임</label><input id="nickname" maxlength="16" placeholder="닉네임" autocomplete="nickname"><button data-act="create" class="wide">새 방 만들기</button><label for="joinCode">친구의 6자리 방 코드</label><input id="joinCode" maxlength="6" value="'+safe(supplied.replace(/[^A-Z0-9]/gi,"").toUpperCase().slice(0,6))+'" placeholder="ABC123" autocapitalize="characters"><button data-act="join" class="wide secondary">방 참가하기</button></div></div><p class="subtitle" style="margin-top:19px">🏆 이 기기 최고 팀 점수: <b>'+bestScore()+'점</b></p>';
}
function localStart(){
const raw=document.getElementById("names").value.split(",").map(x=>x.trim().slice(0,16)).filter(Boolean);
if(raw.length<2||raw.length>MAX_PLAYERS){msg("참가자 이름을 2~6개 입력해 줘.");return}
local={players:raw,round:1,turn:0,answers:{},phase:"answer",seed:rand(QUESTIONS.length),score:0,streak:0,roundPoints:0};
mode="local";msg("");renderLocal()
}
function renderLocal(){
const l=local,q=question(l.seed,l.round);
if(l.phase==="answer"){
const current=l.players[l.turn];
el.innerHTML='<div class="badges"><span class="tag">📱 한 기기 파티</span><span class="tag">서로 답을 보지 마세요!</span></div>'+stats(l.round,l.score,l.streak)+'<p class="subtitle">'+safe(l.players.join(" · "))+'</p><h2>🎯 '+safe(current)+'의 차례</h2><p class="big">'+safe(q[0])+'</p>'+options(q)+'<p class="subtitle" style="margin-top:15px">답을 누르면 자동으로 다음 사람 차례로 넘어가요.</p>';
}else if(l.phase==="reveal") {
el.innerHTML=results(q,l.players.map((name,i)=>({name,choice:l.answers[i]})),l.players.length,l.roundPoints,l.streak,l.round,l.score) + '<button class="wide" data-act="localNext">'+(l.round===MAX_ROUNDS?"최종 결과 보기":"다음 라운드 →")+'</button>';
}else if(l.phase==="end"){
el.innerHTML='<div class="result">🏆 SYNC COMPLETE<small>최종 팀 점수</small>'+l.score+'점</div>'+stats(MAX_ROUNDS,l.score,l.streak)+'<p class="subtitle">오늘 팀의 텔레파시 기록! 다른 친구들과도 도전해 봐.</p><div class="actions"><button data-act="localRestart">다시 플레이</button><button class="secondary" data-act="home">메뉴로</button></div>'
}
}
function results(q,entries,total,points,streak,round,score){
const c=calc(entries.map(x=>x.choice).filter(x=>Number.isInteger(x)),total);
let badge=c.perfect?"💫 완벽한 싱크!":"✨ 가장 많이 고른 답이 일치했어!";
return '<div class="badges"><span class="tag">결과 공개</span><span class="tag">ROUND '+round+'</span></div>'+stats(round,score,streak)+'<h2>'+safe(q[0])+'</h2><div class="result">'+badge+'<small>이번 라운드 +'+points+'점</small></div><div class="votes">'+entries.map(x=>'<div class="vote"><span>'+safe(x.name)+'</span><b>'+safe(Number.isInteger(x.choice)?q[x.choice+1]:"미제출")+'</b></div>').join("")+'</div>'
}
function localNext(){
if(local.phase!=="reveal")return;
if(local.round===MAX_ROUNDS){local.phase="end";saveBest(local.score)}
else{local.round++;local.turn=0;local.answers={};local.phase="answer"}
renderLocal()
}
function saveBest(score){try{const prev=Number(localStorage.getItem("fw-sync-best")||0);if(score>prev)localStorage.setItem("fw-sync-best",String(score))}catch{}}
async function initFirebase(){
if(auth)return auth.currentUser||await login();
const [fa,fu,fd]=await Promise.all([
import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js")]);
const config={apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",storageBucket:"formwheel.firebasestorage.app",messagingSenderId:"431583088241",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0"};
const app=fa.getApps().find(x=>x.name==="[DEFAULT]")||fa.initializeApp(config);
auth=fu.getAuth(app);db=fd.getDatabase(app);refFn=fd.ref;getFn=fd.get;setFn=fd.set;onValueFn=fd.onValue;
window._syncSignIn=fu.signInAnonymously;window._syncAuthChanged=fu.onAuthStateChanged;
return auth.currentUser||await login()
}
async function login(){
return new Promise((resolve,reject)=>{const stop=window._syncAuthChanged(auth,async user=>{if(user){stop();uid=user.uid;resolve(user)}else{stop();try{const result=await window._syncSignIn(auth);uid=result.user.uid;resolve(result.user)}catch(e){reject(e)}}},reject)})
}
function nickname(){const input=document.getElementById("nickname");return(input?.value||"").trim().slice(0,16)}
function randomCode(){const b=new Uint8Array(6);crypto.getRandomValues(b);return Array.from(b,x=>CHARS[x%CHARS.length]).join("")}
function roomPath(p=""){return "syncRooms/"+roomCode+(p?"/"+p:"")}
async function createOnline(){
const name=nickname();if(!name){msg("먼저 닉네임을 입력해 줘.");return}
msg("온라인 방을 연결하고 있어요…");
try{const user=await initFirebase();uid=user.uid;let code=randomCode();let path="syncRooms/"+code;
for(let i=0;i<4;i++){const snap=await getFn(refFn(db,path));if(!snap.exists())break;code=randomCode();path="syncRooms/"+code}
roomCode=code;
await setFn(refFn(db,roomPath()),{hostUid:uid,seed:rand(QUESTIONS.length),createdAt:Date.now(),players:{[uid]:{name,joinedAt:Date.now()}},state:{phase:"lobby",round:0,score:0,streak:0,updatedAt:Date.now()},answers:{}});
subscribeRoom();mode="online";msg("");history.replaceState(null,"",location.pathname+"?room="+code)
}catch(e){msg("방 생성 실패: "+(e.code||e.message||"연결 오류")+". Firebase 인증 및 데이터베이스 규칙을 확인해 주세요.")}
}
async function joinOnline(){
const name=nickname(),code=(document.getElementById("joinCode")?.value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
if(!name){msg("닉네임을 먼저 입력해 줘.");return}if(code.length!==6){msg("6자리 방 코드를 입력해 줘.");return}
msg("참가하고 있어요…");
try{const user=await initFirebase();uid=user.uid;roomCode=code;
const snap=await getFn(refFn(db,roomPath()));if(!snap.exists())throw new Error("이 방을 찾지 못했어요");
const r=snap.val();if(r.state?.phase!=="lobby"&&!r.players?.[uid])throw new Error("이미 시작된 게임이에요");
if(Object.keys(r.players||{}).length>=MAX_PLAYERS&&!r.players?.[uid])throw new Error("최대 6명까지 참가할 수 있어요");
await setFn(refFn(db,roomPath("players/"+uid)),{name,joinedAt:Date.now()});
subscribeRoom();mode="online";msg("");history.replaceState(null,"",location.pathname+"?room="+code)
}catch(e){msg("참가 실패: "+(e.code||e.message||"연결 오류"))}
}
function subscribeRoom(){
if(offRoom){offRoom();offRoom=null}mode="online";
offRoom=onValueFn(refFn(db,roomPath()),snap=>{online=snap.val();if(!online){msg("방이 종료되었어요");home();return}renderOnline()},err=>msg("실시간 연결 실패: "+(err.code||"권한 오류")+". Firebase 규칙을 확인해 주세요."))
}
function members(){return Object.entries(online?.players||{}).map(([id,p])=>({id,name:p.name||"게스트"}))}
function currentAnswers(){
return members().map(p=>({...p,choice:online?.answers?.[p.id]?.round===online.state.round?online.answers[p.id].choice:null}))
}
function renderOnline(){
if(mode!=="online"||!online)return;
const s=online.state,people=members(),q=question(online.seed,Math.max(1,s.round)),host=online.hostUid===uid,
mine=people.some(p=>p.id===uid),choices=currentAnswers(),answered=choices.filter(p=>Number.isInteger(p.choice)).length;
const head='<div class="badges"><span class="tag">🌐 온라인 멀티플레이</span><span class="tag">'+safe(host?"👑 방장":"참가자")+'</span></div><div class="roomcode">'+safe(roomCode)+'</div><p class="linkbox">'+safe(codeUrl(roomCode))+'</p><div class="actions"><button class="secondary" data-act="copyLink">🔗 초대 링크 복사</button><button class="secondary" data-act="leave">← 나가기</button></div><div class="players">'+people.map(p=>'<span class="person '+(choices.find(c=>c.id===p.id&&Number.isInteger(c.choice))?"done":"")+'">'+safe(p.name)+(p.id===online.hostUid?" 👑":"")+'</span>').join("")+'</div>';
if(s.phase==="lobby"){
el.innerHTML=head+'<h2>🎮 참가자 대기 중 ('+people.length+'/'+MAX_PLAYERS+')</h2><p class="subtitle">친구들에게 링크나 방 코드를 공유해 줘. 2명 이상 모이면 시작할 수 있어.</p>'+(host?'<button class="wide" data-act="start" '+(people.length<2?"disabled":"")+'>6라운드 시작!</button>':'<div class="notice">방장이 시작 버튼을 누르면 게임이 시작돼요.</div>');
}else if(s.phase==="answer"){
const done=choices.find(x=>x.id===uid&&Number.isInteger(x.choice));const expired=Date.now()-(s.updatedAt||0)>40000;
el.innerHTML=head+stats(s.round,s.score,s.streak)+'<h2>🎯 '+safe(q[0])+'</h2>'+(done?'<div class="notice">✅ 제출 완료! 결과가 공개될 때까지 다른 사람을 기다려 줘.</div>':mine?options(q):'<div class="notice">관전 중이에요.</div>')+'<p class="subtitle" style="margin-top:13px">제출 '+answered+' / '+people.length+'명 · 선택 결과는 공개 전까지 숨겨져요.</p>'+(host?'<button class="wide secondary" data-act="reveal" '+(answered===people.length||expired?"":"disabled")+'>'+((answered===people.length)?"결과 공개 ✨":expired?"미제출자 제외하고 결과 공개":"모두 제출하면 결과 공개 가능")+'</button>':'');
}else if(s.phase==="reveal"){
el.innerHTML=head+results(q,choices,people.length,s.roundPoints||0,s.streak,s.round,s.score)+(host?'<button class="wide" data-act="next">'+(s.round===MAX_ROUNDS?"최종 결과 보기":"다음 라운드 →")+'</button>':'<div class="notice">방장이 다음 라운드를 진행할 거예요.</div>');
}else{
saveBest(s.score);
el.innerHTML=head+'<div class="result">🏆 SYNC COMPLETE<small>최종 팀 점수</small>'+s.score+'점</div>'+stats(MAX_ROUNDS,s.score,s.streak)+(host?'<button class="wide" data-act="restart">새 게임 시작 준비</button>':'<div class="notice">방장이 새로운 게임을 준비할 수 있어요.</div>');
}
}
async function stateTo(next){
try{await setFn(refFn(db,roomPath("state")),next)}catch(e){msg("진행 실패: "+(e.code||e.message||"데이터베이스 오류"))}
}
async function onlineAct(action,choice){
if(!online||mode!=="online")return;
const s=online.state,host=online.hostUid===uid,people=members(),votes=currentAnswers();
try{
if(action==="vote"){
if(s.phase!=="answer"||!people.some(p=>p.id===uid))return;
if(online.answers?.[uid]?.round===s.round)return;
await setFn(refFn(db,roomPath("answers/"+uid)),{round:s.round,choice});return
}
if(!host)return;
if(action==="start"&&s.phase==="lobby"&&people.length>=2)await stateTo({phase:"answer",round:1,score:0,streak:0,updatedAt:Date.now(),roundPoints:0});
if(action==="reveal"&&s.phase==="answer"){
const m=calc(votes.map(x=>x.choice).filter(Number.isInteger),people.length);
if(m.most===0)return;
if(votes.filter(x=>Number.isInteger(x.choice)).length<people.length&&Date.now()-s.updatedAt<40000)return;
await stateTo({phase:"reveal",round:s.round,score:s.score+m.points,streak:m.perfect?s.streak+1:0,updatedAt:Date.now(),roundPoints:m.points})
}
if(action==="next"&&s.phase==="reveal")await stateTo(s.round===MAX_ROUNDS?{...s,phase:"end",updatedAt:Date.now()}:{phase:"answer",round:s.round+1,score:s.score,streak:s.streak,updatedAt:Date.now(),roundPoints:0});
if(action==="restart"&&s.phase==="end")await stateTo({phase:"lobby",round:0,score:0,streak:0,updatedAt:Date.now(),roundPoints:0})
}catch(e){msg("작업 실패: "+(e.code||e.message||"연결 오류"))}
}
async function leave(){
if(mode==="online"&&online&&uid&&db){
 const isHost=online.hostUid===uid;
 if(isHost&&!confirm("방장이 나가면 이 온라인 방이 종료돼요. 종료할까요?"))return;
 try{await setFn(refFn(db,isHost?roomPath():roomPath("players/"+uid)),null)}
 catch(e){msg("퇴장 처리 실패: "+(e.code||e.message||"연결 오류"));return}
}
if(offRoom){offRoom();offRoom=null}online=null;roomCode="";history.replaceState(null,"",location.pathname);home()
}
document.addEventListener("click",async e=>{
const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
const a=b.dataset.act;
if(a==="home"){home();return}
if(a==="localStart"){localStart();return}
if(a==="localRestart"){localStartFromSaved();return}
if(a==="localNext"){localNext();return}
if(a==="vote"){const n=Number(b.dataset.choice);if(mode==="local"&&local?.phase==="answer"){local.answers[local.turn]=n;local.turn++;if(local.turn===local.players.length){const m=calc(Object.values(local.answers),local.players.length);local.roundPoints=m.points;local.score+=m.points;local.streak=m.perfect?local.streak+1:0;local.phase="reveal"}renderLocal()}else if(mode==="online")await onlineAct("vote",n);return}
if(a==="create"){await createOnline();return}
if(a==="join"){await joinOnline();return}
if(a==="leave"){await leave();return}
if(a==="copyLink"){try{await navigator.clipboard.writeText(codeUrl(roomCode));msg("초대 링크를 복사했어! 친구에게 보내 줘.")}catch{msg("위에 표시된 초대 링크를 길게 눌러 복사해 줘.")}return}
if(["start","reveal","next","restart"].includes(a)){await onlineAct(a);return}
});
function localStartFromSaved(){if(!local)return;local={...local,round:1,turn:0,answers:{},phase:"answer",seed:rand(QUESTIONS.length),score:0,streak:0,roundPoints:0};renderLocal()}
setInterval(()=>{if(mode==="online"&&online?.state?.phase==="answer")renderOnline()},6000);
home();
</script>
</body></html>
