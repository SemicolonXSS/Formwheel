<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111225"><title>Grid | Formwheel</title><meta name="description" content="Formwheel Grid의 미로와 아이템을 탐험하세요."><link rel="icon" href="./assets/formwheel-favicon.svg" type="image/svg+xml"><style>
:root{font-family:system-ui,sans-serif;color:#f4f0ff;background:#111225}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:850px;margin:auto}header,.hud,.inventory,.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:24px}a{color:#cbbaff}.panel{background:#20213a;border:1px solid #424365;border-radius:16px;padding:14px;margin-top:12px}.hud span{background:#343453;padding:9px 12px;border-radius:10px;font-weight:700}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:520px;margin:14px auto}.tile{aspect-ratio:1;border:0;border-radius:8px;background:#363854;color:white;font-size:clamp(17px,4vw,28px);cursor:pointer;display:grid;place-items:center}.wall{background:#171829}.player{background:#7856c8}.exit{background:#21664b}.tile:focus-visible,button:focus-visible{outline:3px solid #fbbf24}button{border:1px solid #7773a6;border-radius:10px;background:#4a416e;color:white;padding:10px 15px;cursor:pointer;font-weight:700}button:hover{background:#64538f}button:disabled{opacity:.4;cursor:not-allowed}.inventory{justify-content:flex-start}.item{position:relative}.item:hover::after,.item:focus-visible::after{content:attr(data-tip);position:absolute;bottom:110%;left:0;background:#101020;border:1px solid #a99edb;padding:9px;border-radius:8px;white-space:nowrap;font-size:12px;z-index:3}.controls{justify-content:center}.controls button{min-width:48px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f2eaff;color:#21183b;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0008;z-index:10;max-width:90vw;text-align:center}.help{color:#c6c5db;font-size:13px;text-align:center}@media(max-width:520px){body{padding:9px}.panel{padding:9px}.board{gap:3px}.tile{border-radius:5px}}
</style><style id="fw-skip-link-style">.fw-skip-link{position:fixed;inset-inline-start:12px;top:12px;z-index:2147483647;padding:12px 16px;border:2px solid #24205a;border-radius:9px;background:#fff;color:#24205a;font:700 16px/1.4 system-ui,sans-serif;text-decoration:none;transform:translateY(-220%)}.fw-skip-link:focus{transform:none;outline:3px solid #ff9a21;outline-offset:2px}</style></head><body><a class="fw-skip-link" href="#fw-main-content">본문으로 바로가기</a><main id="fw-main-content" tabindex="-1"><header><h1>🧩 Formwheel_Grid</h1><a href="./index.html">← Hub</a></header><section class="panel"><div class="hud"><span id="hp">❤️ 7 / 10</span><span id="stage">STAGE 01</span><span id="keys">🗝️ 0</span></div><div id="board" class="board" role="group" aria-label="게임 격자"></div><p id="status" class="help" aria-live="polite">열쇠를 찾아 문을 열고 출구로 가세요.</p><div class="inventory"><button id="potion" class="item" data-tip="회복 포션: 체력 3 회복 (Space)">🧪 포션 ×1</button><button id="key" class="item" data-tip="잠긴 문에 닿으면 열쇠가 자동으로 사용됩니다.">🗝️ 열쇠 ×0</button><button id="reset">↻ 다시 시작</button></div></section><section class="panel"><div class="controls"><button data-move="0,-1">↑</button><button data-move="-1,0">←</button><button data-move="0,1">↓</button><button data-move="1,0">→</button></div><p class="help">WASD / 방향키 이동 · Space 포션 · 칸 클릭 이동 · 아이템에 마우스를 올리면 설명</p></section></main><div id="toast" class="toast" role="status" hidden></div><script>
"use strict";
const original=["########","#P..H..#","#.##.#.#","#..K.#.#","##.#.D.#","#..T...#","#...E..#","########"];
const icons={"#":"🧱",H:"🧪",K:"🗝️",D:"🚪",T:"⚠️",E:"🏁"};
let map,pos,hp,potions,keys,done,toastTimer;
const $=id=>document.getElementById(id);
function notify(msg){$("status").textContent=msg;$("toast").textContent=msg;$("toast").hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").hidden=true,2200)}
function reset(){map=original.map(r=>r.split(""));pos=[1,1];hp=7;potions=1;keys=0;done=false;render();notify("새 탐험 시작!")}
function render(){$("hp").textContent="❤️ "+hp+" / 10";$("keys").textContent="🗝️ "+keys;$("potion").textContent="🧪 포션 ×"+potions;$("key").textContent="🗝️ 열쇠 ×"+keys;$("potion").disabled=done||potions===0||hp===10;const board=$("board");board.replaceChildren();map.forEach((row,y)=>row.forEach((cell,x)=>{const b=document.createElement("button");b.className="tile"+(cell==="#"?" wall":"")+(cell==="E"?" exit":"")+(pos[0]===x&&pos[1]===y?" player":"");b.textContent=pos[0]===x&&pos[1]===y?"🙂":icons[cell]||"";b.title=({"#":"벽",H:"회복 포션 +1",K:"열쇠 +1",D:"열쇠로 열 수 있는 문",T:"함정: HP -2",E:"출구"}[cell]||"빈 칸");b.setAttribute("aria-label",b.title);b.addEventListener("click",()=>{const dx=x-pos[0],dy=y-pos[1];if(Math.abs(dx)+Math.abs(dy)===1)move(dx,dy);else notify("인접한 칸을 클릭하세요.")});board.appendChild(b)}))}
function move(dx,dy){if(done)return;const x=pos[0]+dx,y=pos[1]+dy;const cell=map[y]?.[x];if(!cell||cell==="#"){notify("🧱 벽이 막고 있어요!");return}if(cell==="D"&&keys===0){notify("🔒 열쇠가 필요해요!");return}let msg="이동 완료";if(cell==="K"){keys++;msg="🗝️ 열쇠 획득!"}if(cell==="H"){potions++;msg="🧪 회복 포션 획득!"}if(cell==="D"){keys--;msg="🔓 문 개방!"}if(cell==="T"){hp=Math.max(0,hp-2);msg="⚠️ 함정! 체력 -2"}pos=[x,y];if(cell!=="E")map[y][x]=".";if(hp===0){done=true;msg="💔 게임 오버! 다시 시작해보세요."}else if(cell==="E"){done=true;msg="🏆 STAGE CLEAR!"}render();notify(msg)}
function drink(){if(done||potions===0)return;if(hp===10){notify("체력이 이미 가득 찼어요.");return}potions--;hp=Math.min(10,hp+3);render();notify("🧪 회복 포션 사용! 체력 +3")}
$("potion").addEventListener("click",drink);$("key").addEventListener("click",()=>notify("🗝️ 문에 접근하면 자동 사용됩니다."));$("reset").addEventListener("click",reset);
document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>move(...b.dataset.move.split(",").map(Number))));
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;const moves={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};const k=e.key.length===1?e.key.toLowerCase():e.key;if(moves[k]){e.preventDefault();move(...moves[k])}else if(e.code==="Space"){e.preventDefault();drink()}});
reset();
</script>
<!-- Formwheel optional game sharing: no login, tracking or database writes. -->
<div id="fw-game-share" role="region" aria-label="친구와 게임 공유" style="max-width:740px;margin:24px auto;padding:18px;text-align:center;background:#25203c;color:#f8f5ff;border:1px solid #655588;border-radius:16px;font:16px/1.5 system-ui,sans-serif">
<strong>🎮 친구와 이 게임 공유하기</strong>
<p style="margin:8px 0;color:#d5c9ef;font-size:14px">재미있었다면 친구에게 도전 링크를 보내 보세요!</p>
<button type="button" id="fw-game-share-btn" style="cursor:pointer;padding:11px 19px;min-height:44px;border:0;border-radius:11px;background:#c5a6ff;color:#1b1230;font:700 15px system-ui,sans-serif">📤 공유하기</button>
<a href="https://semicolonxss.github.io/Formwheel/promotion.html" style="display:inline-block;padding:10px 14px;color:#e9d8ff;text-decoration:underline">🎡 홍보 카드 · QR 만들기</a>
<p id="fw-game-share-status" role="status" aria-live="polite" style="font-size:13px;min-height:1.5em;margin:8px 0 0;color:#f4dba8"></p>
</div>
<script>
(function(){
const button=document.getElementById('fw-game-share-btn');
const status=document.getElementById('fw-game-share-status');
const u=new URL(location.href);u.hash='';u.search='';
u.searchParams.set('utm_source','formwheel_game_share');u.searchParams.set('utm_medium','friend');
button.addEventListener('click',async function(){
const url=u.href;
try{
if(navigator.share){await navigator.share({title:document.title,text:'🎮 Formwheel에서 이 게임에 도전해 봐!',url:url});return;}
if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);status.textContent='링크를 복사했어요!';return;}
status.textContent='공유 주소: '+url;
}catch(e){if(e&&e.name==='AbortError')return;status.textContent='공유 주소: '+url;}
});
})();
</script>
</body></html>
