<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>배지 통계 · Formwheel</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25233f;background:#f7f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:20px}header{background:#fff;border-bottom:1px solid #e8e7f1;padding:18px}header a{color:#6550c9;text-decoration:none;font-weight:800}.panel{background:white;border:1px solid #e8e7f1;border-radius:18px;padding:20px;margin:15px 0}button{background:#6250c7;color:white;border:0;border-radius:10px;padding:10px 15px;font:inherit;cursor:pointer}button:disabled{opacity:.5}input{font:inherit;padding:12px;border:1px solid #ddd;border-radius:10px;width:100%;max-width:330px}.muted{color:#68687c;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.badge{border:1px solid #dedbef;border-radius:13px;padding:14px;text-align:left;background:#faf9ff;color:#25233f;width:100%}.badge strong{display:block;font-size:19px}.badge span{display:block;color:#6250c7;margin-top:6px}.person{padding:10px;border-bottom:1px solid #eee;overflow-wrap:anywhere}h1{margin:12px 0}#status{white-space:pre-wrap}#results[hidden],#detail[hidden]{display:none}
</style></head><body><header><a href="/Formwheel/">← Formwheel Hub</a></header><main>
<h1>🏅 배지 보유 현황</h1><p class="muted">관리자 전용 · AQS 클라우드 저장 기록 기준 · 같은 사용자가 같은 배지를 여러 번 획득해도 1명으로 계산</p>
<section class="panel"><p id="status" role="status">로그인 상태 확인 중…</p><button id="login" hidden>Google 계정으로 로그인</button><button id="refresh" hidden>통계 새로고침</button></section>
<section id="results" hidden><div class="panel"><h2 id="summary">배지 통계</h2><input id="filter" placeholder="배지 이름 검색" aria-label="배지 이름 검색"><p class="muted">배지를 누르면 보유자 목록이 표시돼요.</p><div class="grid" id="badges"></div></div><div class="panel" id="detail" hidden><h2 id="detailTitle"></h2><div id="people"></div></div></section>
</main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const app=initializeApp({apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0"});
const auth=getAuth(app), db=getDatabase(app), owner='not404spam@gmail.com';
const $=id=>document.getElementById(id), status=$('status');
let stats=[],users={},profiles={};
function nameFor(uid){const p=profiles[uid]||{},u=users[uid]||{};return String(p.nickname||p.displayName||p.name||u.nickname||u.displayName||u.name||'닉네임 미등록')}
function profileId(uid){const p=profiles[uid]||{};return String(p.formwheelId||p.publicId||p.username||'')}
function showDetail(b){$('detail').hidden=false;$('detailTitle').textContent=b.name+' · '+b.holders.length+'명';const list=$('people');list.replaceChildren();b.holders.forEach(({uid,date})=>{const row=document.createElement('div');row.className='person';const main=document.createElement('strong');main.textContent=nameFor(uid);row.append(main);const sub=document.createElement('div');sub.className='muted';sub.textContent=(profileId(uid)?'Formwheel ID: '+profileId(uid)+' · ':'')+'내부 계정: '+uid.slice(0,6)+'…'+(Number(date)?' · 획득: '+new Date(Number(date)).toLocaleString('ko-KR'):'');row.append(sub);list.append(row)});if(!b.holders.length)list.textContent='보유자가 없어요';$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function render(){let q=$('filter').value.trim().toLowerCase();const target=$('badges');target.replaceChildren();for(const b of stats.filter(b=>b.name.toLowerCase().includes(q))){const btn=document.createElement('button');btn.className='badge';const title=document.createElement('strong');title.textContent=b.name;const count=document.createElement('span');count.textContent=b.holders.length+'명 보유';btn.append(title,count);btn.onclick=()=>showDetail(b);target.append(btn)}if(!target.childElementCount)target.textContent='검색 결과가 없어요'}
async function load(){if(auth.currentUser?.email?.toLowerCase()!==owner){status.textContent='지정된 관리자 계정으로 로그인해야 해요.';return}status.textContent='Firebase 데이터 조회 중…';$('results').hidden=true;try{const [a,p,u]=await Promise.all([get(ref(db,'aqs/v1/users')),get(ref(db,'profiles')).catch(()=>null),get(ref(db,'users')).catch(()=>null)]);const all=a.val()||{};profiles=p?.val()||{};users=u?.val()||{};const groups=new Map();for(const [uid,state] of Object.entries(all)){if(!state||typeof state!=='object')continue;const unlocked=state.unlocked||{};for(const [id,date] of Object.entries(unlocked)){if(!date)continue;let entry=groups.get(id);if(!entry){entry={id,name:id,holders:[]};groups.set(id,entry)}entry.holders.push({uid,date})}}stats=[...groups.values()].sort((a,b)=>b.holders.length-a.holders.length);$('summary').textContent='배지 '+stats.length+'종 · 클라우드 사용자 '+Object.keys(all).length+'명';status.textContent='통계 조회 완료 · 서버 규칙으로 관리자 권한이 검증되어야 합니다.';$('results').hidden=false;render()}catch(e){status.textContent='데이터를 불러올 수 없어요. Firebase Database Rules에서 관리자 계정 UID에 aqs/v1/users 읽기 권한을 설정했는지 확인해 주세요.\n오류: '+(e?.code||e?.message||'unknown')}}
}
$('filter').addEventListener('input',render);$('refresh').onclick=load;$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='로그인 실패: '+(e.code||e.message)}};
onAuthStateChanged(auth,user=>{const ok=!!user&&user.email?.toLowerCase()===owner;$('login').hidden=ok;$('refresh').hidden=!ok;if(ok)load();else{$('results').hidden=true;status.textContent=user?'현재 계정은 관리자 이메일과 일치하지 않아요. 다른 계정으로 로그인해 주세요.':'관리자 Google 계정으로 로그인해 주세요.'}});
</script></body></html>
