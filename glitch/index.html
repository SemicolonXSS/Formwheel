<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#342057,#100d20 65%);color:#f5f2ff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:820px;margin:auto;padding:18px 14px 28px}a{color:#cfc4ff}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:12px 0 2px;font-size:clamp(30px,7vw,48px);letter-spacing:3px;text-shadow:3px 0 #f443ae,-3px 0 #6bffeb}.sub{color:#bab2d3;font-size:13px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 10px}.stat{background:#241b3e;border:1px solid #4b3a71;border-radius:12px;text-align:center;padding:9px 4px}.stat strong{font-size:23px;display:block}.stat small{color:#c6bddd}.banner{background:#3b255d;border:1px solid #7d5fb9;border-radius:12px;padding:12px;text-align:center;min-height:68px}.banner b{display:block;color:#8dffee;font-size:17px}.banner span{font-size:13px;color:#e2daf8}.bar{height:7px;background:#261b40;border-radius:12px;overflow:hidden;margin:9px 0 13px}.bar div{height:100%;background:linear-gradient(90deg,#69ffdf,#dc74fe);width:100%}canvas{display:block;width:100%;aspect-ratio:1.55;background:#17122b;border:2px solid #60478d;border-radius:14px;touch-action:none}button{background:#7352d6;border:1px solid #a78bfa;color:white;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.5}.actions{display:flex;justify-content:center;gap:9px;margin-top:12px;flex-wrap:wrap}.help{text-align:center;color:#c8bfdc;font-size:13px;line-height:1.6}.pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,52px);gap:7px;justify-content:center;margin:15px auto}.pad button{padding:5px;touch-action:none;user-select:none;-webkit-user-select:none}.pad button[data-d="up"]{grid-column:2}.pad button[data-d="left"]{grid-row:2;grid-column:1}.pad button[data-d="down"]{grid-row:2;grid-column:2}.pad button[data-d="right"]{grid-row:2;grid-column:3}.result{margin-top:10px;text-align:center;font-weight:700;min-height:25px}.foot{margin-top:18px;color:#a89dbf;text-align:center;font-size:12px}@media(min-width:700px){.pad{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><div class="head"><a href="/Formwheel/">← Formwheel Hub</a><span class="sub">EXPERIMENT #001 · v1.1</span></div><h1>GLITCH<span style="color:#8dffee">_</span></h1><div class="sub">규칙이 무너져도 살아남을 수 있을까?</div>
<div class="hud"><div class="stat"><strong id="hp">♥♥♥</strong><small>HP</small></div><div class="stat"><strong id="time">120</strong><small>남은 시간</small></div><div class="stat"><strong id="score">0</strong><small>점수</small></div></div>
<div class="banner" aria-live="polite"><b id="rule">NORMAL MODE</b><span id="desc">5~10초마다 GLITCH 발생!</span></div><div class="bar"><div id="progress"></div></div>
<canvas id="game" width="720" height="460" aria-label="GLITCH 생존 게임"></canvas><div class="actions"><button id="start">▶ 게임 시작</button><button id="pause" disabled>Ⅱ 일시정지</button></div><div class="result" id="result" role="status"></div>
<div class="pad" aria-label="모바일 이동 버튼"><button data-d="up" aria-label="위">▲</button><button data-d="left" aria-label="왼쪽">◀</button><button data-d="down" aria-label="아래">▼</button><button data-d="right" aria-label="오른쪽">▶</button></div><p class="help">PC: WASD 또는 방향키 · 모바일: 화면의 방향 버튼<br>빨간 장애물을 피하고 ✦ 에너지 조각을 모으세요. HP가 0이면 게임 종료!</p><div class="foot">Formwheel · Semicolon & Secol</div></main>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,$=id=>document.getElementById(id),keys=new Set();
let run=false,paused=false,elapsed=0,last=0,hp=3,score=0,inv=0,nextChange=5+Math.random()*5,ruleStart=0,touchDone=false,rule='normal',player={x:W/2,y:H/2,r:13},enemies=[],gems=[],spawn=0,nextGem=0,raf=0;
const rules=[["reverse","↔ 조작 반전","이동 방향이 반대로 됩니다!"],["fast","⚡ 속도 폭주","이동 속도가 1.7배!"],["slow","🐢 속도 저하","이동 속도가 감소!"],["dark","🌑 암흑","주변만 보입니다!"],["danger","☄ 위험 증폭","장애물이 크고 빨라집니다!"],["touch","❤️ 위험 접촉","10초 안에 빨간 장애물에 닿으세요! 실패하면 HP -1"],["tiny","🔬 초소형","캐릭터 크기 감소!"],["giant","🪐 거대화","캐릭터 크기 증가!"],["shield","🛡 무적 모드","장애물 피해를 받지 않아요!"],["bonus","💎 점수 폭발","에너지 점수가 3배!"],["scarcity","👻 에너지 소멸","에너지를 일시적으로 수집할 수 없어요!"],["freeze","❄ 얼어붙은 적","장애물 속도가 크게 감소!"],["rush","🌪 적의 폭주","장애물 생성이 빨라집니다!"],["heal","💚 회복","HP 1 회복!"]];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function entity(list,r){let p;for(let i=0;i<25;i++){p={x:rand(r+10,W-r-10),y:rand(r+10,H-r-10),r};if(Math.hypot(p.x-player.x,p.y-player.y)>95)break}list.push(p)}
function begin(){run=true;paused=false;elapsed=0;hp=3;score=0;inv=0;nextChange=5+Math.random()*5;ruleStart=0;touchDone=false;rule='normal';spawn=0;nextGem=0;player={x:W/2,y:H/2,r:13};enemies=[];gems=[];keys.clear();for(let i=0;i<3;i++)entity(gems,8);$('start').textContent='↻ 다시 시작';$('pause').disabled=false;$('pause').textContent='Ⅱ 일시정지';$('result').textContent='';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);sync()}
function change(){if(rule==='touch'&&!touchDone){hp=Math.max(0,hp-1);$('result').textContent='⏰ 접촉 실패! HP -1'}
if(hp<=0){end(false);return}
const options=rules.filter(v=>v[0]!==rule),selected=options[Math.floor(Math.random()*options.length)];
rule=selected[0];ruleStart=elapsed;touchDone=false;player.r=rule==='tiny'?8:rule==='giant'?23:13;
if(rule==='heal')hp=Math.min(3,hp+1);
$('rule').textContent=selected[1];$('desc').textContent=selected[2];
nextChange=elapsed+(rule==='touch'?10:5+Math.random()*5)}
function sync(){$('hp').textContent='♥'.repeat(hp)+'♡'.repeat(3-hp);$('time').textContent=Math.ceil(Math.max(0,120-elapsed));$('score').textContent=Math.floor(score);$('progress').style.width=(Math.max(0,nextChange-elapsed)/Math.max(.001,nextChange-ruleStart)*100)+'%'}
function end(win){run=false;$('pause').disabled=true;$('result').textContent=win?'🏆 생존 성공! 최종 점수 '+Math.floor(score)+'점':'💥 GAME OVER · '+Math.floor(score)+'점';$('rule').textContent=win?'SURVIVED':'SYSTEM FAILED';$('desc').textContent='다시 시작해 기록을 갱신하세요.';keys.clear();cancelAnimationFrame(raf)}
function update(dt){elapsed=Math.min(120,elapsed+dt);if(elapsed>=nextChange){change();if(!run)return}
let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));if(rule==='reverse'){dx=-dx;dy=-dy}const len=Math.hypot(dx,dy)||1,speed=rule==='fast'?350:rule==='slow'?110:205;player.x=clamp(player.x+dx/len*speed*dt,player.r,W-player.r);player.y=clamp(player.y+dy/len*speed*dt,player.r,H-player.r);
spawn+=dt;nextGem+=dt;inv=Math.max(0,inv-dt);if(spawn>(rule==='rush'?.45:Math.max(.65,2.0-elapsed/145))){spawn=0;let e={x:0,y:0,r:rule==='danger'?20:14,vx:0,vy:0};const side=Math.floor(rand(0,4));if(side===0){e.x=-20;e.y=rand(20,H-20)}else if(side===1){e.x=W+20;e.y=rand(20,H-20)}else if(side===2){e.x=rand(20,W-20);e.y=-20}else{e.x=rand(20,W-20);e.y=H+20}const a=Math.atan2(player.y-e.y,player.x-e.x),v=rand(95,150)*(rule==='danger'?1.6:1)*(rule==='freeze'?.28:1);e.vx=Math.cos(a)*v;e.vy=Math.sin(a)*v;enemies.push(e)}
if(nextGem>4&&gems.length<5){entity(gems,8);nextGem=0}
enemies.forEach(e=>{e.x+=e.vx*dt;e.y+=e.vy*dt;if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){if(rule==='touch'&&!touchDone){touchDone=true;$('result').textContent='✅ 접촉 성공!';inv=1}else if(rule!=='shield'&&rule!=='touch'&&inv===0){hp--;inv=1.25}}});enemies=enemies.filter(e=>e.x>-70&&e.x<W+70&&e.y>-70&&e.y<H+70);gems=gems.filter(g=>{if(rule!=='scarcity'&&Math.hypot(player.x-g.x,player.y-g.y)<player.r+g.r){score+=rule==='bonus'?30:10;return false}return true});score+=dt;sync();if(hp<=0)end(false);else if(elapsed>=120)end(true)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#17122b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#2d2447';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const g of gems){ctx.fillStyle='#8dffe2';ctx.beginPath();ctx.moveTo(g.x,g.y-11);ctx.lineTo(g.x+9,g.y);ctx.lineTo(g.x,g.y+11);ctx.lineTo(g.x-9,g.y);ctx.fill()}
for(const e of enemies){ctx.fillStyle='#ff597c';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill()}
if(inv===0||Math.floor(inv*9)%2===0){ctx.fillStyle='#ac8dff';ctx.shadowColor='#c0adff';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.beginPath();ctx.arc(player.x+3,player.y-3,3,0,Math.PI*2);ctx.fill()}
if(rule==='dark'&&run){ctx.fillStyle='#090715e8';ctx.fillRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='destination-out';const g=ctx.createRadialGradient(player.x,player.y,22,player.x,player.y,120);g.addColorStop(0,'#000');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,120,0,Math.PI*2);ctx.fill();ctx.restore()}}
function loop(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);draw();if(run)raf=requestAnimationFrame(loop)}
const bind={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown',e=>{const d=bind[e.key.toLowerCase()];if(d){e.preventDefault();keys.add(d)}if(e.key==='Escape'&&run)toggle()});document.addEventListener('keyup',e=>{const d=bind[e.key.toLowerCase()];if(d)keys.delete(d)});window.addEventListener('blur',()=>{keys.clear();if(run&&!paused)toggle()});
document.querySelectorAll('[data-d]').forEach(b=>{const d=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(d);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys.delete(d)))});
function toggle(){paused=!paused;$('pause').textContent=paused?'▶ 계속하기':'Ⅱ 일시정지';keys.clear();last=performance.now()}
$('start').addEventListener('click',begin);$('pause').addEventListener('click',()=>{if(run)toggle()});draw();
})();
</script></body></html>
