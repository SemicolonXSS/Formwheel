<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS WORKSHOP · Formwheel</title><style>body{font:16px system-ui;background:#111827;color:#f8fafc;margin:0}main{max-width:680px;margin:auto;padding:24px}section{background:#1f2937;padding:18px;border-radius:16px;margin:14px 0}a{color:#fdba74}button,input,select{font:inherit;padding:10px;margin:5px;max-width:90%}label{display:block;margin:10px 0}progress{width:100%}button{cursor:pointer}p{line-height:1.6}</style><main><a href="./">← Formwheel</a><h1>BOSS WORKSHOP</h1><p>보스 조합 설계 도구 v1 · 실제 PVP 전투 연동 전 단계입니다.</p><section><label>HP <input id="hp" type="range" min="500" max="10000" step="500" value="3000"><output id="value"></output></label><div id="options"></div><p id="code"></p><button id="copy">조합 코드 복사</button><p id="status" role="status"></p></section></main><script>const hp=document.getElementById('hp'),opts=document.getElementById('options');const boxes=['레이저','AI 소환','돌진','보호막'].map((n,i)=>{const l=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.checked=i<2;l.append(b,n);opts.append(l);b.onchange=render;return b});function render(){document.getElementById('value').textContent=hp.value;document.getElementById('code').textContent='BOSS-'+hp.value+'-'+boxes.map(b=>Number(b.checked)).join('')}hp.oninput=render;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('code').textContent);document.getElementById('status').textContent='복사 완료'}catch{document.getElementById('status').textContent='코드를 직접 복사해 주세요'}};render();</script></html>
