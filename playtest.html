<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel 플레이테스터 모집</title><style>body{font:16px/1.65 system-ui;background:#f5f6ff;color:#20263a;margin:0}main{max-width:650px;margin:35px auto;padding:24px;background:white;border-radius:22px;box-shadow:0 12px 40px #25326716}h1{margin-top:0}label{display:block;margin:14px 0 5px;font-weight:700}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #cbd2e5;font:inherit}button{background:#453ac4;color:white;font-weight:700;cursor:pointer;margin-top:18px}p,small{color:#59617a}a{color:#453ac4}#status{font-weight:700}</style></head><body><main><a href="./">← Hub</a><h1>🧪 플레이테스터 모집</h1><p>Formwheel의 게임과 도구를 먼저 테스트하고 오류, 사용성, 아이디어를 알려주세요. 실명·연락처는 받지 않습니다.</p><form id="apply"><label for="nickname">표시 이름 (실명 불필요)</label><input id="nickname" maxlength="24" required placeholder="닉네임"><label for="field">테스트 분야</label><select id="field"><option>게임 플레이</option><option>모바일·UI</option><option>버그 찾기</option><option>접근성·튜토리얼</option></select><label for="reason">지원 동기 (선택)</label><textarea id="reason" maxlength="300" rows="3"></textarea><button id="submit">지원서 작성하기</button></form><p id="status" role="status"></p><small>지원 내용은 이 기기에서 작성 후 복사됩니다. 현재 자동 제출·관리자 승인·배지 지급은 지원하지 않습니다.</small><section><h2>📖 튜토리얼</h2><p>튜토리얼은 자동으로 시작되지 않습니다. 필요한 경우 아래 버튼으로 안내를 확인하세요.</p><button type="button" id="tutorial">튜토리얼 보기</button><div id="guide" hidden><p>① Hub에서 프로젝트를 고르세요.<br>② 카드의 설명과 난이도를 확인하세요.<br>③ 플레이 후 발견한 오류나 아이디어를 알려주세요.</p></div></section></main><script>document.getElementById('tutorial').onclick=()=>{const g=document.getElementById('guide');g.hidden=!g.hidden};document.getElementById('apply').onsubmit=async e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();const msg='Formwheel 플레이테스터 지원\\n닉네임: '+v('nickname')+'\\n분야: '+v('field')+'\\n지원 동기: '+v('reason');try{await navigator.clipboard.writeText(msg);document.getElementById('status').textContent='지원 내용이 복사됐어요. Formwheel 운영자에게 전달해 주세요.'}catch{document.getElementById('status').textContent='아래 내용을 복사해 운영자에게 전달해 주세요.';const t=document.createElement('textarea');t.value=msg;t.readOnly=true;document.getElementById('status').after(t)}};</script></body></html>
