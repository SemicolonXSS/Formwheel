<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REPLAY TRACE | Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111324;color:#f5f2ff}main{max-width:920px;margin:auto;padding:24px 16px 65px}a{color:#c7b0ff}.hero,.panel{background:#201e34;border:1px solid #50456f;border-radius:18px;padding:20px;margin:15px 0}.hero{background:linear-gradient(120deg,#3c285e,#20243b)}h1{margin:0;font-size:clamp(28px,6vw,42px)}.muted{color:#cbc5db;line-height:1.65}button,select{border:1px solid #aa92d6;border-radius:10px;background:#3d315c;color:#fff;padding:11px 14px;font:inherit;min-height:44px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffbd76;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{padding:18px;background:#28223c;border:1px solid #665283;border-radius:15px}.pill{display:inline-block;padding:4px 10px;border-radius:30px;background:#47375e;margin:4px 4px 4px 0}.notice{border:1px solid #806b44;border-radius:13px;padding:14px;background:#352c25}.result{margin-top:14px;padding:15px;border:1px solid #8069a8;border-radius:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;margin:8px 0}input{accent-color:#b89cff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#131322;padding:12px;border-radius:12px;max-height:300px;overflow:auto}</style></head><body><main><a href="./index.html">← Formwheel 허브</a><section class="hero"><h1>🎬 REPLAY TRACE</h1><p class="muted">버그가 발생한 순간을 기록하는 개발자용 입력 타임라인</p></section><section class="notice"><strong>프라이버시 우선 체험판</strong><p class="muted">이 페이지의 테스트 영역에서 직접 누른 버튼만 기록해. 실제 게임 조작, 키보드 전체 입력, 비밀번호, 채팅, 개인정보는 수집하지 않아. 기록은 서버에 전송되지 않으며 페이지를 닫으면 사라져. 실제 게임 상태 재생은 아직 지원하지 않아.</p></section><section class="panel"><h2>입력 기록 실험실</h2><p class="muted">기록 시작 후 아래 테스트 버튼을 눌러 입력 순서를 남겨 봐.</p><div class="row"><button id="start">● 기록 시작</button><button id="stop" disabled>■ 기록 종료</button><button id="clear">초기화</button></div><div class="row" style="margin-top:18px"><button data-action="left">← 왼쪽</button><button data-action="jump">↑ 점프</button><button data-action="right">오른쪽 →</button><button data-action="reverse">↔ 방향 전환</button></div><p id="status" role="status" class="muted">대기 중</p></section><section class="panel"><h2>기록된 이벤트 <span id="count">0</span></h2><pre id="timeline">기록 없음</pre><button id="export" disabled>JSON 내보내기</button></section></main><script>
'use strict';let events=[],active=false,start=0;const max=300;const status=document.getElementById('status');function render(){document.getElementById('count').textContent=String(events.length);document.getElementById('timeline').textContent=events.length?events.map(e=>e.ms+'ms · '+e.action).join('\n'):'기록 없음';document.getElementById('export').disabled=!events.length;document.getElementById('start').disabled=active;document.getElementById('stop').disabled=!active;status.textContent=active?'기록 중 · 최대 '+max+'개 이벤트':'기록 정지 · 이 페이지 안에서만 보관'}document.getElementById('start').addEventListener('click',()=>{events=[];start=performance.now();active=true;render()});document.getElementById('stop').addEventListener('click',()=>{active=false;render()});document.getElementById('clear').addEventListener('click',()=>{active=false;events=[];render()});document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{if(!active)return;if(events.length>=max){active=false;render();return}events.push({ms:Math.round(performance.now()-start),action:button.dataset.action});render()}));document.getElementById('export').addEventListener('click',()=>{const payload={schema:'formwheel-replay-trace-demo-v1',mode:'test-controls-only',events};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='formwheel-replay-trace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render();</script></body></html>
