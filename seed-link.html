<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌱 SEED LINK | Formwheel</title><style>body{margin:0;background:#151326;color:#f8f4ff;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px 16px}section{background:#26213c;border:1px solid #695589;border-radius:18px;padding:20px;margin:16px 0}a{color:#d5bdff}button,input{font:inherit;max-width:100%;padding:12px;border-radius:10px;border:1px solid #aa91d8;background:#3b3057;color:white}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0}p{line-height:1.6}output{display:block;overflow-wrap:anywhere;margin:12px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange}small{color:#d3c9e6}</style></head><body><main><a href="./index.html">← 허브</a><h1>🌱 SEED LINK</h1><section><p>Polyrhythm 랜덤 모드의 난수 시드를 공유해 보세요. 동일 버전과 동일 진행 조건에서 같은 난수열을 사용하지만, 입력과 진행에 따라 타일 배치는 달라질 수 있습니다.</p><label>시드 (0~4294967295) <input id="seed" type="number" min="0" max="4294967295" step="1" value="9831"></label><button id="random">랜덤 시드</button> <button id="copy">링크 복사</button><output id="link"></output><a id="play">플레이 시작 →</a><p id="status" role="status"></p></section></main><script>'use strict';const input=document.getElementById('seed'),out=document.getElementById('link'),play=document.getElementById('play'),copy=document.getElementById('copy'),status=document.getElementById('status');function update(){const n=input.valueAsNumber;if(!Number.isInteger(n)||n<0||n>4294967295){out.textContent='유효한 시드를 입력하세요.';play.removeAttribute('href');copy.disabled=true;return}const u=new URL('./polyrhythm.html',location.href);u.searchParams.set('seed',String(n));out.textContent=u.href;play.href=u.href;copy.disabled=false}input.addEventListener('input',update);document.getElementById('random').onclick=()=>{input.value=String(crypto.getRandomValues(new Uint32Array(1))[0]);update()};copy.onclick=async()=>{try{await navigator.clipboard.writeText(play.href);status.textContent='복사 완료'}catch{status.textContent='위 링크를 직접 복사해 주세요.'}};update();</script></body></html>
