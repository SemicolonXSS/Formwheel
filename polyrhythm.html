<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel_Polyrhythm</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1024;color:#f4f5ff;font-family:system-ui,sans-serif;text-align:center}main{max-width:680px;margin:auto;padding:22px 14px}a{color:#b7b4ff}h1{font-size:clamp(24px,6vw,36px);margin:15px 0 5px}p{color:#b9c1d9} .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}.stats span{background:#202944;padding:10px 15px;border-radius:12px}strong{color:#fff}canvas{display:block;width:min(94vw,480px);height:auto;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button{font:inherit;border:0;border-radius:14px;background:#806cff;color:#fff;font-weight:800;padding:13px 22px;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}.controls{display:flex;gap:10px;justify-content:center;margin:12px 0}#hit{background:#ffab40;color:#1e1630;min-width:180px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#feedback{min-height:28px;font-weight:800;color:#ffda88}small{color:#a9b5d0}
</style></head><body><main><a href="./#projects">← Formwheel 허브</a><h1>🌀 Formwheel_Polyrhythm</h1><p>회전하는 아이콘이 주황 네모에 닿는 순간 누르세요!</p><div class="stats"><span>점수 <strong id="score">0</strong></span><span>콤보 <strong id="combo">0</strong></span><span>최고 <strong id="best">0</strong></span><span>회전 <strong id="period">4.0초</strong></span><span>성공 <strong id="success">0 / 3</strong></span><span>목숨 <strong id="lives">❤️❤️❤️❤️❤️</strong></span></div><canvas id="stage" width="480" height="480" aria-label="원형 리듬 게임"></canvas><div id="feedback" role="status" aria-live="polite">시작 버튼을 누르세요</div><div class="controls"><button id="start">시작 / 재시작</button><button id="hit">HIT! (Space)</button></div><small>성공 3번마다 조금씩 빨라지고 판정 범위가 서서히 좁아집니다 · 네모 1~3개 · MISS와 헛발질은 목숨 -1</small></main><script>
'use strict';
'use strict';
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),bestEl=document.querySelector('#best'),periodEl=document.querySelector('#period'),feedback=document.querySelector('#feedback'),successEl=document.querySelector('#success'),livesEl=document.querySelector('#lives');
const TAU=Math.PI*2;
function goodWindow(){return Math.max(0.48,0.78-stage*0.009)}
function perfectWindow(){return Math.max(0.23,0.36-stage*0.004)}
function stagePeriod(){return Math.max(1.8,4-stage*0.12)}
let running=false,angle=-Math.PI/2,period=4,stage=0,score=0,combo=0,success=0,lives=5,last=0,raf=0,targets=[],nextId=0,progress=0;
let best=0;try{best=Number(localStorage.getItem('fw-polyrhythm-best')||0)||0}catch(e){}bestEl.textContent=best;
function distance(a,b){return Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)))}
function update(){scoreEl.textContent=score;comboEl.textContent=combo;periodEl.textContent=period.toFixed(1)+'초';successEl.textContent=(success%3)+' / 3';livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(5-lives);bestEl.textContent=best}
function targetCount(){return Math.min(3,1+Math.floor(stage/2))}
function addTarget(){
  // Schedule each square independently, ahead of the moving player.
  let at,tries=0;
  do{
    at=progress+1.15+Math.random()*(TAU-1.65);
    tries++;
  }while(tries<60&&targets.some(t=>distance(at,t.at)<0.8));
  targets.push({id:++nextId,at,angle:at-Math.PI/2});
}
function fillTargets(){while(targets.length<targetCount())addTarget()}
function spawnTargets(){targets=[];fillTargets()}
function endGame(){running=false;cancelAnimationFrame(raf);feedback.textContent='💔 GAME OVER · 점수 '+score+' · 다시 시작할 수 있어요';update()}
function lose(reason){if(!running)return;combo=0;lives=Math.max(0,lives-1);feedback.textContent=reason+' · 목숨 -1';update();if(lives===0)endGame()}
function start(){cancelAnimationFrame(raf);running=true;angle=-Math.PI/2;period=4;stage=0;score=0;combo=0;success=0;lives=5;progress=0;nextId=0;last=performance.now();spawnTargets();feedback.textContent='READY · 타이밍을 맞추세요!';update();draw();raf=requestAnimationFrame(frame)}
let audioContext=null;
function playDrum(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    if(!audioContext)audioContext=new AudioCtx();
    if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
    const now=audioContext.currentTime;
    // Layer a bass thump and a midrange attack so the hit is audible on phone speakers.
    const compressor=audioContext.createDynamicsCompressor();
    compressor.threshold.value=-15;compressor.knee.value=12;
    compressor.ratio.value=5;compressor.attack.value=0.003;compressor.release.value=0.12;
    compressor.connect(audioContext.destination);
    for(const layer of [{from:190,to:62,level:0.85,duration:0.28,type:'sine'},{from:360,to:110,level:0.5,duration:0.13,type:'triangle'}]){
      const osc=audioContext.createOscillator(),gain=audioContext.createGain();
      osc.type=layer.type;
      osc.frequency.setValueAtTime(layer.from,now);
      osc.frequency.exponentialRampToValueAtTime(layer.to,now+layer.duration*0.7);
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(layer.level,now+0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+layer.duration);
      osc.connect(gain);gain.connect(compressor);
      osc.start(now);osc.stop(now+layer.duration+0.01);
    }
  }catch(e){/* Audio unavailable: gameplay continues. */}
}
function hit(){playDrum();if(!running)return;let chosen=null,nearest=Infinity;for(const t of targets){const d=distance(angle,t.angle);if(d<nearest){nearest=d;chosen=t}}
if(chosen&&nearest<=goodWindow()){const perfect=nearest<=perfectWindow();combo++;score+=perfect?100:50;success++;feedback.textContent=perfect?'✨ PERFECT +100':'👍 GOOD +50';if(score>best){best=score;try{localStorage.setItem('fw-polyrhythm-best',String(best))}catch(e){}}
if(success%3===0){stage++;period=stagePeriod();feedback.textContent+=' · 🔄 '+period.toFixed(1)+'초/바퀴'}
targets=targets.filter(t=>t.id!==chosen.id);fillTargets();update()}else lose('헛발질')}
function frame(now){if(!running)return;const dt=Math.min(Math.max((now-last)/1000,0),0.06);last=now;const step=TAU*dt/period;progress+=step;angle+=step;
const expired=targets.filter(t=>progress>t.at+goodWindow());if(expired.length){targets=targets.filter(t=>progress<=t.at+goodWindow());for(const t of expired){lose('MISS');if(!running)break}if(running)fillTargets()}
draw();if(running)raf=requestAnimationFrame(frame)}
function draw(){ctx.clearRect(0,0,480,480);const cx=240,cy=240,r=172;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.strokeStyle='#536182';ctx.lineWidth=5;ctx.stroke();for(let i=0;i<12;i++){const a=i*TAU/12;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2.5,0,TAU);ctx.fillStyle='#7583a5';ctx.fill()}
for(const t of targets){ctx.save();ctx.translate(cx+Math.cos(t.angle)*r,cy+Math.sin(t.angle)*r);ctx.rotate(t.angle+Math.PI/2);ctx.fillStyle='#ffad3d';ctx.shadowColor='#ffb347';ctx.shadowBlur=20;ctx.fillRect(-19,-19,38,38);ctx.restore()}
ctx.beginPath();ctx.arc(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r,15,0,TAU);ctx.fillStyle='#71d6ff';ctx.shadowColor='#71d6ff';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f3f5ff';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText(period.toFixed(1)+'s',cx,cy);ctx.font='16px system-ui';ctx.fillStyle='#aebbd7';ctx.fillText('성공 '+(success%3)+'/3 · 판정 '+Math.round(goodWindow()/0.78*100)+'%',cx,cy+29)}
document.querySelector('#start').addEventListener('click',start);const hitButton=document.querySelector('#hit');hitButton.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){e.preventDefault();hit()}});hitButton.addEventListener('click',e=>{if(e.detail===0||e.detail>0&&window.matchMedia('(pointer:fine)').matches)hit()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();hit()}});draw();
</script></body></html>
