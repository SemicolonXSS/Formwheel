<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel_Polyrhythm</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1024;color:#f4f5ff;font-family:system-ui,sans-serif;text-align:center}main{max-width:680px;margin:auto;padding:22px 14px}a{color:#b7b4ff}h1{font-size:clamp(24px,6vw,36px);margin:15px 0 5px}p{color:#b9c1d9} .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}.stats span{background:#202944;padding:10px 15px;border-radius:12px}strong{color:#fff}canvas{display:block;width:min(94vw,480px);height:auto;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button{font:inherit;border:0;border-radius:14px;background:#806cff;color:#fff;font-weight:800;padding:13px 22px;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}.controls{display:flex;gap:10px;justify-content:center;margin:12px 0}#hit{background:#ffab40;color:#1e1630;min-width:180px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#feedback{min-height:28px;font-weight:800;color:#ffda88}small{color:#a9b5d0}
 .mode-select{display:flex;gap:10px;justify-content:center;margin:12px auto;flex-wrap:wrap}.mode-select button{background:#263454}.mode-select button.active{background:#806cff;outline:2px solid #c7baff}#mapPicker{display:none;margin:10px auto 0;max-width:340px}#mapPicker.visible{display:block}#mapPicker select{width:100%;padding:12px;border-radius:12px;background:#202944;color:#fff;border:1px solid #67739a;font:inherit}#mapInfo{min-height:22px;color:#b7d8ff;font-weight:700}</style></head><body><main><a href="./#projects">← Formwheel 허브</a><h1>🌀 Formwheel_Polyrhythm</h1><p>회전하는 아이콘이 주황 네모에 닿는 순간 누르세요!</p><div class="mode-select"><button id="randomMode" class="active" type="button" aria-pressed="true">🎲 랜덤 모드</button><button id="mapMode" type="button" aria-pressed="false">🗺️ 맵 모드</button></div><div id="mapPicker"><label for="mapSelect">시작할 맵 선택</label><select id="mapSelect"><option value="0">1 · 첫 박자</option><option value="1">2 · 엇박자</option><option value="2">3 · 트리플</option><option value="3">4 · 피날레</option></select></div><div id="mapInfo">랜덤 모드 · 기존 방식</div><div class="stats"><span>점수 <strong id="score">0</strong></span><span>콤보 <strong id="combo">0</strong></span><span>최고 <strong id="best">0</strong></span><span>회전 <strong id="period">4.0초</strong></span><span>성공 <strong id="success">0 / 3</strong></span><span>목숨 <strong id="lives">❤️❤️❤️❤️❤️</strong></span></div><canvas id="stage" width="480" height="480" aria-label="원형 리듬 게임"></canvas><div id="feedback" role="status" aria-live="polite">시작 버튼을 누르세요</div><div class="controls"><button id="start">시작 / 재시작</button><button id="hit">HIT! (Space)</button></div><small>성공 3번마다 조금씩 빨라지고 판정 범위가 서서히 좁아집니다 · 네모 최대 5개 · 맵은 64~112타일 · 음악과 타일 타이밍 동기화 · 판정 강화 · 맵: 파랑 ↺ 역방향 / 초록 ↻ 정방향 · MISS와 헛발질은 목숨 -1</small></main><script>
'use strict';
'use strict';
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),bestEl=document.querySelector('#best'),periodEl=document.querySelector('#period'),feedback=document.querySelector('#feedback'),successEl=document.querySelector('#success'),livesEl=document.querySelector('#lives');
const TAU=Math.PI*2;
const mapPatterns=[[1,1,0.75,1.25,0.75,1],[0.75,0.5,1,0.75,0.5,1.25],[0.5,0.5,0.75,0.5,1,0.5],[0.5,0.75,0.5,0.5,0.75,0.5]];
const mapNames=['첫 박자','엇박자','트리플','피날레'];
const maps=mapNames.map((name,i)=>{
  const beats=[];let at=1.6;
  for(let j=0;j<64+i*16;j++){beats.push(Number(at.toFixed(4)));at+=mapPatterns[i][j%mapPatterns[i].length]*(i===0?1.12:i===1?1.02:i===2?0.95:0.9)}
  return {name,beats};
});
let mode='random',mapIndex=0,mapBeat=0,musicStep=0,musicNote=0,direction=1,selectedMap=0;
const mapInfo=document.querySelector('#mapInfo');
function goodWindow(){return Math.max(0.48,0.78-stage*0.009)*(mode==='map'?0.69:1)}
function perfectWindow(){return Math.max(0.23,0.36-stage*0.004)*(mode==='map'?0.75:1)}
function stagePeriod(){return Math.max(mode==='map'?1.6:1.8,(mode==='map'?3.4-mapIndex*0.35:4)-stage*0.12)}
let running=false,angle=-Math.PI/2,period=4,stage=0,score=0,combo=0,success=0,lives=5,last=0,raf=0,targets=[],nextId=0,progress=0;
let best=0;try{best=Number(localStorage.getItem('fw-polyrhythm-best')||0)||0}catch(e){}bestEl.textContent=best;
function distance(a,b){return Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)))}
function update(){scoreEl.textContent=score;comboEl.textContent=combo;periodEl.textContent=period.toFixed(1)+'초';successEl.textContent=(success%3)+' / 3';livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(5-lives);bestEl.textContent=best}
function mapTileType(index){return index>0&&index%12===0?'forward':index>0&&index%8===0?'reverse':'normal'}
function alignTargets(){for(const t of targets)t.angle=angle+direction*(t.at-progress)}
function targetCount(){return mode==='map'?Math.min(5,3+Math.floor(mapIndex/2)):Math.min(5,1+Math.floor(stage/2))}
function addTarget(){
  if(mode==='map'){
    const beats=maps[mapIndex].beats;
    if(mapBeat>=beats.length)return;
    const index=mapBeat++;
    const at=beats[index];
    targets.push({id:++nextId,at,angle:angle+direction*(at-progress),kind:mapTileType(index)});
    return;
  }
  // Pick the best spaced location ahead of the player.
  let bestAt=progress+1.05,bestGap=-1;
  for(let i=0;i<40;i++){
    const at=progress+1.05+Math.random()*(TAU-1.4);
    const gap=targets.length?Math.min(...targets.map(t=>distance(at,t.at))):TAU;
    if(gap>bestGap){bestGap=gap;bestAt=at}
  }
  targets.push({id:++nextId,at:bestAt,angle:bestAt-Math.PI/2});
}
function fillTargets(){while(targets.length<targetCount()&&(mode==='random'||mapBeat<maps[mapIndex].beats.length))addTarget()}
function spawnTargets(){targets=[];fillTargets()}
function showMode(){mapInfo.textContent=mode==='random'?'랜덤 모드 · 기존 방식':('맵 '+(mapIndex+1)+' / '+maps.length+' · '+maps[mapIndex].name+' ♪ '+musicNames[mapIndex]+' · '+mapBeat+'/'+maps[mapIndex].beats.length+' 배치')}
function selectMode(next){if(running)return;mode=next;document.querySelector('#mapPicker').classList.toggle('visible',mode==='map');document.querySelector('#randomMode').classList.toggle('active',mode==='random');document.querySelector('#mapMode').classList.toggle('active',mode==='map');document.querySelector('#randomMode').setAttribute('aria-pressed',String(mode==='random'));document.querySelector('#mapMode').setAttribute('aria-pressed',String(mode==='map'));showMode();draw()}
function mapAdvance(){if(mode!=='map'||targets.length||mapBeat<maps[mapIndex].beats.length||!running)return;mapIndex++;if(mapIndex>=maps.length){running=false;cancelAnimationFrame(raf);feedback.textContent='🏆 모든 맵 클리어! 점수 '+score;return}progress=0;angle=-Math.PI/2;direction=1;mapBeat=0;musicStep=0;musicNote=0;stage=0;period=stagePeriod();spawnTargets();showMode();feedback.textContent='🗺️ 다음 맵: '+maps[mapIndex].name;update()}
function endGame(){running=false;cancelAnimationFrame(raf);feedback.textContent='💔 GAME OVER · 점수 '+score+' · 다시 시작할 수 있어요';update()}
function lose(reason){if(!running)return;combo=0;lives=Math.max(0,lives-1);feedback.textContent=reason+' · 목숨 -1';update();if(lives===0)endGame()}
function start(){if(mode==='map')try{initAudio()}catch(e){}cancelAnimationFrame(raf);running=true;angle=-Math.PI/2;mapIndex=mode==='map'?selectedMap:0;stage=0;period=mode==='map'?stagePeriod():4;score=0;combo=0;success=0;lives=5;progress=0;direction=1;nextId=0;mapBeat=0;musicStep=0;musicNote=0;last=performance.now();spawnTargets();showMode();feedback.textContent='READY · 타이밍을 맞추세요!';update();draw();raf=requestAnimationFrame(frame)}
let audioContext=null,audioCompressor=null;
const melodies=[
  [262,330,392,523,392,330,294,392],
  [220,330,277,440,330,247,370,294],
  [294,370,440,587,554,440,370,494],
  [196,392,494,587,659,587,494,784]
];
const musicNames=['First Pulse','Offbeat Circuit','Triple Orbit','Final Overdrive'];
function initAudio(){
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return false;
  if(!audioContext)audioContext=new AudioCtx();
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  if(!audioCompressor){
    audioCompressor=audioContext.createDynamicsCompressor();
    audioCompressor.threshold.value=-15;audioCompressor.knee.value=12;
    audioCompressor.ratio.value=5;audioCompressor.attack.value=0.003;audioCompressor.release.value=0.12;
    audioCompressor.connect(audioContext.destination);
  }
  return true;
}
function synthNote(frequency,duration=0.19,volume=0.11,type='triangle'){
  if(!audioContext||audioContext.state!=='running')return;
  const now=audioContext.currentTime;
  const osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.type=type;osc.frequency.setValueAtTime(frequency,now);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(volume,now+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
  osc.connect(gain);gain.connect(audioCompressor);
  osc.onended=()=>{osc.disconnect();gain.disconnect()};
  osc.start(now);osc.stop(now+duration+0.01);
}
function mapMusic(){
  if(mode!=='map'||!running)return;
  // Notes and targets share the same angular timeline: each note sounds at a tile's hit position.
  const beats=maps[mapIndex].beats,notes=melodies[mapIndex];
  while(musicNote<beats.length&&progress>=beats[musicNote]){
    const index=musicNote++;
    synthNote(notes[index%notes.length],0.23,0.23,mapIndex===3?'sawtooth':'triangle');
    if(index%2===0)synthNote(notes[index%notes.length]/2,0.28,0.13,'sine');
  }
}

const drumLayers=[{from:190,to:62,level:0.85,duration:0.28,type:'sine'},{from:360,to:110,level:0.5,duration:0.13,type:'triangle'}];
function playDrum(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    if(!initAudio())return;
    const now=audioContext.currentTime;
    // Layer a bass thump and a midrange attack so the hit is audible on phone speakers.
    for(const layer of drumLayers){
      const osc=audioContext.createOscillator(),gain=audioContext.createGain();
      osc.type=layer.type;
      osc.frequency.setValueAtTime(layer.from,now);
      osc.frequency.exponentialRampToValueAtTime(layer.to,now+layer.duration*0.7);
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(layer.level,now+0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+layer.duration);
      osc.connect(gain);gain.connect(audioCompressor);
      osc.onended=()=>{osc.disconnect();gain.disconnect()};
      osc.start(now);osc.stop(now+layer.duration+0.01);
    }
  }catch(e){/* Audio unavailable: gameplay continues. */}
}
function hit(){playDrum();if(!running)return;let chosen=null,nearest=Infinity;for(const t of targets){const d=Math.abs(progress-t.at);if(d<nearest){nearest=d;chosen=t}}
if(chosen&&nearest<=goodWindow()){const perfect=nearest<=perfectWindow();combo++;score+=perfect?100:50;success++;feedback.textContent=perfect?'✨ PERFECT +100':'👍 GOOD +50';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('fw-polyrhythm-best',String(best))}catch(e){}}
if(success%3===0){stage++;period=stagePeriod();feedback.textContent+=' · 🔄 '+period.toFixed(1)+'초/바퀴'}
targets=targets.filter(t=>t.id!==chosen.id);if(mode==='map'&&chosen.kind&&chosen.kind!=='normal'){direction=chosen.kind==='reverse'?-1:1;alignTargets();feedback.textContent+=' · '+(direction===-1?'↺ 역방향!':'↻ 정방향!')}fillTargets();showMode();update();mapAdvance()}else lose('헛발질')}
function frame(now){if(!running)return;const dt=Math.min(Math.max((now-last)/1000,0),0.06);last=now;const step=TAU*dt/period;progress+=step;angle+=step*direction;mapMusic();
const windowSize=goodWindow();const missGrace=0.28;const expired=targets.filter(t=>progress>t.at+windowSize+missGrace);if(expired.length){targets=targets.filter(t=>progress<=t.at+windowSize+missGrace);for(const t of expired){lose('MISS');if(!running)break}if(running){fillTargets();showMode();mapAdvance()}}
draw();if(running)raf=requestAnimationFrame(frame)}
function draw(){ctx.clearRect(0,0,480,480);const cx=240,cy=240,r=172;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.strokeStyle='#536182';ctx.lineWidth=5;ctx.stroke();for(let i=0;i<12;i++){const a=i*TAU/12;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2.5,0,TAU);ctx.fillStyle='#7583a5';ctx.fill()}
for(const t of targets){ctx.save();ctx.translate(cx+Math.cos(t.angle)*r,cy+Math.sin(t.angle)*r);ctx.rotate(t.angle+Math.PI/2);ctx.fillStyle=t.kind==='reverse'?'#5ba8ff':t.kind==='forward'?'#65dfaa':'#ffad3d';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fillRect(-19,-19,38,38);if(t.kind&&t.kind!=='normal'){ctx.shadowBlur=0;ctx.fillStyle='#08142a';ctx.font='bold 29px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.kind==='reverse'?'↺':'↻',0,1)}ctx.restore()}
ctx.beginPath();ctx.arc(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r,15,0,TAU);ctx.fillStyle='#71d6ff';ctx.shadowColor='#71d6ff';ctx.shadowBlur=9;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f3f5ff';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText(period.toFixed(1)+'s',cx,cy);ctx.font='16px system-ui';ctx.fillStyle='#aebbd7';ctx.fillText('성공 '+(success%3)+'/3 · 판정 '+Math.round(goodWindow()/0.78*100)+'%',cx,cy+29)}
document.querySelector('#mapSelect').addEventListener('change',e=>{if(running)return;selectedMap=Number(e.target.value);mapIndex=selectedMap;showMode()});document.querySelector('#randomMode').addEventListener('click',()=>selectMode('random'));document.querySelector('#mapMode').addEventListener('click',()=>selectMode('map'));document.querySelector('#start').addEventListener('click',start);const hitButton=document.querySelector('#hit');hitButton.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){e.preventDefault();hit()}});hitButton.addEventListener('click',e=>{if(e.detail===0||e.detail>0&&window.matchMedia('(pointer:fine)').matches)hit()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();hit()}});showMode();draw();
</script></body></html>
