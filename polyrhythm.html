<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel_Polyrhythm</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1024;color:#f4f5ff;font-family:system-ui,sans-serif;text-align:center}main{max-width:680px;margin:auto;padding:22px 14px}a{color:#b7b4ff}h1{font-size:clamp(24px,6vw,36px);margin:15px 0 5px}p{color:#b9c1d9} .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}.stats span{background:#202944;padding:10px 15px;border-radius:12px}strong{color:#fff}canvas{display:block;width:min(94vw,480px);height:auto;margin:0 auto;touch-action:manipulation}button{font:inherit;border:0;border-radius:14px;background:#806cff;color:#fff;font-weight:800;padding:13px 22px;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}.controls{display:flex;gap:10px;justify-content:center;margin:12px 0}#hit{background:#ffab40;color:#1e1630;min-width:180px}#feedback{min-height:28px;font-weight:800;color:#ffda88}small{color:#a9b5d0}
</style></head><body><main><a href="./#projects">← Formwheel 허브</a><h1>🌀 Formwheel_Polyrhythm</h1><p>회전하는 아이콘이 주황 네모에 닿는 순간 누르세요!</p><div class="stats"><span>점수 <strong id="score">0</strong></span><span>콤보 <strong id="combo">0</strong></span><span>최고 <strong id="best">0</strong></span><span>회전 <strong id="period">4.0초</strong></span></div><canvas id="stage" width="480" height="480" aria-label="원형 리듬 게임"></canvas><div id="feedback" role="status" aria-live="polite">시작 버튼을 누르세요</div><div class="controls"><button id="start">시작 / 재시작</button><button id="hit">HIT! (Space)</button></div><small>3바퀴마다 회전 시간이 변경됩니다 · 목표는 성공할 때마다 이동합니다</small></main><script>
'use strict';
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),bestEl=document.querySelector('#best'),periodEl=document.querySelector('#period'),feedback=document.querySelector('#feedback');
const sequence=[4,3.3,2.7,3.5,2.2,4.5];const TAU=Math.PI*2;
let running=false,angle=-Math.PI/2,target=0,period=4,turns=0,stage=0,score=0,combo=0,last=0,previousDifference=0,wasNear=false,hitThisPass=false,raf=0;
let best=0;try{best=Number(localStorage.getItem('fw-polyrhythm-best')||0)||0}catch(e){}bestEl.textContent=best;
function distance(a,b){return Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)))}
function newTarget(){const old=target;let next;do{next=Math.random()*TAU-Math.PI/2}while(distance(next,old)<0.65||distance(next,angle)<0.55);target=next;hitThisPass=false;wasNear=false}
function update(){scoreEl.textContent=score;comboEl.textContent=combo;periodEl.textContent=period.toFixed(1)+'초';bestEl.textContent=best}
function start(){cancelAnimationFrame(raf);running=true;angle=-Math.PI/2;target=Math.PI/2;period=4;turns=0;stage=0;score=0;combo=0;last=performance.now();hitThisPass=false;wasNear=false;feedback.textContent='READY · 타이밍을 맞추세요!';update();raf=requestAnimationFrame(frame)}
function hit(){if(!running)return;const d=distance(angle,target);if(d<=0.42&&!hitThisPass){const perfect=d<=0.18;combo++;score+=perfect?100:50;feedback.textContent=perfect?'✨ PERFECT +100':'👍 GOOD +50';if(score>best){best=score;try{localStorage.setItem('fw-polyrhythm-best',String(best))}catch(e){}}newTarget()}else{combo=0;feedback.textContent='MISS · 다시 집중!'}update()}
function frame(now){if(!running)return;const dt=Math.min((now-last)/1000,0.06);last=now;const step=TAU*dt/period;angle+=step;if(angle>=TAU-Math.PI/2){angle-=TAU;turns++;if(turns%3===0){stage++;period=stage<sequence.length?sequence[stage]:1.5+Math.random()*3.5;feedback.textContent='🔄 SPEED CHANGE · '+period.toFixed(1)+'초/바퀴';update()}}
const near=distance(angle,target)<0.46;if(wasNear&&!near&&!hitThisPass){combo=0;feedback.textContent='MISS · 목표를 놓쳤어요';update()}wasNear=near;
draw();raf=requestAnimationFrame(frame)}
function draw(){ctx.clearRect(0,0,480,480);const cx=240,cy=240,r=172;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.strokeStyle='#536182';ctx.lineWidth=5;ctx.stroke();for(let i=0;i<12;i++){const a=i*TAU/12;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2.5,0,TAU);ctx.fillStyle='#7583a5';ctx.fill()}ctx.save();ctx.translate(cx+Math.cos(target)*r,cy+Math.sin(target)*r);ctx.rotate(target+Math.PI/2);ctx.fillStyle='#ffad3d';ctx.shadowColor='#ffb347';ctx.shadowBlur=20;ctx.fillRect(-17,-17,34,34);ctx.restore();ctx.beginPath();ctx.arc(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r,13,0,TAU);ctx.fillStyle='#71d6ff';ctx.shadowColor='#71d6ff';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f3f5ff';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText(period.toFixed(1)+'s',cx,cy);ctx.font='16px system-ui';ctx.fillStyle='#aebbd7';ctx.fillText((turns%3+1)+' / 3 바퀴',cx,cy+29)}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#hit').addEventListener('click',hit);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();hit()}});draw();
</script></body></html>
