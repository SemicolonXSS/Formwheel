<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze | Formwheel</title><meta name="theme-color" content="#f7f8fc"><link rel="icon" href="../assets/formwheel-favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/formwheel-brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#24283a;font-family:system-ui,-apple-system,sans-serif}header{background:white;border-bottom:1px solid #e2e5f2;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}header a{text-decoration:none;color:#3439bd;font-weight:800}main{max-width:780px;padding:24px 16px 60px;margin:auto}h1{font-size:clamp(36px,8vw,60px);margin:5px 0}p{color:#666e84;line-height:1.6}.panel{background:white;border:1px solid #e0e4f0;border-radius:20px;padding:18px;box-shadow:0 12px 35px #2221}.settings,.stats,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;border:1px solid #cbd0e5;border-radius:12px;padding:10px 15px;background:white;color:#283153;cursor:pointer}button.primary{background:#353ac2;color:white;border-color:#353ac2;font-weight:800}button:focus-visible{outline:3px solid #8c88ef}#board{display:grid;max-width:620px;width:100%;aspect-ratio:1;margin:16px auto;touch-action:none;border-radius:8px;overflow:hidden;border:2px solid #2e3869;background:#283451} .cell{min-width:0;min-height:0;background:#fff;position:relative}.cell.wall{background:#283451}.cell.goal{background:#c9f3dc}.cell.goal:before{content:"🏁";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(9px,2.8vw,23px)}.cell.player{background:#d9d4ff}.cell.player:after{content:"";position:absolute;inset:18%;border-radius:50%;background:#594be0;box-shadow:0 1px 7px #6555d7} .stats span{background:#f2f3ff;padding:9px 13px;border-radius:10px;font-weight:750}.controls{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:7px;justify-content:center;margin:18px auto}.controls button{font-size:22px;font-weight:850;padding:0;touch-action:manipulation}.controls [data-dir="up"]{grid-column:2}.controls [data-dir="left"]{grid-column:1;grid-row:2}.controls [data-dir="down"]{grid-column:2;grid-row:2}.controls [data-dir="right"]{grid-column:3;grid-row:2}#status{color:#3439bd;font-weight:800;min-height:28px;text-align:center}@media(max-width:480px){.panel{padding:12px}.controls{grid-template-columns:repeat(3,70px)}}</style></head><body><header><a href="../">← Formwheel Hub</a><strong>🌀 MAZE</strong></header><main><span style="color:#514dc4;font-weight:850">FORMWHEEL · SOLO GAME</span><h1>🌀 Maze</h1><p>매번 새롭게 생성되는 미로를 탈출해 봐! 파란 플레이어를 움직여 깃발까지 도착하면 성공이야.</p><section class="panel"><div class="settings"><label for="difficulty">난이도 </label><select id="difficulty"><option value="9">쉬움 · 9×9</option><option value="15" selected>보통 · 15×15</option><option value="21">어려움 · 21×21</option></select><button class="primary" id="new">🔀 새 미로</button></div><div class="stats"><span>⏱ <output id="timer">0.0</output>초</span><span>👣 <output id="moves">0</output>걸음</span><span>🏆 최고 <output id="best">—</output></span></div><div id="board" role="group" aria-label="미로 게임판"></div><div id="status" role="status" aria-live="polite">방향키나 아래 버튼으로 움직이세요.</div><div class="controls" aria-label="이동 버튼"><button data-dir="up" aria-label="위">↑</button><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="down" aria-label="아래">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div><p style="font-size:13px">PC: 방향키 또는 WASD · 모바일: 방향 버튼 또는 미로에서 스와이프. 미로는 항상 출구까지 연결됩니다.</p></section></main><script>"use strict";const $=id=>document.getElementById(id);let size=15,grid=[],px=1,py=1,steps=0,start=null,finished=false,tick=null;const dirs=[[0,-1],[0,1],[-1,0],[1,0]];function bestKey(){return "formwheel.maze.best."+size}function best(){try{return JSON.parse(localStorage.getItem(bestKey())||"null")}catch{return null}}function showBest(){const b=best();$("best").textContent=b?b.time.toFixed(1)+"초 / "+b.steps+"걸음":"—"}function elapsed(){return start?(performance.now()-start)/1000:0}function draw(){const board=$("board");board.style.gridTemplateColumns="repeat("+size+",1fr)";const frag=document.createDocumentFragment();for(let y=0;y<size;y++)for(let x=0;x<size;x++){let c=document.createElement("div");c.className="cell"+(grid[y][x]?" wall":"")+(x===size-2&&y===size-2?" goal":"")+(x===px&&y===py?" player":"");frag.append(c)}board.replaceChildren(frag);$("moves").textContent=steps}function generate(){clearInterval(tick);tick=null;size=Number($("difficulty").value);grid=Array.from({length:size},()=>Array(size).fill(1));const stack=[[1,1]];grid[1][1]=0;while(stack.length){const [x,y]=stack[stack.length-1];const next=dirs.map(([dx,dy])=>[x+dx*2,y+dy*2,dx,dy]).filter(([nx,ny])=>nx>0&&ny>0&&nx<size-1&&ny<size-1&&grid[ny][nx]);if(!next.length){stack.pop();continue}const [nx,ny,dx,dy]=next[Math.floor(Math.random()*next.length)];grid[y+dy][x+dx]=0;grid[ny][nx]=0;stack.push([nx,ny])}px=1;py=1;steps=0;start=null;finished=false;$("timer").textContent="0.0";$("status").textContent="새 미로 준비 완료! 출구를 찾아봐.";showBest();draw()}function move(dx,dy){if(finished||!grid.length)return;const x=px+dx,y=py+dy;if(x<0||y<0||x>=size||y>=size||grid[y][x])return;if(start===null){start=performance.now();tick=setInterval(()=>$("timer").textContent=elapsed().toFixed(1),100)}px=x;py=y;steps++;draw();if(px===size-2&&py===size-2){const t=elapsed();finished=true;clearInterval(tick);$("timer").textContent=t.toFixed(1);$("status").textContent="🎉 탈출 성공! "+t.toFixed(1)+"초 · "+steps+"걸음";const b=best();if(!b||t<b.time){try{localStorage.setItem(bestKey(),JSON.stringify({time:t,steps}))}catch{}}showBest()}}const map={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};document.addEventListener("keydown",e=>{if(e.target.matches("select,input,textarea"))return;if(map[e.key]){e.preventDefault();move(...map[e.key])}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};move(...m[b.dataset.dir])});let touch=null;$("board").addEventListener("touchstart",e=>{if(e.touches.length===1)touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$("board").addEventListener("touchend",e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))},{passive:true});$("new").onclick=generate;$("difficulty").onchange=generate;document.addEventListener("visibilitychange",()=>{if(document.hidden&&start&&!finished){const current=elapsed();start=performance.now()-current*1000}});generate();</script><script type="module" src="https://semicolonxss.github.io/Formwheel/assets/live-presence.js"></script></body></html>
