<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>명예의 전당 | Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:radial-gradient(circle at top,#33205d,#101525 60%);color:#f7f4ff}main{max-width:980px;margin:auto;padding:24px 16px 80px}a{color:#cdb6ff}.top{display:flex;justify-content:space-between;align-items:center}.hero{text-align:center;padding:35px 0}h1{font-size:clamp(32px,7vw,60px);margin:8px}p{color:#c7c3d5}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input,select,textarea{font:inherit;border-radius:10px;padding:10px;border:1px solid #75668e;background:#211b35;color:white}button{cursor:pointer}button:hover,button[aria-pressed=true]{background:#6341a2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.entry,.panel{background:#201b35;border:1px solid #56496c;border-radius:18px;padding:18px}.entry h3{margin:8px 0}.muted{color:#c3bdd0;font-size:13px}.pill{display:inline-block;background:#40305e;padding:5px 9px;border-radius:30px;font-size:12px}.panel{margin-top:25px}label{display:grid;gap:6px;margin:10px 0}textarea{min-height:70px}input,select,textarea{box-sizing:border-box;width:100%}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}#message{min-height:1.5em}button.danger{border-color:#bb7180}.note{border-left:3px solid #b79bea;padding-left:12px} [hidden]{display:none!important}
</style></head><body><main><div class="top"><a href="./index.html">← Formwheel Hub</a><span>🏛️ LEGENDS NEVER FADE</span></div>
<section class="hero"><div style="font-size:42px">🏆</div><h1>명예의 전당</h1><p>기록의 주인공, 개척자, 그리고 Formwheel을 빛낸 사람들</p></section>
<div class="tabs" id="tabs" aria-label="명예의 전당 분류"></div>
<div id="cards" class="grid" aria-live="polite"></div>
<section class="panel"><h2>⚙️ 편집 및 기록 관리</h2><p class="note">현재 버전은 <strong>이 브라우저에만 저장되는 편집형 미리보기</strong>입니다. Firebase 관리자 권한 검증 및 서버 자동 집계가 연결되기 전까지 다른 방문자에게 공개되지 않습니다.</p>
<div class="actions"><button id="toggle">편집기 열기</button><button id="export">JSON 내보내기</button><button id="importButton">JSON 가져오기</button><input id="importFile" type="file" accept="application/json" hidden></div>
<div id="editor" hidden><form id="form"><input id="id" type="hidden"><div class="row"><label>닉네임<input id="name" maxlength="60" required></label><label>칭호<input id="title" maxlength="80" required></label></div>
<div class="row"><label>분류<select id="category"><option value="game">게임 기록</option><option value="rapid">Rapid / Clicker</option><option value="achievement">업적</option><option value="pioneer">초기 개척자</option><option value="contributor">특별 공헌</option><option value="history">역대 챔피언</option></select></label><label>점수 (선택)<input id="score" type="number" step="any" min="0"></label></div>
<label>설명<textarea id="description" maxlength="400"></textarea></label><label><span><input id="pinned" type="checkbox" style="width:auto"> 수동 고정 (자동 순위보다 우선)</span></label>
<div class="actions"><button type="submit">기록 저장</button><button id="clear" type="button">새 기록</button></div></form><div id="manage"></div></div><p id="message" role="status"></p></section>
</main><script>
(()=>{'use strict';const KEY='fw.hallOfFame.preview.v1',categories={all:'전체',game:'🎮 게임',rapid:'⚡ Rapid / Clicker',achievement:'🎖️ 업적',pioneer:'🌟 개척자',contributor:'🤝 공헌자',history:'📜 역대 챔피언'};let selected='all',entries=[];
try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(value))entries=value.filter(valid)}catch{}
const $=id=>document.getElementById(id);function valid(e){return e&&typeof e.id==='string'&&typeof e.name==='string'&&typeof e.title==='string'&&Object.hasOwn(categories,e.category)&&e.category!=='all'&&e.name.length<=60&&e.title.length<=80&&(!e.description||typeof e.description==='string'&&e.description.length<=400)&&(!e.score||typeof e.score==='number'&&Number.isFinite(e.score)&&e.score>=0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));$('message').textContent='이 브라우저에 저장했어요.'}catch(e){$('message').textContent='저장 실패: '+e.message}render()}
function render(){const tabs=$('tabs');tabs.replaceChildren();for(const [key,label] of Object.entries(categories)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(selected===key));b.onclick=()=>{selected=key;render()};tabs.append(b)}
const cards=$('cards');cards.replaceChildren();const list=entries.filter(e=>selected==='all'||e.category===selected).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(Number(b.score)||0)-(Number(a.score)||0));if(!list.length){const p=document.createElement('p');p.textContent='아직 등재된 기록이 없어요. 첫 번째 전설을 등록해 보세요!';cards.append(p)}
for(const e of list){const card=document.createElement('article');card.className='entry';const pill=document.createElement('span');pill.className='pill';pill.textContent=categories[e.category]+(e.pinned?' · 📌 고정':'');const h=document.createElement('h3');h.textContent=e.name;const title=document.createElement('strong');title.textContent=e.title;const p=document.createElement('p');p.textContent=e.description||'';card.append(pill,h,title,p);if(e.score!==null&&e.score!==undefined){const s=document.createElement('p');s.className='muted';s.textContent='기록: '+e.score.toLocaleString();card.append(s)}cards.append(card)}
const manage=$('manage');manage.replaceChildren();for(const e of entries){const line=document.createElement('div');line.className='actions';const label=document.createElement('span');label.textContent=e.name+' — '+e.title;const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>fill(e);const del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=()=>{if(confirm('이 기록을 삭제할까요?')){entries=entries.filter(x=>x.id!==e.id);save()}};line.append(label,edit,del);manage.append(line)}}
function fill(e){$('id').value=e?.id||'';$('name').value=e?.name||'';$('title').value=e?.title||'';$('category').value=e?.category||'game';$('score').value=e?.score??'';$('description').value=e?.description||'';$('pinned').checked=!!e?.pinned}
$('form').onsubmit=event=>{event.preventDefault();const e={id:$('id').value||('entry-'+Date.now()+'-'+Math.random().toString(36).slice(2)),name:$('name').value.trim(),title:$('title').value.trim(),category:$('category').value,score:$('score').value===''?null:Number($('score').value),description:$('description').value.trim(),pinned:$('pinned').checked};if(!valid(e))return void($('message').textContent='입력값을 확인해 주세요.');entries=entries.filter(x=>x.id!==e.id).concat(e);save();fill(null)};
$('clear').onclick=()=>fill(null);$('toggle').onclick=()=>{$('editor').hidden=!$('editor').hidden};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='formwheel-hall-of-fame.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async ev=>{const file=ev.target.files?.[0];if(!file)return;try{if(file.size>1024*1024)throw Error('파일이 너무 큽니다.');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.entries)||data.entries.length>1000||!data.entries.every(valid))throw Error('지원하지 않는 기록 형식입니다.');if(confirm('현재 이 브라우저의 기록을 가져온 파일로 교체할까요?')){entries=data.entries;save()}}catch(e){$('message').textContent='가져오기 실패: '+e.message}ev.target.value=''};render();
})();
</script></body></html>
