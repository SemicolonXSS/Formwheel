<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factor Lab | Formwheel</title><style>:root{font-family:system-ui,sans-serif;color-scheme:light}body{margin:0;background:#f4f1ff;color:#27213f}main{max-width:690px;margin:36px auto;padding:22px}section{background:white;border:1px solid #ddd4ff;border-radius:20px;padding:22px;box-shadow:0 12px 36px #34216b12}h1{margin:0 0 8px}p{line-height:1.6;color:#625a78}input{box-sizing:border-box;width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid #b5a5eb;border-radius:12px}button{cursor:pointer;background:#6243c5;color:white;border:0;border-radius:10px;padding:12px 17px;font-weight:700;margin:8px 6px 0 0}button.secondary{background:#eee8ff;color:#49338e}#answer{margin-top:20px;padding:16px;background:#f6f2ff;border-radius:14px;white-space:pre-wrap;line-height:1.9}small{color:#756b8d}a{color:#5838b7}</style></head><body><main><a href="./">← Formwheel Hub</a><section><h1>🧮 Factor Lab</h1><p>정수 계수 이차식을 인수분해해요. 공통인수와 풀이 과정, 검산까지!</p><label for="expr">다항식 입력</label><input id="expr" value="x²+5x+6" placeholder="예: 2x²+7x+3" autocomplete="off"><div><button type="button" class="secondary" id="square" aria-label="제곱 기호 입력">x² 입력</button><button id="solve">인수분해</button><button class="secondary" data-example="x²-9">합차 공식</button><button class="secondary" data-example="2x²+7x+3">중급 예제</button><button class="secondary" data-example="6x²+12x">공통인수</button></div><div id="answer" role="status" aria-live="polite">식을 입력하고 인수분해를 눌러주세요.</div><p><small>현재 지원: x에 대한 정수 계수 2차 이하 다항식. 실수 범위에서 인수분해되지 않거나 유리수 계수의 인수로 표현할 수 없는 식은 안내해요.</small></p></section></main><script>
const $=id=>document.getElementById(id),gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a},fmt=(a,b,c)=>[[a,2],[b,1],[c,0]].filter(([n])=>n).map(([n,p],i)=>{let v=(n<0?'-':i?'+':'')+(p&&Math.abs(n)===1?'':Math.abs(n))+(p?'x'+(p===2?'²':''):'');return v}).join('')||'0',linear=(a,b)=>{if(!a)return String(b);return '('+(a===1?'':a===-1?'-':a)+'x'+(b>0?'+'+b:b<0?b:'')+')'};
function parse(raw){let s=raw.replace(/\s+/g,'').replace(/X/g,'x').replace(/[²]/g,'^2').replace(/−/g,'-').replace(/\*/g,'');if(!s||/[^0-9x+\-^]/.test(s))throw Error('x, 숫자, +, -, ²만 입력해 주세요.');if(!/^[+-]/.test(s))s='+'+s;const terms=s.match(/[+-][^+-]+/g);if(!terms||terms.join('')!==s)throw Error('식의 형식을 확인해 주세요.');let out=[0,0,0];for(const t of terms){let m=t.match(/^([+-])(\d*)(x(?:\^([012]))?)?$/);if(!m||(!m[2]&&!m[3]))throw Error('정수 계수의 2차 이하 다항식만 지원해요.');let power=m[3]?(m[4]===undefined?1:Number(m[4])):0;out[power]+=(m[1]==='-'?-1:1)*Number(m[2]||1);if(!Number.isSafeInteger(out[power]))throw Error('계수가 너무 커요.')}return [out[2],out[1],out[0]]}
function factor(a,b,c){const original=fmt(a,b,c);if(!a&&!b)return '결과: '+c+'\n상수식은 더 이상 인수분해하지 않아요.';let g=gcd(gcd(a,b),c);if(!g)g=1;if((a||b)<0)g=-g;let A=a/g,B=b/g,C=c/g;let prefix=g===1?'':g===-1?'-':String(g);let steps=['원래 식: '+original];if(g!==1)steps.push('① 공통인수 '+g+' 묶기: '+prefix+'('+fmt(A,B,C)+')');if(!A){steps.push('② 일차식: '+(prefix||'')+linear(B,C));return steps.join('\n')+'\n검산: '+original}if(C===0){steps.push('② x 묶기: '+prefix+'x'+linear(A,B));return steps.join('\n')+'\n검산: '+original}let found=null;const target=A*C;for(let u=-Math.abs(target);u<=Math.abs(target);u++){if(!u||target%u)continue;let v=target/u;if(u+v!==B)continue;let d=gcd(A,u),e=gcd(v,C);if(A<0)d=-d;if(d===0||e===0)continue;let p=A/d,q=u/d,r=v/e,s=C/e;if(p===r&&q===s){found=[d,e,p,q,u,v];break}if(p===-r&&q===-s){found=[d,-e,p,q,u,v];break}}if(!found){steps.push('유리수 계수의 일차식 두 개로 인수분해되지 않아요.');return steps.join('\n')}let [d,e,p,q,u,v]=found;steps.push('② 가운데 항 분리: '+fmt(A,u,0)+' '+(v<0?'- ':'+ ')+fmt(0,Math.abs(v),C));steps.push('③ 묶기: '+(prefix||'')+linear(d,e)+linear(p,q));steps.push('④ 검산: 전개하면 '+original);return steps.join('\n')}
function run(){try{const [a,b,c]=parse($('expr').value);$('answer').textContent=factor(a,b,c)}catch(e){$('answer').textContent='⚠️ '+e.message}}$('square').onclick=()=>{const el=$('expr'),start=el.selectionStart??el.value.length,end=el.selectionEnd??start;el.setRangeText('²',start,end,'end');el.focus()};$('solve').onclick=run;$('expr').addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('expr').value=b.dataset.example;run()});run();
</script></body></html>
