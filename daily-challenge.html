<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel · 오늘의 도전</title><style>body{font-family:system-ui;background:#f5f2ff;color:#292244;margin:0}main{max-width:650px;margin:30px auto;padding:20px}article{background:white;border-radius:18px;padding:20px;margin:12px 0;border:1px solid #e4dcfc}a{color:#5c40b8}small{color:#756d8b}h1{margin-bottom:5px}.tag{display:inline-block;border-radius:10px;background:#eae3ff;padding:5px 10px;color:#4c3699}</style><main><a href="./">← Hub</a><h1>📅 오늘의 도전</h1><p id="date"></p><p>오늘은 어떤 프로젝트를 탐험할까?</p><div id="missions"></div><small>현재는 일일 미션 안내 시제품입니다. 자동 완료 판정, AQS XP, Rapid 보상 지급은 아직 연결되지 않았습니다.</small><script>const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'});const date=fmt.format(new Date());document.getElementById('date').textContent='한국 시간 기준 '+date;const all=[{t:'도구 탐험가',d:'Wheel을 열어 도구를 둘러보세요.',u:'../Formwheel_Wheel/'},{t:'반응 속도 탐험',d:'Reflex 프로젝트를 방문해 보세요.',u:'../Formwheel_Reflex/'},{t:'퀴즈 모험',d:'Quiz 프로젝트를 살펴보세요.',u:'../Formwheel_Quiz/'},{t:'해독 연구원',d:'Decode 도구를 탐험해 보세요.',u:'../Formwheel_Decode/'},{t:'업적 관찰자',d:'AQS의 업적과 퀘스트를 살펴보세요.',u:'../Formwheel_AQS/'},{t:'탐험 지도 여행',d:'Formwheel 월드맵의 지역을 둘러보세요.',u:'./explore.html'}];const seed=[...date].reduce((n,c)=>n*31+c.charCodeAt(0),0)>>>0;const offset=seed%all.length;const list=[0,1,2].map(i=>all[(offset+i)%all.length]);const wrap=document.getElementById('missions');list.forEach((m,i)=>{const card=document.createElement('article');const title=document.createElement('h2');title.textContent=['🌱 쉬움 · ','⭐ 보통 · ','🏆 어려움 · '][i]+m.t;const desc=document.createElement('p');desc.textContent=m.d;const link=document.createElement('a');link.href=m.u;link.textContent='프로젝트 열기 →';card.append(title,desc,link);wrap.append(card)});</script></main></html>
