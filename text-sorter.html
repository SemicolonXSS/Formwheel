<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>텍스트 정렬기 | Formwheel Tools</title><style>body{font:16px system-ui;background:#f5f6ff;color:#252746;margin:0}main{max-width:760px;margin:32px auto;padding:22px;background:white;border-radius:20px;box-shadow:0 8px 30px #25274615}h1{margin:10px 0}textarea,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #cbd0e6}textarea{width:100%;box-sizing:border-box;min-height:170px;resize:vertical}select{width:100%}button{background:#5548bd;color:white;cursor:pointer;border:0}button.secondary{background:#e9e8fa;color:#35305b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#666c82}label{display:block;margin:8px 0}#result{white-space:pre-wrap;background:#f5f6ff;padding:16px;border-radius:12px;min-height:80px;overflow-wrap:anywhere}@media(max-width:520px){main{margin:8px;padding:16px}.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./">← Formwheel Hub</a><h1>🔤 텍스트 정렬기</h1><p class="muted">항목을 한 줄에 하나씩 입력하고 원하는 기준으로 정렬하세요.</p><label for="source">입력 항목</label><textarea id="source" placeholder="바나나&#10;사과&#10;딸기&#10;포도">바나나
사과
딸기
포도
키위
수박</textarea><div class="grid"><label>정렬 기준<select id="sort"><option value="ko">가나다순 / ABC순</option><option value="len">글자 수 순</option><option value="num">숫자 순</option><option value="input">입력 순서</option><option value="shuffle">무작위 섞기</option></select></label><label>정렬 방향<select id="direction"><option value="asc">오름차순 / 짧은 순</option><option value="desc">내림차순 / 긴 순</option></select></label></div><label for="filter">포함할 단어 (선택)</label><input id="filter" type="search" placeholder="입력 항목에서 찾기" style="font:inherit;padding:12px;box-sizing:border-box;width:100%"><label><input type="checkbox" id="numbered"> 결과에 줄 번호 표시</label><label><input type="checkbox" id="unique"> 중복 제거</label><label><input type="checkbox" id="count"> 글자 수 표시</label><div class="actions"><button id="run">정렬하기</button><button id="copy" class="secondary">결과 복사</button><button id="download" class="secondary">TXT 저장</button><button id="clear" class="secondary">초기화</button></div><p class="muted">Ctrl / ⌘ + Enter: 정렬하기</p><button id="reuse" class="secondary">결과를 입력으로 사용</button><h2>결과 <small id="total"></small></h2><div id="result" aria-live="polite"></div></main><script>const $=id=>document.getElementById(id);let output='', sorted=[];function compareNumbers(a,b,coll){const x=Number(a),y=Number(b),xn=Number.isFinite(x),yn=Number.isFinite(y);if(xn&&yn)return x-y;if(xn!==yn)return xn?-1:1;return coll.compare(a,b)}function run(){let a=$('source').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const query=$('filter').value.trim().toLocaleLowerCase('ko');if(query)a=a.filter(x=>x.toLocaleLowerCase('ko').includes(query));if($('unique').checked)a=[...new Set(a)];let mode=$('sort').value,coll=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});if(mode==='shuffle'){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}else if(mode!=='input'){a=a.map((v,i)=>({v,i})).sort((x,y)=>{let n=mode==='len'?[...x.v].length-[...y.v].length:mode==='num'?compareNumbers(x.v,y.v,coll):coll.compare(x.v,y.v);return ($('direction').value==='desc'?-n:n)||x.i-y.i}).map(x=>x.v)}else if($('direction').value==='desc')a.reverse();sorted=a.slice();output=a.map((x,i)=>($('numbered').checked?(i+1)+'. ':'')+x+($('count').checked?' ('+[...x].length+'자)':'')).join('\n');$('result').textContent=output||'항목을 입력해 주세요.';$('total').textContent=a.length+'개'}$('numbered').onchange=run;$('filter').oninput=run;$('reuse').onclick=()=>{if(!sorted.length)return;$('source').value=sorted.join('\n');$('filter').value='';$('sort').value='input';$('direction').value='asc';run();$('source').focus()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});$('run').onclick=run;$('sort').onchange=run;$('direction').onchange=run;$('unique').onchange=run;$('count').onchange=run;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output);alert('복사했어요!')}catch(e){alert('복사할 수 없어요. 결과를 직접 선택해 주세요.')}};$('download').onclick=()=>{let u=URL.createObjectURL(new Blob([output],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='formwheel-sorted.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('clear').onclick=()=>{$('source').value='';run()};run();</script></body></html>
