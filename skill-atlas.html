<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKILL ATLAS · Formwheel</title><style>body{font:16px system-ui;background:#111827;color:#f8fafc;margin:0}main{max-width:680px;margin:auto;padding:24px}section{background:#1f2937;padding:18px;border-radius:16px;margin:14px 0}a{color:#fdba74}button,input,select{font:inherit;padding:10px;margin:5px;max-width:90%}label{display:block;margin:10px 0}progress{width:100%}button{cursor:pointer}p{line-height:1.6}</style><main><a href="./">← Formwheel</a><h1>SKILL ATLAS</h1><p>이 기기에 저장된 실제 기록을 확인합니다. 서로 다른 게임 점수를 임의로 능력 점수로 환산하지 않습니다.</p><section id="records"></section><button id="refresh">새로고침</button></main><script>function read(k){try{return localStorage.getItem(k)}catch{return null}}function render(){const el=document.getElementById('records');el.replaceChildren();for(const [name,key,unit] of [['Polyrhythm','fw-polyrhythm-best','점'],['Reflex','formwheel_reflex_best','ms']]){const raw=read(key),n=Number(raw);const p=document.createElement('p');p.textContent=name+' · '+(raw!==null&&Number.isFinite(n)&&n>0?n.toLocaleString()+' '+unit:'기록 없음');el.append(p)}let rows=[];try{const a=JSON.parse(read('fw_reflex_solo_history_v1')||'[]');if(Array.isArray(a))rows=a.filter(x=>Number.isFinite(x.avg)&&x.success===x.rounds&&x.rounds===5).slice(0,10)}catch{}const p=document.createElement('p');p.textContent='Reflex 5라운드 성공 기록 (최근 최대 10개): '+(rows.map(x=>Math.round(x.avg)+'ms').join(' / ')||'없음');el.append(p)}document.getElementById('refresh').onclick=render;render();</script></html>
