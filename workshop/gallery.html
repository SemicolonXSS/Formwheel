<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Gallery | Formwheel</title><meta name="description" content="Formwheel Creator Gallery에서 사용자 작품을 찾아보고 공유하세요."><link rel="icon" href="../assets/formwheel-favicon.svg">
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#22283a;font-family:system-ui,-apple-system,sans-serif}header{background:white;border-bottom:1px solid #e0e5ed;padding:15px max(16px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#353cba}header a{text-decoration:none;font-weight:750}main{max-width:1000px;margin:auto;padding:30px 16px 70px}h1{font-size:clamp(30px,6vw,45px);margin:8px 0}p{line-height:1.6;color:#626b7c}.tag{font-weight:850;color:#b76017;font-size:12px;letter-spacing:1px}.panel,.work{border:1px solid #e1e5ee;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 17px #222b4708}.panel{margin:18px 0}.bar{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.bar input{flex:1 1 220px}.bar select{flex:0 1 160px}input,select,textarea{font:inherit;min-height:43px;border:1px solid #cbd1e0;border-radius:10px;padding:10px;width:100%}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.work{display:flex;flex-direction:column;gap:9px}.work h3{margin:0;overflow-wrap:anywhere}.work p{font-size:13px;margin:0;overflow-wrap:anywhere}.work .meta{font-size:12px;color:#788194}.work a,.btn{display:inline-block;background:#3439bd;color:#fff;text-decoration:none;border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;font-size:14px;cursor:pointer}.work a{margin-top:auto;text-align:center}.btn:disabled{opacity:.45;cursor:not-allowed}.fields{display:grid;gap:11px}.fields label{font-size:13px;font-weight:700;display:grid;gap:6px}.small{font-size:12px}.notice{padding:13px;border-radius:12px;background:#f0f3fb;font-size:13px}#status{min-height:22px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffad61;outline-offset:2px}</style></head><body>
<header><a href="../workshop/">← Workshop</a><strong>🌍 Creator Gallery</strong></header><main><span class="tag">FORMWHEEL CREATE 2.0</span><h1>다른 사람의 상상을 만나봐!</h1><p>커뮤니티가 만든 프로젝트를 발견하고, 내 작품도 제출해 보자. 작품은 검토 후 공개돼.</p>
<section class="panel"><h2>🔎 작품 둘러보기</h2><div class="bar"><input id="search" type="search" placeholder="제목 또는 설명 검색" aria-label="작품 검색"><select id="category" aria-label="작품 종류"><option value="">전체 종류</option><option>Maze</option><option>Music</option><option>Form</option><option>Check</option><option>기타</option></select><select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="title">이름순</option></select></div><p id="status" role="status" aria-live="polite">작품 목록을 불러오는 중…</p><div id="works" class="grid"></div></section>
<section class="panel" id="submit"><h2>🎨 작품 제출하기</h2><p class="small">Formwheel ID로 로그인한 뒤 작품 링크를 제출할 수 있어. 제출된 작품은 승인 전까지 갤러리에 보이지 않아.</p><p class="notice" id="authStatus" role="status">로그인 확인 중…</p><button class="btn" id="login" type="button" hidden>Google로 로그인</button><button class="btn" id="logout" type="button" hidden>로그아웃</button>
<form id="submission" class="fields"><label>작품 이름<input name="title" required maxlength="60" placeholder="작품의 이름"></label><label>종류<select name="type"><option>Maze</option><option>Music</option><option>Form</option><option>Check</option><option>기타</option></select></label><label>작품 소개<textarea name="description" maxlength="280" required placeholder="이 작품은 어떤 작품인가요?"></textarea></label><label>작품 URL<input name="url" type="url" maxlength="600" required placeholder="https://..."></label><label>제작자 표시 이름<input name="author" maxlength="32" required placeholder="공개될 이름 (실명 대신 닉네임 추천)"></label><button class="btn" id="send" disabled>검토 요청하기</button></form><p id="submitStatus" role="status" aria-live="polite" class="small"></p><p class="small">⚠️ 공개 작품에는 제목, 설명, 제작자 표시 이름과 URL이 보여. 개인정보·연락처·비공개 문서 링크는 넣지 마.</p></section>
</main><script type="module" src="./gallery.js"></script></body></html>
