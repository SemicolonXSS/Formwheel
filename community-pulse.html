<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMMUNITY PULSE | Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#35244f,#111321 70%);color:#f7f4ff}main{max-width:850px;margin:auto;padding:28px 18px 70px}a{color:#d2bbff}.hero,.card{background:#ffffff0b;border:1px solid #66547e;border-radius:20px;padding:22px;margin:15px 0}.hero h1{margin:0 0 8px;font-size:clamp(29px,6vw,42px)}.muted{color:#c9c0d6;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.grid .card{margin:0}button{font:inherit;padding:12px 15px;border:1px solid #aa90df;border-radius:12px;background:#4c3671;color:#fff;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffb95f;outline-offset:3px}.status{color:#bff0c2;font-weight:700}.notice{border:1px solid #927547;background:#392c22;padding:15px;border-radius:13px;margin:20px 0}input{accent-color:#bd91ff}label{display:block;margin:12px 0;line-height:1.5}.bar{height:9px;background:#393248;border-radius:12px;overflow:hidden}.bar>span{display:block;height:100%;background:#b58aff}body.fw-high-contrast{background:#000!important;color:#fff!important}body.fw-high-contrast .card,body.fw-high-contrast .hero{background:#000;border-color:#fff}body.fw-large-controls button,body.fw-large-controls input{min-height:56px;font-size:1.12rem}body.fw-reduced-motion *,body.fw-reduced-motion *:before,body.fw-reduced-motion *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main><a href="./index.html">← Formwheel 허브</a><section class="hero"><h1>🗳️ COMMUNITY PULSE</h1><p class="muted">어떤 기능이 가장 기대돼? 한 가지를 골라 봐!</p></section><div class="notice"><strong>현재는 로컬 투표 체험판입니다.</strong><p class="muted">선택은 이 브라우저에만 저장됩니다. 전체 방문자의 실제 투표 수나 순위를 보여주지 않으며, 서버에 제출되지 않습니다. 공용 투표 집계는 추후 인증·중복 방지·Firebase Rules 검토 후 도입할 수 있습니다.</p></div><div class="grid" id="options"></div><p id="status" class="status" role="status" aria-live="polite"></p><button id="reset" type="button">내 선택 지우기</button></main><script>
'use strict';const key='fw-community-pulse-local-v1';const options=[{id:'accessibility',icon:'🎨',name:'편안한 플레이 설정',desc:'큰 버튼과 고대비, 움직임 줄이기'},{id:'discover',icon:'🧭',name:'게임 발견 기능',desc:'새로운 게임을 쉽게 찾는 탐색 기능'},{id:'quality',icon:'🛠️',name:'버그 개선 도구',desc:'오류를 더 쉽게 발견하고 고치는 기능'}];let vote=null;try{vote=localStorage.getItem(key)}catch(e){}const root=document.getElementById('options');function render(){root.replaceChildren();for(const o of options){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=o.icon+' '+o.name;const p=document.createElement('p');p.className='muted';p.textContent=o.desc;const b=document.createElement('button');b.type='button';b.textContent=vote===o.id?'✓ 내 선택':'선택하기';b.disabled=!!vote;b.addEventListener('click',()=>{vote=o.id;try{localStorage.setItem(key,vote)}catch(e){document.getElementById('status').textContent='저장할 수 없는 브라우저입니다. 이번 화면에서만 선택이 유지됩니다.'}render()});card.append(h,p,b);root.append(card)}if(vote)document.getElementById('status').textContent='선택한 항목: '+(options.find(x=>x.id===vote)?.name||'알 수 없음');else document.getElementById('status').textContent='아직 선택하지 않았어요.'}document.getElementById('reset').addEventListener('click',()=>{vote=null;try{localStorage.removeItem(key)}catch(e){}render()});render();</script></body></html>
