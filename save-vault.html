<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔐 SAVE VAULT | Formwheel</title><style>body{margin:0;background:#151326;color:#f8f4ff;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px 16px}section{background:#26213c;border:1px solid #695589;border-radius:18px;padding:20px;margin:16px 0}a{color:#d5bdff}button,input{font:inherit;max-width:100%;padding:12px;border-radius:10px;border:1px solid #aa91d8;background:#3b3057;color:white}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0}p{line-height:1.6}output{display:block;overflow-wrap:anywhere;margin:12px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange}small{color:#d3c9e6}</style></head><body><main><a href="./index.html">← 허브</a><h1>🔐 SAVE VAULT</h1><section><p>현재 브라우저의 지원 설정만 백업합니다. 로그인 정보, 서버 기록, 최고 점수, 다른 게임 저장소의 데이터는 포함하지 않습니다.</p><div id="items"></div><button id="export">선택한 설정 백업</button></section><section><h2>복원</h2><label>백업 파일 <input id="file" type="file" accept=".fwbackup,.json,application/json"></label><div id="preview"></div><button id="restore" disabled>선택한 설정 복원</button><p id="status" role="status"></p></section></main><script>
'use strict';const rules={'fw-polyrhythm-visual-theme':v=>['glass','neon','classic','basic','shape'].includes(v),'fw-polyrhythm-trail':v=>/^[a-z-]{1,24}$/.test(v),'fw-polyrhythm-judgment-offset':v=>/^-?\d+(\.\d+)?$/.test(v)&&Math.abs(Number(v))<=200,'fw-polyrhythm-death-effect':v=>/^[a-z-]{1,24}$/.test(v),'formwheel-hub-display-version':v=>['card','simple'].includes(v)};const status=document.getElementById('status'),items=document.getElementById('items'),preview=document.getElementById('preview'),restore=document.getElementById('restore');let pending=[];function valid(k,v){return Object.prototype.hasOwnProperty.call(rules,k)&&typeof v==='string'&&rules[k](v)}function checkbox(root,k,v){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.dataset.key=k;label.append(box,document.createTextNode(' '+k+' · '+v));root.append(label)}function refresh(){items.replaceChildren();try{for(const k of Object.keys(rules)){const v=localStorage.getItem(k);if(valid(k,v))checkbox(items,k,v)}if(!items.children.length)items.textContent='백업 가능한 저장 설정이 없습니다.'}catch{items.textContent='저장 공간 접근 불가'}}function selected(root){return [...root.querySelectorAll('input:checked')].map(x=>x.dataset.key)}document.getElementById('export').onclick=()=>{try{const values={};for(const k of selected(items)){const v=localStorage.getItem(k);if(valid(k,v))values[k]=v}if(!Object.keys(values).length){status.textContent='선택된 설정 없음';return}const url=URL.createObjectURL(new Blob([JSON.stringify({schema:'fwbackup-v1',values},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='formwheel-settings.fwbackup';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch{status.textContent='백업 실패'}};document.getElementById('file').onchange=async e=>{pending=[];preview.replaceChildren();restore.disabled=true;try{const f=e.target.files[0];if(!f||f.size>65536)throw Error();const d=JSON.parse(await f.text());if(d.schema!=='fwbackup-v1'||!d.values||typeof d.values!=='object'||Array.isArray(d.values))throw Error();pending=Object.entries(d.values).filter(([k,v])=>valid(k,v));for(const [k,v] of pending)checkbox(preview,k,v);restore.disabled=!pending.length;status.textContent=pending.length+'개 지원 설정 확인. 기존 값이 덮어써질 수 있습니다.'}catch{status.textContent='지원하지 않는 백업 파일입니다.'}};restore.onclick=()=>{const keys=selected(preview);if(!keys.length||!confirm('선택한 설정을 덮어쓸까요?'))return;let n=0;try{for(const [k,v] of pending)if(keys.includes(k)){localStorage.setItem(k,v);n++}status.textContent=n+'개 복원 완료. 게임을 다시 열어 주세요.'}catch{status.textContent=n+'개 복원 후 저장 오류 발생'}refresh()};refresh();</script></body></html>
