<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAME FESTIVAL · Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f7f6ff;color:#25233e;font:15px system-ui,-apple-system,sans-serif}header{background:#302563;color:white;padding:15px;display:flex;justify-content:space-between}header a{color:white}main{max-width:850px;margin:20px auto;padding:0 13px}.card{background:white;border:1px solid #dedaf1;border-radius:16px;padding:17px;margin:12px 0}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#5140b6;color:white;font-weight:750;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#eceafd;color:#362d79}select{font:inherit;padding:9px;border:1px solid #a9a1d3;border-radius:9px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.muted{color:#656681;font-size:13px}.step{padding:12px;border:1px solid #e2e0ef;border-radius:12px;margin:9px 0}.current{background:#f2efff;border-color:#8471d5}.done{background:#f1faf4}.tag{font-size:12px;border-radius:8px;padding:4px 8px;background:#eeebff}progress{width:100%;height:15px}h1{margin:2px 0 8px}#status{min-height:20px}.hidden{display:none}</style></head><body><header><strong>🎡 GAME FESTIVAL</strong><a href="./">← 허브</a></header><main>
<section class="card"><h1>🏆 연속 게임 챌린지</h1><p class="muted">다섯 가지 게임을 순서대로 방문하고, 직접 플레이한 뒤 완료 표시를 눌러 다음 게임에 도전해 보세요. 점수 자동 검증은 아직 지원하지 않아요.</p><div class="row"><label>코스 선택 <select id="course"><option value="arcade">⚡ 아케이드 러시</option><option value="brain">🧠 두뇌 챌린지</option><option value="party">🎲 랜덤 파티</option></select></label><button id="restart" class="secondary">코스 초기화</button></div><p id="status" role="status"></p><progress id="progress" value="0" max="5"></progress><p id="count"></p></section>
<section class="card"><h2>🎮 페스티벌 코스</h2><div id="steps"></div></section>
<section class="card"><h2>🎁 완주 기념</h2><p id="award">5개 게임을 모두 완료하면 이 브라우저에 페스티벌 완주 기록이 저장돼요.</p><p class="muted">완주는 자기 신고 방식이며 AQS XP·Rapid·공식 랭킹 보상을 자동 지급하지 않습니다.</p><button id="share" class="secondary">결과 공유하기</button></section>
</main><script>
(function(){'use strict';
const games={Reflex:['⚡ Reflex','Formwheel_Reflex'],Button:['🔘 Button','Formwheel_Button'],Marble:['🎱 Marble','Formwheel_Marble'],Time:['⏱️ Time','Formwheel_Time'],Cook:['🍳 Cook','Formwheel_Cook'],Quiz:['🧠 Quiz','Formwheel_Quiz'],Decode:['🔐 Decode','Formwheel_Decode'],Check:['✅ Check','Formwheel_Check'],Balance:['⚖️ Balance','Formwheel_Balance'],Spy:['🕵️ Spy','Formwheel_Spy'],Fate:['🎴 Fate','Formwheel_Fate'],Risk:['🎲 Risk','Formwheel_Risk'],GCrown:['👑 GCrown','Formwheel_GCrown'],DiceDuel:['🎲 DiceDuel','Formwheel_DiceDuel']};
const courses={arcade:['Reflex','Button','Marble','Time','Cook'],brain:['Quiz','Decode','Check','Balance','Reflex'],party:['Spy','Fate','Risk','GCrown','DiceDuel']};
const KEY='formwheel.festival.s2.v1',$=id=>document.getElementById(id);
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return d&&typeof d==='object'?d:{}}catch{return {}}}
let data=load();if(!courses[data.course])data.course='arcade';if(!data.runs||typeof data.runs!=='object'||Array.isArray(data.runs))data.runs={};
function state(){const r=data.runs[data.course];if(!r||typeof r!=='object'||Array.isArray(r))return {done:[],opened:[],finishedAt:null};const ids=courses[data.course],opened=Array.isArray(r.opened)?r.opened.filter(x=>ids.includes(x)):[],raw=Array.isArray(r.done)?r.done:[];const done=[];for(const id of ids){if(raw.includes(id)&&opened.includes(id)&&(done.length===ids.indexOf(id)))done.push(id);else break}return {...r,done,opened,finishedAt:done.length===ids.length&&Number.isFinite(r.finishedAt)?r.finishedAt:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{$('status').textContent='저장소를 사용할 수 없어 진행 기록을 저장하지 못했어요.'}}
function update(run){data.runs[data.course]=run;save();render()}
function render(){
$('course').value=data.course;const ids=courses[data.course],r=state(),done=Array.isArray(r.done)?r.done.filter(x=>ids.includes(x)):[],opened=Array.isArray(r.opened)?r.opened:[];$('progress').value=done.length;$('count').textContent=done.length+' / '+ids.length+'개 완료';
const box=$('steps');box.replaceChildren();for(const [index,id]of ids.entries()){const finished=done.includes(id),unlocked=index===0||done.includes(ids[index-1]);const section=document.createElement('div');section.className='step '+(finished?'done':unlocked?'current':'');const row=document.createElement('div');row.className='row';const label=document.createElement('strong');label.textContent=(index+1)+'. '+games[id][0];const tag=document.createElement('span');tag.className='tag';tag.textContent=finished?'✅ 완료':unlocked?'🎯 도전 가능':'🔒 이전 게임 먼저';row.append(label,tag);section.append(row);const p=document.createElement('p');p.className='muted';p.textContent=finished?'플레이 완료로 표시했어요.':unlocked?'게임을 열고 플레이한 뒤 완료를 눌러 주세요.':'앞 게임을 완료하면 열려요.';section.append(p);if(unlocked){const actions=document.createElement('div');actions.className='row';const a=document.createElement('a');a.className='btn';a.href='https://semicolonxss.github.io/'+games[id][1]+'/';a.target='_blank';a.rel='noopener noreferrer';a.textContent='게임 열기 ↗';a.addEventListener('click',()=>{const now=state();now.opened=Array.isArray(now.opened)?now.opened:[];if(!now.opened.includes(id))now.opened.push(id);update(now)});actions.append(a);if(!finished){const b=document.createElement('button');b.className='secondary';b.textContent='플레이 완료 표시';b.disabled=!opened.includes(id);b.addEventListener('click',()=>{const now=state();now.done=Array.isArray(now.done)?now.done:[];if(!now.done.includes(id))now.done.push(id);if(now.done.length===ids.length&&!now.finishedAt)now.finishedAt=Date.now();update(now)});actions.append(b)}section.append(actions)}box.append(section)}
$('award').textContent=done.length===ids.length?'🏆 '+data.course.toUpperCase()+' 코스 완주! '+(r.finishedAt?new Date(r.finishedAt).toLocaleString('ko-KR'):''):'5개 게임 완주까지 '+(ids.length-done.length)+'개 남았어요.';
}
$('course').addEventListener('change',e=>{data.course=courses[e.target.value]?e.target.value:'arcade';save();render()});
$('restart').onclick=()=>{if(!confirm('선택한 코스의 현재 진행 기록을 초기화할까요?'))return;delete data.runs[data.course];save();render()};
$('share').onclick=async()=>{const r=state(),msg='🎡 Formwheel GAME FESTIVAL '+$('course').selectedOptions[0].text+' '+(Array.isArray(r.done)?r.done.length:0)+'/5 완료! https://semicolonxss.github.io/Formwheel/festival.html';try{if(navigator.share)await navigator.share({text:msg,url:'https://semicolonxss.github.io/Formwheel/festival.html'});else{await navigator.clipboard.writeText(msg);$('status').textContent='결과를 복사했어요!'}}catch(e){if(e.name!=='AbortError')$('status').textContent='공유할 수 없어요. 주소창의 링크를 복사해 주세요.'}};
window.addEventListener('storage',e=>{if(e.key===KEY){data=load();if(!courses[data.course])data.course='arcade';if(!data.runs||typeof data.runs!=='object'||Array.isArray(data.runs))data.runs={};render()}});render();
})();
</script></body></html>
