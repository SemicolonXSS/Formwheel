<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATTERN LAB | Formwheel</title><style>body{background:#101322;color:#eee;font:16px system-ui;margin:auto;padding:24px;max-width:680px}a{color:#c4b5fd}button,select{font:inherit;padding:12px;background:#292343;color:white;border:1px solid #7661b5;border-radius:10px;margin:6px}canvas{width:100%;background:#080b14;border-radius:16px;touch-action:none}p{line-height:1.6}output{display:block;padding:12px;white-space:pre-line}</style><a href="./">← Formwheel</a><h1>PATTERN LAB</h1><p>비공식 독립 훈련 · 움직이는 장애물 피하기 / 타일 반응 연습</p><select id="mode"><option value="beam">회전 레이저</option><option value="tile">반응 타일</option></select><select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="start">시작 / 재시도</button><canvas id="c" width="480" height="320"></canvas><output id="out">레이저 모드: 화면을 드래그해 이동. 타일 모드: 빛나는 타일 터치.</output><script>const c=document.querySelector('#c'),g=c.getContext('2d'),out=document.querySelector('#out'),mode=document.querySelector('#mode'),speed=document.querySelector('#speed');let running=false,start=0,x=60,y=160,hits=0,tx=100,ty=100;function target(){tx=30+Math.random()*420;ty=30+Math.random()*260}document.querySelector('#start').onclick=()=>{running=true;start=performance.now();x=60;y=160;hits=0;target()};mode.onchange=()=>{running=false};function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*320/r.height]}c.onpointerdown=e=>{if(!running)return;const [a,b]=point(e);if(mode.value==='tile'){if(Math.hypot(a-tx,b-ty)<28){hits++;target()}}else{x=a;y=b;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(running&&mode.value==='beam'&&c.hasPointerCapture(e.pointerId))[x,y]=point(e)};function frame(now){g.clearRect(0,0,480,320);if(running){const t=(now-start)/1000;if(mode.value==='beam'){const a=t*Number(speed.value)*.65;g.strokeStyle='#ff526d';g.lineWidth=12;g.beginPath();g.moveTo(240-600*Math.cos(a),160-600*Math.sin(a));g.lineTo(240+600*Math.cos(a),160+600*Math.sin(a));g.stroke();g.fillStyle='#60a5fa';g.beginPath();g.arc(x,y,9,0,Math.PI*2);g.fill();if(t>1&&Math.abs((x-240)*Math.sin(a)-(y-160)*Math.cos(a))<15){running=false;out.textContent='훈련 종료 · '+t.toFixed(1)+'초 생존';}else out.textContent=t.toFixed(1)+'초';}else{g.fillStyle='#a78bfa';g.beginPath();g.arc(tx,ty,25,0,Math.PI*2);g.fill();out.textContent='성공 '+hits+'회 · '+t.toFixed(1)+'초';}}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
