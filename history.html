<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel History</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eddf;color:#29251d;font:17px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}header{letter-spacing:3px;color:#88612e;font-weight:800}h1{font-size:clamp(32px,7vw,56px);margin:12px 0}section{background:#fffaf0;border:1px solid #dac9a9;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 25px #63491c10}button,select,input,textarea{font:inherit;border:1px solid #cdbb99;border-radius:12px;padding:13px;background:white;color:inherit}button{cursor:pointer;font-weight:700}button:hover{border-color:#946a36}button:focus-visible{outline:3px solid #986e35}button.primary{background:#513d27;color:white}button:disabled{cursor:default}#choices{display:grid;gap:10px}#choices button{text-align:left;min-height:58px}.good{background:#d7efdc!important}.bad{background:#f8d9d2!important}nav,.row{display:flex;gap:8px;flex-wrap:wrap}label{display:grid;gap:6px;flex:1;min-width:120px}progress{width:100%;accent-color:#98703e}small{color:#77684f}textarea,input{width:100%}[hidden]{display:none!important}</style><main><header>FORMWHEEL / HISTORY</header><h1>시간을 걷다</h1><p>우리 역사를 한 문제씩 탐험하세요.</p><nav><button onclick="home()">시대 탐험</button><button onclick="review()">오답 노트</button><button onclick="edit()">문제 제작</button></nav><section id="menu"><h2>탐험 준비</h2><div class="row"><label>시대<select id="era"><option>전체</option><option>선사·고대</option><option>고려</option><option>조선</option><option>근현대</option></select></label><label>난이도<select id="level"><option>전체</option><option>초급</option><option>중급</option><option>고급</option></select></label><label>모드<select id="mode"><option>자유 학습</option><option>가족 대결</option><option>서바이벌</option></select></label></div><p id="count"></p><button class="primary" onclick="start()">탐험 시작 →</button></section><section id="game" hidden><small id="status"></small><progress id="progress"></progress><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary" hidden onclick="advance()">다음 문제 →</button></section><section id="editor" hidden><h2>나만의 문제</h2><form id="form"><label>시대<select id="ee"><option>선사·고대</option><option>고려</option><option>조선</option><option>근현대</option></select></label><label>난이도<select id="el"><option>초급</option><option>중급</option><option>고급</option></select></label><label>질문<input id="eq" required></label><label>정답<input id="ea" required></label><label>오답 3개 (한 줄씩)<textarea id="ew" required rows="3"></textarea></label><label>해설<textarea id="ex" required></textarea></label><p><button class="primary">저장</button></p></form><p id="notice" aria-live="polite"></p><div id="customlist"></div><button onclick="exportData()">내 문제 내보내기</button> <label>문제 가져오기<input type="file" accept="application/json" onchange="importData(this)"></label></section><section id="result" hidden></section><small>무료 · 광고 없음 · 기록은 이 기기에 저장됩니다.</small></main><script>
const $=id=>document.getElementById(id), load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const raw=[
['선사·고대','초급','고조선의 건국 설화에 등장하는 인물은?','단군왕검','주몽|박혁거세|온조','단군왕검은 고조선의 건국 설화에 등장한다.'],
['선사·고대','초급','고구려를 세운 인물은?','주몽','온조|왕건|이성계','주몽은 기원전 37년에 고구려를 세웠다고 전해진다.'],
['선사·고대','초급','신라의 수도는?','경주','공주|평양|개성','신라의 수도는 오늘날 경주에 해당한다.'],
['선사·고대','중급','백제의 사비 천도는 어느 왕 때 이루어졌는가?','성왕','근초고왕|무령왕|의자왕','성왕은 538년 사비로 수도를 옮겼다.'],
['선사·고대','중급','발해를 세운 인물은?','대조영','장보고|궁예|견훤','대조영은 698년 발해를 건국했다.'],
['선사·고대','고급','신라의 독서삼품과를 시행한 왕은?','원성왕','신문왕|성덕왕|진흥왕','원성왕은 788년 독서삼품과를 시행했다.'],
['고려','초급','고려를 세운 인물은?','왕건','이성계|궁예|최충헌','왕건은 918년 고려를 건국했다.'],
['고려','초급','고려가 만든 팔만대장경은 주로 무엇에 새겼는가?','나무판','종이|돌|비단','팔만대장경은 목판에 새긴 불교 경전이다.'],
['고려','중급','고려의 과거제를 시행한 왕은?','광종','태조|성종|공민왕','광종은 958년 과거제를 시행했다.'],
['고려','중급','직지의 간행 연도는?','1377년','1234년|1392년|1446년','직지는 1377년 청주 흥덕사에서 금속활자로 간행되었다.'],
['고려','고급','별무반을 조직한 인물은?','윤관','강감찬|서희|김부식','윤관은 여진에 대응하기 위해 별무반을 조직했다.'],
['고려','고급','삼국사기를 편찬한 인물은?','김부식','일연|이규보|정몽주','김부식 등이 1145년 삼국사기를 편찬했다.'],
['조선','초급','조선을 건국한 인물은?','이성계','세종|왕건|정도전','이성계는 1392년 조선을 건국했다.'],
['조선','초급','훈민정음이 반포된 해는?','1446년','1392년|1443년|1592년','훈민정음은 1443년에 창제되고 1446년에 반포되었다.'],
['조선','초급','훈민정음 창제를 주도한 왕은?','세종','태종|정조|영조','세종은 백성이 쉽게 글을 익힐 수 있도록 훈민정음을 창제했다.'],
['조선','중급','수원 화성 건설을 추진한 왕은?','정조','영조|숙종|고종','정조는 1794년부터 1796년까지 수원 화성을 건설했다.'],
['조선','중급','목민심서를 쓴 인물은?','정약용','박지원|이이|허준','정약용은 지방 관리의 자세를 다룬 목민심서를 저술했다.'],
['조선','고급','대동법이 처음 시행된 지역은?','경기도','충청도|전라도|경상도','광해군 때인 1608년 경기도에서 대동법이 처음 시행되었다.'],
['근현대','초급','3·1 운동이 일어난 해는?','1919년','1910년|1945년|1948년','1919년 3월 1일 독립을 요구하는 만세 운동이 시작되었다.'],
['근현대','초급','광복을 맞이한 해는?','1945년','1919년|1950년|1960년','1945년 8월 15일 광복을 맞았다.'],
['근현대','중급','대한제국이 선포된 해는?','1897년','1876년|1894년|1905년','고종은 1897년 대한제국을 선포했다.'],
['근현대','중급','대한민국 임시정부가 수립된 해는?','1919년','1905년|1910년|1948년','3·1 운동 이후 1919년 대한민국 임시정부가 수립되었다.'],
['근현대','고급','국채 보상 운동이 처음 시작된 지역은?','대구','서울|부산|평양','1907년 대구에서 국채 보상 운동이 시작되었다.'],
['근현대','고급','독립협회가 창립된 해는?','1896년','1884년|1894년|1907년','독립협회는 1896년 창립되었다.']
];const base=raw.map((r,i)=>({id:'b'+i,era:r[0],level:r[1],q:r[2],a:r[3],wrong:r[4].split('|'),ex:r[5]}));let custom=load('fwh-custom',[]), errors=load('fwh-errors',[]), pool=[],idx=0,score=0,life=3,teams=[0,0],mode='',locked=false;
const all=()=>[...base,...custom], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, filtered=()=>all().filter(q=>($('era').value==='전체'||q.era===$('era').value)&&($('level').value==='전체'||q.level===$('level').value));
function show(id){for(const s of ['menu','game','editor','result'])$(s).hidden=s!==id}function home(){show('menu');$('count').textContent=`선택 가능한 문제 ${filtered().length}개 · 전체 ${all().length}개`} $('era').onchange=$('level').onchange=home;
function start(list=filtered(),m=$('mode').value){if(!list.length){$('count').textContent='선택한 조건에 문제가 없습니다.';return}pool=shuffle(list).slice(0,20);idx=score=0;life=3;teams=[0,0];mode=m;show('game');render()}
function render(){locked=false;const q=pool[idx];$('status').textContent=`${q.era} · ${q.level} · ${idx+1}/${pool.length} · ${mode==='가족 대결'?'참가자 '+(idx%2+1):mode==='서바이벌'?'남은 기회 '+life:'정답 '+score}`;$('progress').max=pool.length;$('progress').value=idx;$('question').textContent=q.q;$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();shuffle([q.a,...q.wrong]).forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(a,b);$('choices').append(b)})}
function answer(a,b){if(locked)return;locked=true;const q=pool[idx],ok=a===q.a;for(const x of $('choices').children){x.disabled=true;if(x.textContent===q.a)x.classList.add('good')}if(ok){score++;teams[idx%2]++;errors=errors.filter(id=>id!==q.id)}else{b.classList.add('bad');life--;if(!errors.includes(q.id))errors.push(q.id)}save('fwh-errors',errors);$('feedback').textContent=(ok?'정답! ':'아쉬워요. 정답: '+q.a+' · ')+q.ex;$('next').hidden=false;$('next').textContent=idx+1===pool.length||(mode==='서바이벌'&&life<=0)?'결과 보기':'다음 문제 →'}
function advance(){if(!locked)return;idx++;if(idx>=pool.length||(mode==='서바이벌'&&life<=0)){show('result');$('result').replaceChildren();let h=document.createElement('h2');h.textContent=`탐험 완료! ${score}/${idx} 정답`;let p=document.createElement('p');p.textContent=mode==='가족 대결'?`참가자 1: ${teams[0]}점 · 참가자 2: ${teams[1]}점`:'오답 노트에서 다시 도전할 수 있어요.';let b=document.createElement('button');b.textContent='처음으로';b.onclick=home;$('result').append(h,p,b)}else render()}
function review(){let list=all().filter(q=>errors.includes(q.id));if(list.length)start(list,'오답 복습');else{home();$('count').textContent='아직 저장된 오답이 없어요.'}}
function edit(){show('editor');$('customlist').replaceChildren();custom.forEach(q=>{let p=document.createElement('p'),b=document.createElement('button');p.textContent=q.q+' ';b.textContent='삭제';b.onclick=()=>{custom=custom.filter(x=>x.id!==q.id);save('fwh-custom',custom);edit()};p.append(b);$('customlist').append(p)})}
$('form').onsubmit=e=>{e.preventDefault();let a=$('ea').value.trim(),wrong=$('ew').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!a||wrong.length!==3||new Set([a,...wrong]).size!==4||!$('eq').value.trim()||!$('ex').value.trim()){$('notice').textContent='질문, 해설과 서로 다른 정답 및 오답 3개를 입력하세요.';return}custom.push({id:'c'+Date.now()+Math.random(),era:$('ee').value,level:$('el').value,q:$('eq').value.trim(),a,wrong,ex:$('ex').value.trim()});$('notice').textContent=save('fwh-custom',custom)?'저장 완료!':'기기 저장 실패: 현재 세션에서만 사용됩니다.';e.target.reset();edit()};
function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(custom,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='history-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(input){try{let v=JSON.parse(await input.files[0].text());if(!Array.isArray(v)||v.length>1000||!v.every(q=>q&&['era','level','q','a','ex'].every(k=>typeof q[k]==='string'&&q[k].trim())&&['선사·고대','고려','조선','근현대'].includes(q.era)&&['초급','중급','고급'].includes(q.level)&&Array.isArray(q.wrong)&&q.wrong.length===3&&q.wrong.every(x=>typeof x==='string'&&x.trim())&&new Set([q.a,...q.wrong]).size===4))throw Error();custom.push(...v.map(q=>({...q,id:'c'+Date.now()+Math.random()})));$('notice').textContent=save('fwh-custom',custom)?'가져오기 완료':'기기 저장 실패';edit()}catch{$('notice').textContent='올바른 문제 JSON 파일을 선택하세요.'}input.value=''}home();</script></html>
