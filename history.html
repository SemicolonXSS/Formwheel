function render(){locked=false;const q=pool[idx];$('status').textContent=`${q.era} · ${q.level} · ${idx+1}/${pool.length} · ${mode==='가족 대결'?'참가자 '+(player+1):mode==='서바이벌'?'남은 기회 '+life:'정답 '+score}`;$('progress').max=pool.length;$('progress').value=idx;$('question').textContent=q.q;$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();shuffle([q.a,...q.wrong]).forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(a,b);$('choices').append(b)})}
function answer(a,b){if(locked)return;locked=true;const q=pool[idx],ok=a===q.a;for(const x of $('choices').children){x.disabled=true;if(x.textContent===q.a)x.classList.add('good')}if(ok){score++;teams[player]++;errors=errors.filter(id=>id!==q.id)}else{b.classList.add('bad');life--;if(!errors.includes(q.id))errors.push(q.id)}save('fwh-errors',errors);$('feedback').textContent=(ok?'정답! ':'아쉬워요. 정답: '+q.a+' · ')+q.ex;$('next').hidden=false;$('next').textContent=idx+1===pool.length||(mode==='서바이벌'&&life<=0)?(mode==='가족 대결'&&player===0?'참가자 교대':'결과 보기'):'다음 문제 →'}
function advance(){if(!locked)return;idx++;if(mode==='가족 대결'&&player===0&&idx>=pool.length){show('result');$('result').replaceChildren();const h=document.createElement('h2');h.textContent='참가자 2 차례!';const p=document.createElement('p');p.textContent='기기를 넘겨주세요. 점수는 마지막에 공개됩니다.';const b=document.createElement('button');b.textContent='참가자 2 시작';b.className='primary';b.onclick=()=>{player=1;pool=rounds[1];idx=0;score=0;life=3;show('game');render()};$('result').append(h,p,b);return}if(idx>=pool.length||(mode==='서바이벌'&&life<=0)){show('result');$('result').replaceChildren();let h=document.createElement('h2');h.textContent=mode==='가족 대결'?(teams[0]===teams[1]?'무승부!':`참가자 ${teams[0]>teams[1]?1:2} 승리!`):`탐험 완료! ${score}/${idx} 정답`;let p=document.createElement('p');p.textContent=mode==='가족 대결'?`참가자 1: ${teams[0]}/${rounds[0].length} · 참가자 2: ${teams[1]}/${rounds[1].length}`:'오답 노트에서 다시 도전할 수 있어요.';let b=document.createElement('button');b.textContent='처음으로';b.onclick=home;$('result').append(h,p,b)}else render()}
function review(){let list=all().filter(q=>errors.includes(q.id));if(list.length)start(list,'오답 복습');else{home();$('count').textContent='아직 저장된 오답이 없어요.'}}
function edit(){show('editor');$('customlist').replaceChildren();custom.forEach(q=>{let p=document.createElement('p'),b=document.createElement('button');p.textContent=q.q+' ';b.textContent='삭제';b.onclick=()=>{custom=custom.filter(x=>x.id!==q.id);save('fwh-custom',custom);edit()};p.append(b);$('customlist').append(p)})}
$('form').onsubmit=e=>{e.preventDefault();let a=$('ea').value.trim(),wrong=$('ew').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!a||wrong.length!==3||new Set([a,...wrong]).size!==4||!$('eq').value.trim()||!$('ex').value.trim()){$('notice').textContent='질문, 해설과 서로 다른 정답 및 오답 3개를 입력하세요.';return}custom.push({id:'c'+Date.now()+Math.random(),era:$('ee').value,level:$('el').value,q:$('eq').value.trim(),a,wrong,ex:$('ex').value.trim()});$('notice').textContent=save('fwh-custom',custom)?'저장 완료!':'기기 저장 실패: 현재 세션에서만 사용됩니다.';e.target.reset();edit()};
function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(custom,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='history-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(input){try{let v=JSON.parse(await input.files[0].text());if(!Array.isArray(v)||v.length>1000||!v.every(q=>q&&['era','level','q','a','ex'].every(k=>typeof q[k]==='string'&&q[k].trim())&&['선사·고대','고려','조선','근현대'].includes(q.era)&&['초급','중급','고급'].includes(q.level)&&Array.isArray(q.wrong)&&q.wrong.length===3&&q.wrong.every(x=>typeof x==='string'&&x.trim())&&new Set([q.a,...q.wrong]).size===4))throw Error();custom.push(...v.map(q=>({...q,id:'c'+Date.now()+Math.random()})));$('notice').textContent=save('fwh-custom',custom)?'가져오기 완료':'기기 저장 실패';edit()}catch{$('notice').textContent='올바른 문제 JSON 파일을 선택하세요.'}input.value=''}home();</script></html>
