<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLITCH DETECTOR | Formwheel FW12</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#0b1020;color:#e9edff}main{max-width:850px;margin:auto;padding:30px 18px}h1{font-size:clamp(28px,5vw,44px);margin-bottom:6px}.muted{color:#aeb9d9}.panel{background:#151e35;border:1px solid #344263;border-radius:18px;padding:20px;margin:18px 0}textarea{box-sizing:border-box;width:100%;min-height:140px;resize:vertical;border-radius:12px;border:1px solid #526184;background:#0c1428;color:white;padding:14px;font:14px ui-monospace,monospace}button,a.button{display:inline-block;background:#7466ed;color:white;border:0;border-radius:10px;padding:11px 15px;margin:8px 6px 0 0;cursor:pointer;text-decoration:none;font:inherit}button.secondary{background:#334361}.result{border-top:1px solid #344263;padding:14px 0}.result strong{color:#aeb0ff}code{overflow-wrap:anywhere}a{color:#b8b5ff}</style></head><body><main><a href="./index.html">← Formwheel Hub</a><h1>🧪 GLITCH DETECTOR</h1><p class="muted">SEREN #043 · FW12 진단실 · 로컬 분석 전용</p><section class="panel"><h2>오류 로그 분석</h2><p class="muted">오류를 붙여넣으면 브라우저 안에서만 분석합니다. 서버나 Firebase에 전송하지 않습니다.</p><label for="log">오류 메시지</label><textarea id="log" maxlength="30000" placeholder="예: FirebaseError: permission_denied"></textarea><div><button id="analyze">오류 분석</button><button class="secondary" id="early">허브 초기 오류 가져오기</button><button class="secondary" id="clear">초기화</button></div></section><section class="panel" aria-live="polite"><h2>진단 결과</h2><div id="results">로그를 입력하고 분석을 눌러주세요.</div></section><p class="muted">자동 수정은 수행하지 않습니다. 해결 가이드는 참고용이며 실제 원인 확인이 필요합니다.</p></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const rules=[
{re:/permission[_ -]?denied|permission denied/i,name:'Firebase 접근 권한',cause:'인증 상태, 경로 또는 Firebase Security Rules 불일치 가능성',fix:'요청 경로와 인증 상태를 확인하고 Firebase Emulator에서 규칙을 테스트하세요. 운영 규칙을 무조건 완화하지 마세요.'},
{re:/syntaxerror|unexpected token|unexpected keyword|expected '\)'/i,name:'JavaScript 문법',cause:'괄호, 문자열, 예약어 또는 배포된 JS 구문 문제',fix:'오류의 파일과 줄 번호를 확인하고 node --check로 문법을 검사하세요. 캐시된 이전 파일도 확인하세요.'},
{re:/failed to fetch|networkerror|net::|err_connection|timeout|cors/i,name:'네트워크/CORS',cause:'연결 문제, 서버 응답, CORS 정책 또는 리소스 경로 문제',fix:'개발자 도구 Network 탭에서 요청 URL과 상태 코드를 확인하세요. 민감한 요청 헤더는 공유하지 마세요.'},
{re:/quota|resource.exhausted|too.many.requests/i,name:'사용량 제한',cause:'서비스 할당량 또는 요청 빈도 제한 가능성',fix:'요청 빈도와 Firebase 사용량을 확인하고 재시도 간격을 조절하세요.'},
{re:/undefined|null|typeerror|referenceerror/i,name:'JavaScript 실행 오류',cause:'존재하지 않는 값 또는 초기화 순서 문제',fix:'오류 위치의 변수와 DOM 요소 존재 여부, 스크립트 실행 순서를 점검하세요.'}
];
function redact(s){return String(s).replace(/AIza[0-9A-Za-z_-]{20,}/g,'[REDACTED_API_KEY]').replace(/(Bearer\s+)[^\s"'<>]+/gi,'$1[REDACTED]').replace(/(password|token|secret|authorization|api[_-]?key)\s*[:=]\s*[^\s,;]+/gi,'$1=[REDACTED]').replace(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g,'[REDACTED_EMAIL]').replace(/https?:\/\/[^\s"'<>]+/gi,'[REDACTED_URL]');}
function add(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}
function analyze(){const out=$('results');out.replaceChildren();const raw=$('log').value.slice(0,30000);if(!raw.trim()){add(out,'p','분석할 로그가 없습니다.');return;}const found=rules.filter(r=>r.re.test(raw));if(!found.length)found.push({name:'미분류 오류',cause:'등록된 패턴과 일치하지 않습니다.',fix:'오류 발생 시점, 파일과 줄 번호, 재현 방법을 확인하세요.'});for(const r of found){const section=document.createElement('div');section.className='result';add(section,'strong',r.name);add(section,'p','가능한 원인: '+r.cause);add(section,'p','점검 방법: '+r.fix);out.append(section);}add(out,'p','개인정보 제거 미리보기:');add(out,'code',redact(raw).slice(0,1200));}
$('analyze').addEventListener('click',analyze);$('clear').addEventListener('click',()=>{$('log').value='';$('results').textContent='초기화했습니다.';});$('early').addEventListener('click',()=>{try{const items=window.opener&&window.opener.location.origin===location.origin?window.opener.__fwEarlyErrors:null;if(!Array.isArray(items)||!items.length){$('results').textContent='연결된 허브의 초기 오류가 없습니다. 허브에서 이 페이지를 새 창으로 열었을 때만 읽을 수 있습니다.';return;}$('log').value=items.slice(-30).map(x=>[x.message,x.filename,x.line].join(' ')).join('\n');analyze();}catch{$('results').textContent='허브 오류 기록에 접근할 수 없습니다.';}});
})();
</script></body></html>
