<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ff">
<title>Sudoku | Formwheel</title>
<link rel="icon" type="image/svg+xml" href="./assets/formwheel-favicon.svg">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#272443;background:#f5f3ff}*{box-sizing:border-box}body{margin:0}main{max-width:670px;margin:auto;padding:20px 14px 45px}a{color:#6650c8;text-decoration:none}h1{margin:12px 0 5px;font-size:30px}.hint{color:#6d6980;font-size:14px;margin:0 0 16px}.bar,.actions,.nums{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.bar{justify-content:space-between}.badge{padding:9px 12px;border-radius:12px;background:#ebe5ff;font-weight:700}select,button{font:inherit;border:1px solid #d5cdee;background:#fff;border-radius:10px;padding:10px 12px;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid #9078fb;outline-offset:2px}.primary,.active{color:white;background:#6b4dcc;border-color:#6b4dcc}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));width:min(100%,540px);aspect-ratio:1;margin:17px auto;border:3px solid #353047;border-radius:5px;overflow:hidden;background:white}.cell{border:0;border-right:1px solid #c7c1d9;border-bottom:1px solid #c7c1d9;border-radius:0;padding:0;min-width:0;background:#fff;font-size:clamp(15px,4.7vw,28px);font-weight:600;position:relative}.cell.boxright{border-right:3px solid #57516e}.cell.boxbottom{border-bottom:3px solid #57516e}.cell.fixed{background:#f2eff9;color:#38324a}.cell.peer{background:#f1edff}.cell.same{background:#e0d6ff}.cell.selected{background:#c8b9fb;box-shadow:inset 0 0 0 2px #7055c2}.cell.conflict{color:#c32751;background:#ffe0e8}.cell.wrong{color:#ba2947}.cell .notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);position:absolute;inset:2px;font-size:clamp(7px,1.9vw,11px);font-weight:500;color:#615a79}.cell .notes i{font-style:normal;display:flex;align-items:center;justify-content:center}.nums{justify-content:center}.nums button{font-size:20px;font-weight:700;min-width:43px;flex:1;max-width:57px;padding:10px 0}.actions{justify-content:center}.actions button{flex:1;min-width:112px}.status{text-align:center;min-height:42px;font-weight:650;color:#5948ad;margin:10px 0}footer{text-align:center;font-size:12px;color:#736d86;margin-top:20px}@media(max-width:420px){main{padding:12px 8px 28px}.cell{font-size:18px}.nums{gap:4px}.nums button{min-width:0;padding:9px 0;font-size:18px}.actions button{min-width:95px;padding:9px 7px}}
</style>
</head>
<body><main>
<a href="./">← Formwheel Hub</a><h1>🧩 Sudoku</h1><p class="hint">각 가로줄·세로줄·3×3 칸에 1~9를 한 번씩 채워 보세요.</p>
<div class="bar"><label>난이도 <select id="difficulty"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></label><span class="badge" id="clock">⏱ 00:00</span><button class="primary" id="new">새 퍼즐</button></div>
<div class="board" id="board" role="grid" aria-label="스도쿠 게임판"></div>
<div class="nums" id="numbers" aria-label="숫자 입력"></div>
<div class="actions"><button id="erase">⌫ 지우기</button><button id="notes">✏️ 메모 끔</button><button id="undo">↶ 실행 취소</button><button id="hint">💡 힌트</button></div>
<div class="actions"><button id="check">✓ 확인</button><button id="reset">↺ 처음부터</button></div>
<p id="status" class="status" aria-live="polite">칸을 고르고 숫자를 입력하세요.</p>
<footer>자동 저장 · 오프라인 플레이 · Formwheel</footer>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), KEY='formwheel-sudoku-v1';
let puzzle=[],solution=[],values=[],notes=[],history=[],selected=-1,noteMode=false,seconds=0,finished=false;
let difficulty='normal';
const clone=v=>JSON.parse(JSON.stringify(v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function choices(b,pos){const used=new Set(),r=Math.floor(pos/9),c=pos%9;for(let i=0;i<9;i++){used.add(b[r*9+i]);used.add(b[i*9+c])}const sr=Math.floor(r/3)*3,sc=Math.floor(c/3)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)used.add(b[(sr+y)*9+sc+x]);return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function solve(b,limit=1,random=false){let count=0,first=null;function visit(){let best=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){const choicesHere=choices(b,i);if(!choicesHere.length)return;if(!opts||choicesHere.length<opts.length){best=i;opts=choicesHere;if(opts.length===1)break}}if(best<0){count++;if(!first)first=b.slice();return}for(const n of random?shuffle(opts):opts){b[best]=n;visit();if(count>=limit){b[best]=0;return}}b[best]=0}visit();return {count,first}}
function generate(level){const b=Array(81).fill(0);const solved=solve(b,1,true).first;const p=solved.slice();const targets={easy:42,normal:34,hard:28};let filled=81;for(const i of shuffle(Array.from({length:81},(_,j)=>j))){if(filled<=targets[level])break;const old=p[i];p[i]=0;if(solve(p.slice(),2,false).count!==1)p[i]=old;else filled--}return {p,solved}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({puzzle,solution,values,notes,history:history.slice(-100),selected,noteMode,seconds,finished,difficulty}))}catch(e){}}
function restore(){try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(!data||!['puzzle','solution','values'].every(k=>Array.isArray(data[k])&&data[k].length===81))return false;if(!['easy','normal','hard'].includes(data.difficulty))return false;const valid=a=>a.every(x=>Number.isInteger(x)&&x>=0&&x<=9);if(!valid(data.puzzle)||!valid(data.solution)||!valid(data.values))return false;puzzle=data.puzzle;solution=data.solution;values=data.values;notes=Array.isArray(data.notes)&&data.notes.length===81?data.notes.map(x=>Array.isArray(x)?x.filter(n=>Number.isInteger(n)&&n>=1&&n<=9):[]):Array.from({length:81},()=>[]);history=Array.isArray(data.history)?data.history.slice(-100):[];selected=Number.isInteger(data.selected)&&data.selected>=0&&data.selected<81?data.selected:-1;noteMode=!!data.noteMode;seconds=Math.max(0,Math.floor(Number(data.seconds)||0));finished=!!data.finished;difficulty=data.difficulty;return true}catch(e){return false}}
function newGame(){difficulty=$('difficulty').value;const g=generate(difficulty);puzzle=g.p;solution=g.solved;values=puzzle.slice();notes=Array.from({length:81},()=>[]);history=[];seconds=0;finished=false;selected=-1;noteMode=false;$('status').textContent='새 퍼즐! 행운을 빌어요 🎲';render();save()}
function conflict(i){const n=values[i];if(!n)return false;const r=Math.floor(i/9),c=i%9;for(let j=0;j<81;j++)if(j!==i&&values[j]===n&&(Math.floor(j/9)===r||j%9===c||(Math.floor(j/27)===Math.floor(i/27)&&Math.floor((j%9)/3)===Math.floor(c/3))))return true;return false}
function render(){const board=$('board');board.replaceChildren();for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9,btn=document.createElement('button');btn.type='button';btn.className='cell';btn.setAttribute('role','gridcell');btn.setAttribute('aria-label',(r+1)+'행 '+(c+1)+'열 '+(values[i]||'빈 칸'));if(c===2||c===5)btn.classList.add('boxright');if(r===2||r===5)btn.classList.add('boxbottom');if(puzzle[i])btn.classList.add('fixed');if(selected===i)btn.classList.add('selected');else if(selected>=0&&(Math.floor(selected/9)===r||selected%9===c||Math.floor(selected/27)===Math.floor(i/27)&&Math.floor((selected%9)/3)===Math.floor(c/3)))btn.classList.add('peer');if(selected>=0&&values[selected]&&values[i]===values[selected])btn.classList.add('same');if(conflict(i))btn.classList.add('conflict');if(values[i])btn.textContent=values[i];else if(notes[i]?.length){const grid=document.createElement('span');grid.className='notes';for(let n=1;n<=9;n++){const bit=document.createElement('i');bit.textContent=notes[i].includes(n)?n:'';grid.append(bit)}btn.append(grid)}btn.addEventListener('click',()=>{selected=i;render();save()});board.append(btn)}$('notes').textContent=noteMode?'✏️ 메모 켬':'✏️ 메모 끔';$('notes').classList.toggle('active',noteMode);$('difficulty').value=difficulty;updateClock()}
function updateClock(){const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('clock').textContent='⏱ '+m+':'+s}
function snapshot(){history.push({values:values.slice(),notes:clone(notes)});if(history.length>100)history.shift()}
function write(n){if(finished||selected<0){$('status').textContent='먼저 빈 칸을 선택해 주세요.';return}if(puzzle[selected]){$('status').textContent='처음부터 주어진 숫자는 바꿀 수 없어요.';return}snapshot();if(noteMode&&n){const set=new Set(notes[selected]);set.has(n)?set.delete(n):set.add(n);notes[selected]=[...set].sort()}else{values[selected]=n;notes[selected]=[];if(n)for(let i=0;i<81;i++)if(i!==selected&&notes[i]?.includes(n)&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||Math.floor(i/27)===Math.floor(selected/27)&&Math.floor((i%9)/3)===Math.floor((selected%9)/3)))notes[i]=notes[i].filter(x=>x!==n)}if(values.every((v,i)=>v===solution[i])){finished=true;$('status').textContent='🎉 완벽해요! 스도쿠 완료!'}else $('status').textContent='진행 중 · '+values.filter(Boolean).length+'/81칸';render();save()}
function check(){let errors=0,empty=0;for(let i=0;i<81;i++){if(!values[i])empty++;else if(values[i]!==solution[i])errors++}$('status').textContent=errors?('다시 확인할 숫자가 '+errors+'개 있어요.'):(empty?'지금까지 정답! 남은 빈 칸 '+empty+'개':'🎉 정답!');if(!errors&&!empty)finished=true;save()}
$('numbers').replaceChildren();for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.type='button';b.addEventListener('click',()=>write(n));$('numbers').append(b)}
$('erase').onclick=()=>write(0);
$('notes').onclick=()=>{noteMode=!noteMode;render();save()};
$('undo').onclick=()=>{if(!history.length)return;const h=history.pop();values=h.values;notes=h.notes;finished=false;$('status').textContent='실행 취소했어요.';render();save()};
$('hint').onclick=()=>{if(finished)return;const possible=Array.from({length:81},(_,i)=>i).filter(i=>!puzzle[i]&&values[i]!==solution[i]);if(!possible.length)return;const i=(selected>=0&&possible.includes(selected))?selected:possible[0];selected=i;snapshot();values[i]=solution[i];notes[i]=[];$('status').textContent='💡 힌트: 정답 숫자 하나를 채웠어요.';if(values.every((n,j)=>n===solution[j])){finished=true;$('status').textContent='🎉 완료!'}render();save()};
$('check').onclick=check;
$('reset').onclick=()=>{if(!confirm('입력한 숫자를 모두 지우고 이 퍼즐을 처음부터 다시 할까요?'))return;values=puzzle.slice();notes=Array.from({length:81},()=>[]);history=[];seconds=0;finished=false;selected=-1;$('status').textContent='퍼즐을 초기화했어요.';render();save()};
$('new').onclick=()=>{if(values.some((n,i)=>n!==puzzle[i])&&!finished&&!confirm('현재 퍼즐 대신 새 퍼즐을 시작할까요?'))return;newGame()};
document.addEventListener('keydown',e=>{if(e.target.matches('select'))return;if(e.key>='1'&&e.key<='9'){e.preventDefault();write(Number(e.key))}else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){e.preventDefault();write(0)}else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let i=selected<0?0:selected;const r=Math.floor(i/9),c=i%9;i=e.key==='ArrowUp'?((r+8)%9)*9+c:e.key==='ArrowDown'?((r+1)%9)*9+c:e.key==='ArrowLeft'?r*9+(c+8)%9:r*9+(c+1)%9;selected=i;render();save()}});
if(!restore())newGame();else{render();$('status').textContent=finished?'🎉 완료한 퍼즐을 불러왔어요.':'저장된 퍼즐을 이어서 플레이해요.'}
setInterval(()=>{if(!finished){seconds++;updateClock();save()}},1000);
})();
</script></body></html>
