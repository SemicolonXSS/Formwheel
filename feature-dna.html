<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧬 FEATURE DNA | Formwheel</title><style>body{margin:0;background:#151426;color:#f5f1ff;font:16px system-ui}main{max-width:780px;margin:auto;padding:24px 16px}section{padding:20px;border:1px solid #665584;border-radius:18px;background:#242039;margin:16px 0}a{color:#d5bfff}button,input,select{font:inherit;padding:10px;max-width:100%;border-radius:10px;border:1px solid #a991ce;background:#40305c;color:white}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:14px 0}p{line-height:1.6}output{display:block;overflow-wrap:anywhere}li{margin:12px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange}</style></head><body><main><a href="./index.html">← 허브</a><h1>🧬 FEATURE DNA</h1><section><p>규칙을 조합해 독립 커스텀 타일 연습을 만들어 보세요. 기존 Polyrhythm 및 공식 기록에는 영향을 주지 않습니다.</p><div id="rules"></div><output id="code"></output><button id="copy">공유 링크 복사</button> <button id="play">연습 시작</button> <button id="poly">Polyrhythm에서 플레이</button><p id="status" role="status"></p></section><section><h2>타일 연습</h2><p id="score">점수 0</p><button id="tile" disabled>시작 대기</button><p id="hint"></p><button id="stop">종료</button></section></main><script>'use strict';const names=['방향 전환','홀드 타일','하트 타일','자동 가속'],root=document.getElementById('rules'),code=document.getElementById('code'),tile=document.getElementById('tile'),hint=document.getElementById('hint'),status=document.getElementById('status');const incoming=new URLSearchParams(location.search).get('dna');let flags=/^[01]{4}$/.test(incoming||'')?incoming.split('').map(x=>x==='1'):[true,true,true,true],active=false,timer=0,score=0,kind='',down=0,taps=0,round=0;const controls=names.map((n,i)=>{const l=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.checked=flags[i];b.onchange=()=>{flags[i]=b.checked;show()};l.append(b,document.createTextNode(' '+n));root.append(l);return b});function show(){code.textContent='DNA-'+flags.map(Number).join('')}function stop(){active=false;clearTimeout(timer);tile.disabled=true;tile.textContent='종료';controls.forEach(b=>b.disabled=false);down=0}function next(){if(!active)return;clearTimeout(timer);round++;const kinds=['normal',...(flags[0]?['reverse']:[]),...(flags[1]?['hold']:[]),...(flags[2]?['heart']:[])];kind=kinds[Math.floor(Math.random()*kinds.length)];taps=0;down=0;tile.textContent={normal:'탭!',reverse:'방향 전환 ↔ 탭!',hold:'0.6초 누르기',heart:'3번 탭!'}[kind];hint.textContent='타일 '+round;timer=setTimeout(()=>{hint.textContent='시간 초과';stop()},Math.max(1300,flags[3]?3500-round*80:3500))}function award(){score++;document.getElementById('score').textContent='점수 '+score;next()}tile.addEventListener('pointerdown',()=>{if(active&&kind==='hold')down=performance.now()});tile.addEventListener('pointercancel',()=>down=0);tile.addEventListener('keydown',e=>{if(active&&kind==='hold'&&!e.repeat&&(e.key===' '||e.key==='Enter'))down=performance.now()});tile.onclick=()=>{if(!active)return;if(kind==='hold'){if(down&&performance.now()-down>=600)award();else hint.textContent='조금 더 길게 누르세요';down=0}else if(kind==='heart'){if(++taps>=3)award();else hint.textContent=taps+'/3'}else award()};document.getElementById('play').onclick=()=>{stop();active=true;score=0;round=0;document.getElementById('score').textContent='점수 0';controls.forEach(b=>b.disabled=true);tile.disabled=false;next()};document.getElementById('stop').onclick=stop;document.getElementById('copy').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('dna',flags.map(Number).join(''));try{await navigator.clipboard.writeText(u.href);status.textContent='복사 완료'}catch{status.textContent=u.href}};document.getElementById('poly').onclick=()=>{const u=new URL('./polyrhythm.html',location.href);u.searchParams.set('dna',flags.map(Number).join(''));location.href=u.href};show();</script></body></html>
