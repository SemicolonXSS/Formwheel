<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PARTY · Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7ff;color:#242542;font:15px system-ui,-apple-system,sans-serif}header{background:#27215e;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header a{color:white}main{max-width:850px;margin:auto;padding:18px}.card{background:white;border:1px solid #dad9ed;border-radius:17px;padding:18px;margin:13px 0;box-shadow:0 5px 20px #22215908}button,input,select{font:inherit}button{cursor:pointer;padding:10px 13px;border:0;border-radius:10px;background:#493abc;color:white;font-weight:700}button.secondary{background:#eae8fb;color:#29245a}button:disabled{opacity:.45;cursor:not-allowed}input,select{padding:10px;border:1px solid #aaaacb;border-radius:9px;min-width:0;max-width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:#596078;font-size:13px}.pill{display:inline-block;border-radius:30px;background:#eeedfa;padding:5px 9px;margin:3px}.hidden{display:none!important}.step{padding:12px;border:1px solid #e0dff0;border-radius:12px;margin:8px 0}.active{border-color:#493abc;background:#f4f2ff}.big{font-size:24px;font-weight:850;letter-spacing:2px}#notice{min-height:25px;color:#4c3979}a.play{display:inline-block;padding:10px 14px;border-radius:9px;background:#493abc;color:white;text-decoration:none;font-weight:750}small{line-height:1.4}</style></head><body>
<header><strong>🎉 Formwheel PARTY</strong><a href="./">← 허브</a></header><main>
<section class="card"><h1>👥 친구와 이어서 플레이</h1><p class="muted">초대 링크로 같은 파티에 모여 게임 순서를 정해요. 각 게임의 온라인 방은 게임에서 따로 만들거나 참가해야 해요.</p><div class="row"><label>내 닉네임 <input id="name" maxlength="12" placeholder="닉네임" autocomplete="nickname"></label></div><div class="row" style="margin-top:12px"><button id="create">새 파티</button><label>초대 코드 <input id="code" maxlength="6" placeholder="6자리" style="width:120px;text-transform:uppercase"></label><button id="join" class="secondary">참가하기</button></div><p id="notice" role="status" aria-live="polite"></p></section>
<section class="card hidden" id="roomPanel"><div class="row" style="justify-content:space-between"><div><span class="muted">파티 코드</span><div class="big" id="roomCode"></div></div><div class="row"><button id="copy" class="secondary">🔗 초대 링크 복사</button><button id="leave" class="secondary">나가기</button></div></div><h3>👥 파티원 <span id="membersCount"></span></h3><div id="members"></div><p class="muted">파티 정보는 Firebase에서 실시간으로 갱신돼요. 새로고침하면 이 브라우저의 파티 참여 정보를 복원합니다.</p></section>
<section class="card hidden" id="playlistPanel"><h2>🎮 게임 플레이리스트</h2><div id="playlist"></div><div id="hostControls"><div class="row"><select id="gameSelect"><option value="Quiz">🧠 Quiz</option><option value="Battle">⚔️ Battle</option><option value="Spy">🕵️ Spy</option><option value="Risk">🎲 Risk</option><option value="Fate">🎴 Fate</option><option value="Button">🔘 Button</option><option value="Time">⏱️ Time</option><option value="GCrown">👑 GCrown</option><option value="DiceDuel">🎲 Dice Duel</option><option value="Balance">⚖️ Balance</option><option value="Marble">🎱 Marble</option></select><button id="add" class="secondary">+ 게임 추가</button><button id="next">다음 게임 ▶</button><button id="reset" class="secondary">처음부터</button></div><p class="muted">플레이리스트 추가·진행은 호스트만 조작할 수 있어요.</p></div><p id="current" role="status"></p><a id="playLink" class="play" href="./" target="_blank" rel="noopener">현재 게임 열기 ↗</a><p class="muted">버튼을 누르면 해당 게임으로 이동합니다. 파티 진행은 이 페이지에서 관리해요.</p></section>
</main><script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,get,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE',authDomain:'formwheel.firebaseapp.com',databaseURL:'https://formwheel-default-rtdb.firebaseio.com',projectId:'formwheel',appId:'1:431583088241:web:74e0e34ea1e3e1170c55d0'};
const app=getApps().length?getApp():initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id), STORE='formwheel.party.join.v1';
const games={Quiz:'Formwheel_Quiz',Battle:'Formwheel_Battle',Spy:'Formwheel_Spy',Risk:'Formwheel_Risk',Fate:'Formwheel_Fate',Button:'Formwheel_Button',Time:'Formwheel_Time',GCrown:'Formwheel_GCrown',DiceDuel:'Formwheel_DiceDuel',Balance:'Formwheel_Balance',Marble:'Formwheel_Marble'};
let uid='',code='',room=null,unsubscribe=null;
const message=s=>$('notice').textContent=s;
const clean=s=>String(s||'').trim().replace(/\s+/g,' ').slice(0,12);
const PARTY_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const generate=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>PARTY_ALPHABET[n%PARTY_ALPHABET.length]).join('');
const roomRef=c=>ref(db,'formwheelParty/v1/rooms/'+c);
const nick=()=>clean($('name').value);
const mine=()=>room?.members?.[uid];
const host=()=>room?.host===uid;
function showRoom(){const active=!!room&&!!mine();$('roomPanel').classList.toggle('hidden',!active);$('playlistPanel').classList.toggle('hidden',!active);if(!active)return;$('roomCode').textContent=code;const members=Object.values(room.members||{});$('membersCount').textContent=members.length+'명';$('members').replaceChildren(...members.map(m=>{const p=document.createElement('span');p.className='pill';p.textContent=(m.uid===room.host?'👑 ':'')+m.name;return p}));$('hostControls').classList.toggle('hidden',!host());const tracks=Array.isArray(room.games)?room.games:[];$('playlist').replaceChildren(...tracks.map((g,i)=>{const p=document.createElement('div');p.className='step'+(i===room.position?' active':'');p.textContent=(i===room.position?'▶ ':'')+(i+1)+'. '+g;return p}));const current=tracks[room.position]||null;$('current').textContent=current?'현재 게임: '+current:'호스트가 게임을 추가하면 여기 표시돼요.';$('playLink').classList.toggle('hidden',!current);if(current)$('playLink').href='https://semicolonxss.github.io/'+games[current]+'/';$('next').disabled=!tracks.length||room.position>=tracks.length-1;$('reset').disabled=!tracks.length||room.position===0;}
function watch(c){if(unsubscribe)unsubscribe();code=c;unsubscribe=onValue(roomRef(c),s=>{room=s.val();if(!room?.members?.[uid]){room=null;message('파티가 없거나 참가 상태가 해제됐어요.');try{sessionStorage.removeItem(STORE)}catch{};history.replaceState({},'',location.pathname)}else{message('파티 연결됨 · '+code);history.replaceState({},'','?party='+encodeURIComponent(code))}showRoom()},e=>message('실시간 연결 실패: '+(e.code||e.message)));}
async function transact(fn){if(!code||!uid)return false;const r=await runTransaction(roomRef(code),fn,{applyLocally:false});return r.committed;}
function setLocal(c){try{sessionStorage.setItem(STORE,c)}catch{}}
async function create(){const name=nick();if(!name)return message('닉네임을 입력해 주세요.');$('create').disabled=true;try{for(let i=0;i<8;i++){const c=generate(),rr=roomRef(c);const outcome=await runTransaction(rr,existing=>existing===null?{version:1,host:uid,createdAt:Date.now(),position:0,games:['Quiz','Spy','Button'],members:{[uid]:{uid,name}}}:undefined,{applyLocally:false});if(outcome.committed){setLocal(c);watch(c);return}}message('사용 가능한 방 코드를 만들지 못했어요. 다시 시도해 주세요.')}catch(e){message('방 생성 실패: '+(e.code||e.message)+'. Firebase 규칙을 확인해 주세요.')}finally{$('create').disabled=false}}
async function join(c){const name=nick();if(!name)return message('닉네임을 입력해 주세요.');if(!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(c))return message('6자리 초대 코드를 확인해 주세요.');try{const snapshot=await get(roomRef(c));if(!snapshot.exists())return message('파티를 찾을 수 없어요.');const result=await runTransaction(roomRef(c),d=>{if(!d||!d.host||!d.members||(!d.members[uid]&&Object.keys(d.members).length>=12))return;d.members[uid]={uid,name};return d},{applyLocally:false});if(!result.committed)return message('파티가 가득 찼거나 참가할 수 없어요.');setLocal(c);watch(c)}catch(e){message('참가 실패: '+(e.code||e.message)+'. Firebase 권한을 확인해 주세요.')}}
async function update(fn){if(!host())return message('호스트만 변경할 수 있어요.');try{const ok=await transact(d=>{if(!d||d.host!==uid)return;return fn(d)});if(!ok)message('파티 갱신 실패. 다시 시도해 주세요.')}catch(e){message('변경 실패: '+(e.code||e.message))}}
$('create').onclick=create;$('join').onclick=()=>join($('code').value.toUpperCase().trim());
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);message('초대 링크 복사 완료!')}catch{message('복사할 수 없어요. 주소창의 링크를 복사해 주세요.')}};
$('leave').onclick=async()=>{try{await transact(d=>{if(!d?.members?.[uid])return;delete d.members[uid];if(d.host===uid)d.host=Object.keys(d.members)[0]||'';return Object.keys(d.members).length?d:null})}catch(e){message('나가기 오류: '+(e.code||e.message));return}if(unsubscribe)unsubscribe();unsubscribe=null;code='';room=null;try{sessionStorage.removeItem(STORE)}catch{}history.replaceState({},'',location.pathname);showRoom();message('파티에서 나왔어요.')};
$('add').onclick=()=>update(d=>{const arr=Array.isArray(d.games)?d.games:[];if(arr.length>=20){message('게임은 최대 20개까지 추가할 수 있어요.');return}d.games=[...arr,$('gameSelect').value];return d});
$('next').onclick=()=>update(d=>{d.position=Math.min((d.games||[]).length-1,(d.position||0)+1);return d});
$('reset').onclick=()=>update(d=>{d.position=0;return d});
onAuthStateChanged(auth,async user=>{if(!user){try{await signInAnonymously(auth)}catch(e){message('로그인이 필요해요: '+(e.code||e.message))}return}uid=user.uid;try{const saved=JSON.parse(localStorage.getItem('formwheel.party.nickname.v1')||'null');if(saved)$('name').value=clean(saved)}catch{};const target=new URLSearchParams(location.search).get('party')||(()=>{try{return sessionStorage.getItem(STORE)}catch{return null}})();if(target&&/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(target)){const snap=await get(roomRef(target)).catch(()=>null);if(snap?.val()?.members?.[uid]){watch(target);return}$('code').value=target;message('초대 링크가 열렸어요. 닉네임을 입력하고 참가하기를 눌러 주세요.')}});
$('name').addEventListener('change',()=>{try{localStorage.setItem('formwheel.party.nickname.v1',JSON.stringify(nick()))}catch{}});
</script></body></html>
