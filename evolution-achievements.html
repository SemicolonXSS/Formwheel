<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVOLUTION 01 · 숨겨진 업적</title><style>body{font-family:system-ui;background:#f5f2ff;color:#292443;margin:0}main{max-width:720px;margin:25px auto;padding:20px}a{color:#6247bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:white;border:1px solid #e8dfff;border-radius:18px;padding:20px}.icon{font-size:35px}small{color:#706987}button{background:#634ac3;color:white;border:0;border-radius:10px;padding:10px;cursor:pointer}</style><main><a href="./">← Hub</a><h1>🏆 AQS 숨겨진 업적 · 미리보기</h1><p>업적을 발견하면 어떤 모습으로 공개될지 살펴보세요.</p><p><a href="../Formwheel_AQS/">기존 AQS 열기 →</a></p><div class="grid" id="grid"></div><p><small>현재는 화면 시제품입니다. 실제 업적 해금, XP 지급, Firebase 저장과 연동하지 않습니다. 아래 버튼은 미리보기만 변경합니다.</small></p><script>const defs=[['🧭','첫 탐험','서로 다른 지역을 방문'],['🔍','숨은 관찰자','프로젝트의 숨겨진 요소 발견'],['🗺️','세계 여행자','다양한 프로젝트 탐험'],['🛠️','도구 수집가','여러 도구 사용'],['🎯','도전의 시작','오늘의 도전 참여'],['🌌','미지의 문','비밀 지역 조사']];const grid=document.getElementById('grid');defs.forEach(([icon,name,desc])=>{const card=document.createElement('article');card.className='card';const symbol=document.createElement('div');symbol.className='icon';const title=document.createElement('h2');const info=document.createElement('p');const button=document.createElement('button');let revealed=false;function render(){symbol.textContent=revealed?icon:'🔒';title.textContent=revealed?name:'???';info.textContent=revealed?desc:'발견 전까지 비밀입니다.';button.textContent=revealed?'다시 숨기기':'해금 연출 보기'}button.addEventListener('click',()=>{revealed=!revealed;render()});render();card.append(symbol,title,info,button);grid.append(card)});</script></main></html>
