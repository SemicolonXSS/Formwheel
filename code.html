<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Code</title><link rel="icon" href="favicon.ico"><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1020;color:#e9edff}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:#171d32;border-bottom:1px solid #38405d}h1{font-size:19px;margin:0}a{color:#a8baff}button,select{border:1px solid #495474;border-radius:9px;background:#252e4b;color:white;padding:9px 12px;font:inherit;cursor:pointer}button:hover{background:#36466d}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 66px)}aside{padding:16px;background:#12192d;border-right:1px solid #38405d}aside h2{font-size:16px}aside button{width:100%;margin:4px 0;text-align:left}.main{min-width:0;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.editor{width:100%;min-height:340px;resize:vertical;background:#0a0e1c;color:#dce6ff;border:1px solid #485270;border-radius:12px;padding:16px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}#output{background:#090e1a;border:1px solid #455070;border-radius:12px;padding:12px;min-height:130px;white-space:pre-wrap;overflow:auto;font:13px/1.6 monospace}iframe{width:100%;height:270px;background:white;border:1px solid #485270;border-radius:12px}small,.muted{color:#abb6d2}#lesson{line-height:1.6}#status{min-height:22px;color:#a9e8c3}@media(max-width:700px){.shell{display:block}aside{border-right:0;border-bottom:1px solid #38405d}.editor{min-height:260px}header{padding:12px}}
</style></head><body><header><h1>⌨️ Formwheel Code</h1><span class="muted">IDE + 코딩 문제 풀이</span><a href="./">← Formwheel</a></header><div class="shell"><aside><h2>📚 문제 은행</h2><div id="problems"></div><p class="muted">정답 검사는 예제 테스트 기반입니다. 숨겨진 채점 서버는 아직 없습니다.</p><h2>💾 내 작업</h2><button id="reset">새 코드로 초기화</button><button id="download">파일 내려받기</button><p class="muted">코드는 이 기기의 브라우저에 자동 저장됩니다.</p></aside><main class="main"><div class="toolbar"><label for="language">언어</label><select id="language"><option value="html">HTML + CSS + JavaScript</option><option value="python">Python</option><option value="c">C</option><option value="cpp">C++</option><option value="java">Java</option></select><button id="run">▶ 실행</button><button id="check">✓ 예제 검사</button></div><section id="lesson"><strong id="problemTitle">자유 코딩</strong><p id="problemDesc">코드를 작성하고 실행해 보세요.</p></section><textarea class="editor" id="editor" spellcheck="false" aria-label="코드 편집기"></textarea><p id="status" role="status"></p><h2>실행 결과</h2><pre id="output" aria-live="polite"></pre><iframe id="preview" title="웹 미리보기" sandbox="allow-scripts" hidden></iframe><small>Python은 최초 실행 시 Pyodide를 내려받아야 하므로 인터넷 연결이 필요합니다. C/C++/Java는 편집 및 파일 저장을 지원하며 실행 서버는 아직 연결되지 않았습니다.</small></main></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),editor=$('editor'),language=$('language'),output=$('output'),preview=$('preview'),status=$('status');
const starters={
html:'<!doctype html>\n<html lang="ko">\n<head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:24px;color:#333}</style></head>\n<body><h1>Hello, Formwheel!</h1><button onclick="alert(\'안녕!\')">클릭</button></body>\n</html>',
python:'print("Hello, Formwheel!")',
c:'#include <stdio.h>\nint main(void) {\n    printf("Hello, Formwheel!\\n");\n    return 0;\n}',
cpp:'#include <iostream>\nint main() {\n    std::cout << "Hello, Formwheel!\\n";\n    return 0;\n}',
java:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, Formwheel!");\n    }\n}'};
const problems=[
{title:'001 · Hello, Formwheel!',desc:'Hello, Formwheel!을 한 줄 출력하세요.',langs:['python','c','cpp','java'],expected:'Hello, Formwheel!'},
{title:'002 · 두 수의 합',desc:'3과 5를 더한 결과 8을 출력하세요.',langs:['python','c','cpp','java'],expected:'8'},
{title:'003 · 웹 제목',desc:'HTML 문서에 Formwheel Code라는 제목(h1)을 만들어 보세요.',langs:['html'],expected:'Formwheel Code'}
];let current=-1,pyodide=null,loading=null;
const key=lang=>'fw-code-v1-'+lang;
function save(){try{localStorage.setItem(key(language.value),editor.value)}catch{}}
function load(){editor.value=localStorage.getItem(key(language.value))??starters[language.value];preview.hidden=true;output.textContent='';status.textContent='';}
language.addEventListener('change',()=>{current=-1;renderProblem();load()});editor.addEventListener('input',save);
editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();let a=editor.selectionStart,b=editor.selectionEnd;editor.setRangeText('  ',a,b,'end');save()}});
function renderProblem(){const p=problems[current];$('problemTitle').textContent=p?p.title:'자유 코딩';$('problemDesc').textContent=p?p.desc:'원하는 코드를 작성하고 실행해 보세요.'}
function renderList(){$('problems').replaceChildren();problems.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.title;b.onclick=()=>{current=i;const lang=language.value;if(!p.langs.includes(lang)){language.value=p.langs[0];load()}renderProblem();status.textContent='문제를 선택했어요. 코드를 작성한 뒤 예제 검사를 눌러 보세요.'};$('problems').append(b)})}
function runHtml(){preview.hidden=false;output.textContent='미리보기에서 웹 페이지를 확인하세요.';preview.srcdoc=editor.value;return editor.value}
async function runPython(){if(!window.loadPyodide){status.textContent='Python 실행 환경을 불러오는 중…';await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';s.onload=resolve;s.onerror=()=>reject(Error('Python 실행 환경 다운로드 실패'));document.head.append(s)})}if(!pyodide){loading??=window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});pyodide=await loading}let lines=[];pyodide.setStdout({batched:s=>lines.push(s)});pyodide.setStderr({batched:s=>lines.push(s)});try{await pyodide.runPythonAsync(editor.value)}finally{output.textContent=lines.join('\n')}return lines.join('\n')}
async function run(){save();status.textContent='';preview.hidden=true;output.textContent='';if(language.value==='html')return runHtml();if(language.value==='python')return await runPython();throw Error('이 언어의 실행 서버는 아직 연결되지 않았습니다. 코드를 편집하고 파일로 저장할 수 있습니다.')}
$('run').onclick=async()=>{try{await run();status.textContent='실행 완료'}catch(e){status.textContent='실행 실패';output.textContent=String(e)}};
$('check').onclick=async()=>{const p=problems[current];if(!p){status.textContent='먼저 문제를 선택하세요.';return}if(!p.langs.includes(language.value)){status.textContent='이 문제에서 지원하는 언어를 선택하세요.';return}try{const result=await run();const pass=language.value==='html'?new DOMParser().parseFromString(result,'text/html').querySelector('h1')?.textContent.trim()===p.expected:result.trim()===p.expected;status.textContent=pass?'✅ 예제 통과! (공식 전체 채점 아님)':'❌ 예제 불일치';}catch(e){status.textContent='검사 실패';output.textContent=String(e)}};
$('reset').onclick=()=>{if(!confirm('현재 언어의 저장된 코드를 초기화할까요?'))return;localStorage.removeItem(key(language.value));load()};
$('download').onclick=()=>{save();const ext={html:'html',python:'py',c:'c',cpp:'cpp',java:'java'}[language.value];const blob=new Blob([editor.value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=language.value==='java'?'Main.java':'formwheel-code.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();renderProblem();load();
})();
</script></body></html>
