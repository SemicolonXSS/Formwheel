const fwGuide=document.createElement('details');fwGuide.innerHTML='<summary>📘 FW 0.6 문법 안내</summary><p><code>import &lt;basic&gt;</code> · <code>main() int</code> 또는 <code>int main()</code> · <code>[문자열], 변수, \\n;</code> · <code>ask(age);</code> · <code>end 0;</code> (main에서는 생략 가능)</p><p>변수와 if/else, 함수는 C 스타일이며 반복은 <code>while (int i = 1, &lt;= 5, i++)</code> 형식입니다. 현재 실행기는 출력·변수·조건·반복·입력의 기본형을 지원합니다. 모든 출력문은 세미콜론(;)으로 끝나야 합니다. main 함수 끝의 end 0;은 선택 사항입니다.</p>';$('lesson').before(fwGuide);fwGuide.hidden=true;

function save(){try{localStorage.setItem(current<0?key(language.value):problemKey(language.value,current),editor.value)}catch{}}
function load(){let saved=null;try{saved=localStorage.getItem(current<0?key(language.value):problemKey(language.value,current))}catch{}editor.value=saved??(current<0?starters[language.value]:blankTemplate(language.value));preview.hidden=true;output.textContent='';status.textContent='';fwGuide.hidden=language.value!=='fw';}
language.addEventListener('change',()=>{current=-1;renderProblem();load();renderList()});editor.addEventListener('input',save);
editor.addEventListener('keydown',e=>{
if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
const a=editor.selectionStart,b=editor.selectionEnd,value=editor.value,selected=value.slice(a,b);
const pairs={'[':']','(':')','{':'}','"':'"',"'":"'",'`':'`'};
const closers=new Set(Object.values(pairs));
const insert=(text,start,end=start)=>{editor.setRangeText(text,a,b,'end');editor.setSelectionRange(start,end);save()};
if(e.key==='Tab'){e.preventDefault();insert('  ',a+2);return}
if(e.key==='Enter'){e.preventDefault();const lineStart=value.lastIndexOf('\n',a-1)+1;const indent=(value.slice(lineStart,a).match(/^[ \t]*/)||[''])[0];const before=value[a-1],after=value[b];const extra=before==='{'&&after==='}'?'  ':'';if(extra){insert('\n'+indent+extra+'\n'+indent,a+1+indent.length+extra.length);return}insert('\n'+indent,a+1+indent.length);return}

if(a===b&&closers.has(e.key)&&value[a]===e.key){e.preventDefault();editor.setSelectionRange(a+1,a+1);return}
if(e.key==='Backspace'&&a===b&&a>0&&pairs[value[a-1]]===value[a]){e.preventDefault();editor.setRangeText('',a-1,a+1,'start');save()}

function renderList(){const root=$('problems');root.replaceChildren();const done=solvedSet(),query=$('problemSearch').value.trim().toLocaleLowerCase(),onlyUnsolved=$('unsolvedOnly').checked;
const progress=document.createElement('p');progress.className='muted';progress.textContent='학습 진도 '+done.size+' / '+problems.length+'문제';root.append(progress);

const details=document.createElement('details');details.open=!!query||onlyUnsolved||unit.ids.includes(current)||current<0;const summary=document.createElement('summary');summary.textContent=unit.name+' ('+unit.ids.filter(i=>done.has(i)).length+'/'+unit.ids.length+')';summary.style.cssText='cursor:pointer;padding:10px 0;font-weight:700';details.append(summary);

function runHtml(){preview.hidden=false;output.textContent='미리보기에서 웹 페이지를 확인하세요.';preview.srcdoc=editor.value;return editor.value}
async function runPython(){const source=editor.value,runIndex=current,runLanguage=language.value;const isCurrent=()=>current===runIndex&&language.value===runLanguage&&editor.value===source;if(!window.loadPyodide){if(isCurrent())status.textContent='Python 실행 환경을 불러오는 중…';scriptLoading??=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';s.onload=resolve;s.onerror=()=>{s.remove();reject(Error('Python 실행 환경 다운로드 실패'))};document.head.append(s)}).catch(error=>{scriptLoading=null;throw error});await scriptLoading}if(!pyodide){loading??=window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'}).catch(error=>{loading=null;throw error});pyodide=await loading}let lines=[];pyodide.setStdout({batched:s=>lines.push(s)});pyodide.setStderr({batched:s=>lines.push(s)});try{await pyodide.runPythonAsync(source)}finally{if(isCurrent())output.textContent=lines.join('\n')}return lines.join('\n')}

function runFw(){
 const src=editor.value.replace(/(\[[^\]\n]*\])|\/\/[^\n]*/g,(match,output)=>output??'').replace(/^\s*import\s*<basic>\s*$/gm,'');
 const vars=Object.create(null);let printed='',steps=0;
 function expr(raw){const tokens=(raw.trim().match(/(?:\d+(?:\.\d+)?)|(?:[A-Za-z_]\w*)|(?:===|!==|==|!=|<=|>=|&&|\|\||[+*\/%()!<>-])/g)||[]);if(tokens.join('')!==raw.replace(/\s+/g,''))throw Error('지원하지 않는 표현식: '+raw);let i=0;
 function primary(){let t=tokens[i++];if(t==='('){let v=logic();if(tokens[i++]!==')')throw Error('괄호 오류');return v}if(t==='-')return -Number(primary());if(t==='!')return !primary();if(/^\d/.test(t||''))return Number(t);if(t in vars)return vars[t];throw Error('정의되지 않은 변수: '+t)}
 function mult(){let v=primary();while(['*','/','%'].includes(tokens[i])){let op=tokens[i++],b=primary();v=op==='*'?v*b:op==='/'?v/b:v%b}return v}
 function add(){let v=mult();while(['+','-'].includes(tokens[i])){let op=tokens[i++],b=mult();v=op==='+'?v+b:v-b}return v}
 function compare(){let v=add();while(['<','>','<=','>=','==','!=','===','!=='].includes(tokens[i])){let op=tokens[i++],b=add();v=op==='<'?v<b:op==='>'?v>b:op==='<='?v<=b:op==='>='?v>=b:op==='=='||op==='==='?v===b:v!==b}return v}
 function logic(){let v=compare();while(['&&','||'].includes(tokens[i])){let op=tokens[i++],b=compare();v=op==='&&'?Boolean(v&&b):Boolean(v||b)}return v}
 let v=logic();if(i!==tokens.length)throw Error('표현식 오류: '+raw);return v}
 const body=src.match(/(?:main\s*\(\s*\)\s*int|int\s+main\s*\(\s*\))\s*\{([\s\S]*)\}\s*$/);if(!body)throw Error('main() int 또는 int main() 형식이 필요합니다.');
 const lines=body[1].split('\n').map(x=>x.trim()).filter(Boolean);
 function block(start,end){let pc=start;while(pc<end){if(++steps>20000)throw Error('반복 실행 제한(20,000단계)을 초과했습니다.');let line=lines[pc];if(line==='}'||line==='{'||/^else\b/.test(line)){pc++;continue}
 let m=line.match(/^while\s*\(\s*int\s+(\w+)\s*=\s*(.+?)\s*,\s*(<=|>=|<|>|==|!=)\s*(.+?)\s*,\s*(\w+)\+\+\s*\)\s*\{$/);
 if(m){let depth=1,j=pc+1;for(;j<end&&depth;j++){if(lines[j].endsWith('{'))depth++;if(lines[j]==='}')depth--}if(depth)throw Error('반복문 중괄호 오류');vars[m[1]]=expr(m[2]);if(m[5]!==m[1])throw Error('반복 변수 불일치');while(expr(m[1]+m[3]+m[4])){block(pc+1,j-1);vars[m[1]]++;if(++steps>20000)throw Error('반복 실행 제한 초과')}pc=j;continue}
 m=line.match(/^if\s*\((.+)\)\s*\{$/);if(m){let branches=[],j=pc,depth=0,begin=pc+1,condition=m[1];for(;j<end;j++){let t=lines[j];if(j===pc){depth=1;continue}if(t.endsWith('{'))depth++;if(t==='}'||t.startsWith('} else'))depth--;if(depth===0){branches.push({condition,start:begin,end:j});if(/^}\s*else\s+if\s*\((.+)\)\s*\{$/.test(t)){condition=t.match(/^}\s*else\s+if\s*\((.+)\)\s*\{$/)[1];begin=j+1;depth=1;continue}if(/^}\s*else\s*\{$/.test(t)){condition=null;begin=j+1;depth=1;continue}break}}if(depth)throw Error('조건문 중괄호 오류');for(let b of branches){if(b.condition===null||expr(b.condition)){block(b.start,b.end);break}}pc=j+1;continue}
 if(/^end\s+\d+\s*;$/.test(line))return;
 m=line.match(/^(?:int\s+)?([A-Za-z_]\w*)\s*=\s*(.+);$/);if(m){vars[m[1]]=expr(m[2]);pc++;continue}
 m=line.match(/^int\s+([A-Za-z_]\w*)\s*;$/);if(m){vars[m[1]]=0;pc++;continue}
 m=line.match(/^ask\((\w+)\);$/);if(m){if(!(m[1] in vars))throw Error('선언되지 않은 입력 변수');let value=prompt(m[1]+' 값을 입력하세요');if(value===null)throw Error('입력이 취소되었습니다.');if(!/^-?\d+$/.test(value.trim()))throw Error('정수를 입력하세요.');vars[m[1]]=Number(value);pc++;continue}
 if(line.startsWith('[')){if(!line.endsWith(';'))throw Error('FW 문법 오류 ('+(pc+1)+'행): 출력문 끝에 세미콜론(;)이 필요합니다.');let parts=line.match(/^\[([^\]]*)\](.*)$/);if(!parts)throw Error('출력 문법 오류');printed+=parts[1];let tail=parts[2].replace(/;\s*$/,'').trim();if(tail){for(let part of tail.split(',').map(x=>x.trim()).filter(Boolean)){if(part==='\\n')printed+='\n';else printed+=String(expr(part))}}pc++;continue}
 if(line==='\\n;'){printed+='\n';pc++;continue}
 throw Error('지원하지 않는 FW 문장 ('+(pc+1)+'행): '+line);
 }}
 block(0,lines.length);output.textContent=printed;return printed;
}

async function run(){save();status.textContent='';preview.hidden=true;output.textContent='';if(language.value==='html')return runHtml();if(language.value==='python')return await runPython();if(language.value==='fw')return runFw();throw Error('이 언어의 실행 서버는 아직 연결되지 않았습니다. 코드를 편집하고 파일로 저장할 수 있습니다.')}
$('run').onclick=async()=>{const runIndex=current,runLanguage=language.value,runCode=editor.value;try{await run();if(current===runIndex&&language.value===runLanguage&&editor.value===runCode)status.textContent='실행 완료'}catch(e){if(current===runIndex&&language.value===runLanguage&&editor.value===runCode){status.textContent='실행 실패';output.textContent=String(e)}}};
$('check').onclick=async()=>{const p=problems[current];if(!p){status.textContent='먼저 문제를 선택하세요.';return}if(!p.langs.includes(language.value)){status.textContent='이 문제에서 지원하는 언어를 선택하세요.';return}const checkedIndex=current,checkedLanguage=language.value,checkedCode=editor.value;try{const result=await run();if(current!==checkedIndex||language.value!==checkedLanguage||editor.value!==checkedCode)return;const pass=checkedLanguage==='html'?new DOMParser().parseFromString(result,'text/html').querySelector('h1')?.textContent.trim()===p.expected:result.trim()===p.expected;const saved=pass?markSolved(checkedIndex):false;status.textContent=pass?(saved?'✅ 예제 통과! 학습 진도에 저장했어요. (공식 전체 채점 아님)':'✅ 예제 통과! 브라우저 저장소 오류로 학습 진도는 저장하지 못했어요.'):'❌ 예제 불일치';}catch(e){if(current===checkedIndex&&language.value===checkedLanguage&&editor.value===checkedCode){status.textContent='검사 실패';output.textContent=String(e)}}};
$('reset').onclick=()=>{if(!confirm('현재 언어의 저장된 코드를 초기화할까요?'))return;try{localStorage.removeItem(current<0?key(language.value):problemKey(language.value,current))}catch{status.textContent='브라우저 저장소에 접근할 수 없어 초기화하지 못했습니다.';return}load()};
$('download').onclick=()=>{save();const ext={html:'html',python:'py',c:'c',cpp:'cpp',java:'java',fw:'fw'}[language.value];const blob=new Blob([editor.value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=language.value==='java'?'Main.java':'formwheel-code.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();renderProblem();load();
})();
</script></body></html>
