<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Atom | 원소 주기율표</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0ff;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{padding:24px max(16px,calc((100vw - 1440px)/2));background:#121a31;border-bottom:1px solid #28334e}h1{margin:0;font-size:27px}p{color:#aab8d4}main{max-width:1440px;margin:auto;padding:18px}button,input,select{font:inherit}button{cursor:pointer;color:inherit}input,select{background:#18243c;border:1px solid #3a4c70;border-radius:10px;color:white;padding:11px}input{min-width:200px;flex:1}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.tools button,.pill{background:#243453;border:1px solid #41577d;border-radius:10px;padding:10px 13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.panel{background:#121b30;border:1px solid #293854;border-radius:16px;padding:16px;min-width:0}.scroll{overflow:auto}.table{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-template-rows:repeat(7,62px) 16px repeat(2,62px);gap:4px;min-width:880px}.element{border:1px solid #ffffff30;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#29364d;padding:2px}.element:hover,.element:focus{outline:2px solid white}.element.selected{outline:3px solid #ffb454}.element.dim{opacity:.2}.element small{font-size:10px}.element strong{font-size:19px}.element span{font-size:9px;white-space:nowrap;overflow:hidden;max-width:100%}.nonmetal{background:#225a52}.noble-gas{background:#4a3e83}.alkali-metal{background:#744039}.alkaline-earth-metal{background:#785c32}.metalloid{background:#36617c}.halogen{background:#426c40}.transition-metal{background:#405a86}.post-transition-metal{background:#50606c}.lanthanide{background:#755278}.actinide{background:#784d65}.unknown{background:#484d5d}.details h2{font-size:27px;margin:4px 0}.details .symbol{font-size:70px;font-weight:800;color:#9ccaff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#1c2942;border-radius:10px;padding:10px;overflow-wrap:anywhere}.stat label{display:block;color:#a8b8d3;font-size:12px;margin-bottom:4px}.stat b{font-size:14px}.compare{margin-top:18px}.compare table{border-collapse:collapse;width:100%;min-width:500px}.compare th,.compare td{padding:10px;border-bottom:1px solid #34415c;text-align:left}.note{font-size:12px}.status{color:#b5c8ec}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.legend span{font-size:12px;background:#25314b;border-radius:8px;padding:6px 8px}a{color:#a8caff}@media(max-width:960px){.layout{grid-template-columns:1fr}.details{order:-1}}@media(max-width:600px){header{padding:16px}main{padding:10px}.panel{padding:10px}}
</style></head><body>
<header><h1>⚛️ Formwheel Atom</h1><p>118개 원소 · 주기율표 · 발견 역사 · 원소 비교</p></header><main>
<div class="tools"><input id="search" placeholder="원소 이름 · 기호 · 원자번호 검색" aria-label="원소 검색"><select id="filter" aria-label="원소 분류"><option value="">모든 분류</option></select><button id="clear">초기화</button><button id="favorites">☆ 즐겨찾기만</button></div>
<div class="layout"><section class="panel"><h2>원소 주기율표</h2><p class="note">원소를 누르면 상세 정보를 볼 수 있어요. 비교는 최대 4개까지 가능합니다.</p><div class="scroll"><div class="table" id="table"></div></div><div class="legend" id="legend"></div><p class="status" id="status">원소 데이터를 불러오는 중…</p></section>
<aside class="panel details" id="details"><h2>원소를 선택하세요</h2></aside></div>
<section class="panel compare"><h2>⚖️ 원소 비교 <span id="count">(0/4)</span></h2><div id="comparison"><p>원소 상세 화면에서 비교 목록에 추가하세요.</p></div><button class="pill" id="clearCompare">비교 초기화</button></section>
<p class="note">원소 데이터: Bowserinator Periodic-Table-JSON (공개 데이터). 일부 발견 연도와 최초 발견자 정보는 역사적 논쟁이 있거나 알려져 있지 않습니다. 자료가 없는 항목은 추측하지 않습니다.</p>
</main><script>
'use strict';
const symbols='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
const korean='수소 헬륨 리튬 베릴륨 붕소 탄소 질소 산소 플루오린 네온 나트륨 마그네슘 알루미늄 규소 인 황 염소 아르곤 칼륨 칼슘 스칸듐 타이타늄 바나듐 크로뮴 망가니즈 철 코발트 니켈 구리 아연 갈륨 저마늄 비소 셀레늄 브로민 크립톤 루비듐 스트론튬 이트륨 지르코늄 나이오븀 몰리브데넘 테크네튬 루테늄 로듐 팔라듐 은 카드뮴 인듐 주석 안티모니 텔루륨 아이오딘 제논 세슘 바륨 란타넘 세륨 프라세오디뮴 네오디뮴 프로메튬 사마륨 유로퓸 가돌리늄 터븀 디스프로슘 홀뮴 어븀 툴륨 이터븀 루테튬 하프늄 탄탈럼 텅스텐 레늄 오스뮴 이리듐 백금 금 수은 탈륨 납 비스무트 폴로늄 아스타틴 라돈 프랑슘 라듐 악티늄 토륨 프로트악티늄 우라늄 넵투늄 플루토늄 아메리슘 퀴륨 버클륨 캘리포늄 아인슈타이늄 페르뮴 멘델레븀 노벨륨 로렌슘 러더포듐 더브늄 시보귬 보륨 하슘 마이트너륨 다름슈타튬 뢴트게늄 코페르니슘 니호늄 플레로븀 모스코븀 리버모륨 테네신 오가네손'.split(' ');
const labels={'nonmetal':'비금속','noble gas':'비활성 기체','alkali metal':'알칼리 금속','alkaline earth metal':'알칼리 토금속','metalloid':'준금속','halogen':'할로젠','transition metal':'전이 금속','post-transition metal':'전이후 금속','lanthanide':'란타넘족','actinide':'악티늄족','unknown':'미분류'};
const groups=[1,18,1,2,13,14,15,16,17,18,1,2,13,14,15,16,17,18];
const $=id=>document.getElementById(id);
let elements=symbols.map((symbol,i)=>({number:i+1,symbol,name:symbol,korean:korean[i],category:'unknown'})), selected=1, compare=[],favOnly=false;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('fw-atom-favorites')||'[]');if(!Array.isArray(favorites))favorites=[]}catch{}
const fmt=(v,suffix='')=>v===undefined||v===null||v===''?'자료 없음':String(v)+suffix;
const category=e=>labels[e.category]||e.category||'미분류';
function position(n){if(n<=2)return [1,n===1?1:18];if(n<=10)return [2,groups[n-1]];if(n<=18)return [3,groups[n-1-8+10]];if(n<=36)return [4,n-18];if(n<=54)return [5,n-36];if(n<=56)return [6,n-54];if(n>=57&&n<=71)return [9,n-56+2];if(n<=86)return [6,n-71+3];if(n<=88)return [7,n-86];if(n<=103)return [10,n-88+2];return [7,n-103+3]}
function correctPosition(n){if(n<=2)return [1,n===1?1:18];if(n<=10)return [2,[1,2,13,14,15,16,17,18][n-3]];if(n<=18)return [3,[1,2,13,14,15,16,17,18][n-11]];if(n<=36)return [4,n-18];if(n<=54)return [5,n-36];if(n<=56)return [6,n-54];if(n<=71)return [9,n-57+3];if(n<=86)return [6,n-71+3];if(n<=88)return [7,n-86];if(n<=103)return [10,n-89+3];return [7,n-103+3]}
function render(){const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;const root=$('table');root.replaceChildren();elements.forEach(e=>{const [r,c]=correctPosition(e.number),b=document.createElement('button');b.className='element '+(e.category||'unknown').replaceAll(' ','-')+(selected===e.number?' selected':'');b.style.gridRow=r;b.style.gridColumn=c;b.title=e.korean+' ('+e.symbol+')';const match=(!q||[e.symbol,e.name,e.korean,String(e.number)].some(x=>String(x).toLowerCase().includes(q)))&&(!filter||e.category===filter)&&(!favOnly||favorites.includes(e.number));if(!match)b.classList.add('dim');b.innerHTML='<small>'+e.number+'</small><strong>'+e.symbol+'</strong><span>'+e.korean+'</span>';b.onclick=()=>{selected=e.number;render();renderDetails()};root.append(b)});$('status').textContent=elements.filter(e=>(!q||[e.symbol,e.name,e.korean,String(e.number)].some(x=>String(x).toLowerCase().includes(q)))&&(!filter||e.category===filter)&&(!favOnly||favorites.includes(e.number))).length+'개 원소 표시 · 전체 118개';}
function renderDetails(){const e=elements[selected-1],d=$('details');d.replaceChildren();const heading=document.createElement('div');heading.innerHTML='<div class="symbol">'+e.symbol+'</div><h2>'+e.korean+' · '+e.name+'</h2><p>원자번호 '+e.number+' · '+category(e)+'</p>';d.append(heading);const controls=document.createElement('div');controls.className='tools';const fav=document.createElement('button');fav.className='pill';fav.textContent=favorites.includes(e.number)?'★ 즐겨찾기 해제':'☆ 즐겨찾기';fav.onclick=()=>{favorites=favorites.includes(e.number)?favorites.filter(x=>x!==e.number):[...favorites,e.number];try{localStorage.setItem('fw-atom-favorites',JSON.stringify(favorites))}catch{}renderDetails();render()};const cmp=document.createElement('button');cmp.className='pill';cmp.textContent=compare.includes(e.number)?'✓ 비교에서 제거':'+ 비교 추가';cmp.onclick=()=>{if(compare.includes(e.number))compare=compare.filter(x=>x!==e.number);else if(compare.length<4)compare.push(e.number);else{alert('최대 4개 원소까지 비교할 수 있어요.');return}renderDetails();renderCompare()};controls.append(fav,cmp);d.append(controls);
const fields=[['주기',correctPosition(e.number)[0]>=9?(correctPosition(e.number)[0]===9?'6주기':'7주기'):correctPosition(e.number)[0]+'주기'],['원소 기원',e.number<=94?'자연계에서 발견됨'+([43,61,93,94].includes(e.number)?' (극미량)':''):'인공 합성 원소'],['원자량',fmt(e.atomic_mass,' u')],['발견자',fmt(e.discovered_by)],['발견 연도',fmt(e.year_discovered)],['상태',fmt(e.phase)],['밀도',fmt(e.density,' g/cm³')],['녹는점',fmt(e.melt,' K')],['끓는점',fmt(e.boil,' K')],['전기음성도',fmt(e.electronegativity_pauling)],['전자배치',fmt(e.electron_configuration_semantic||e.electron_configuration)],['전자껍질',Array.isArray(e.shells)?e.shells.join(' · '):'자료 없음'],['원자 반지름',fmt(e.atomic_radius,' pm')],['이온화 에너지',fmt(e.ionization_energies?.[0],' kJ/mol')]];
const stats=document.createElement('div');stats.className='stats';fields.forEach(([k,v])=>{const cell=document.createElement('div');cell.className='stat';const label=document.createElement('label');label.textContent=k;const val=document.createElement('b');val.textContent=v;cell.append(label,val);stats.append(cell)});d.append(stats);if(e.summary){const p=document.createElement('p');p.textContent=e.summary;d.append(p)}if(e.source){const a=document.createElement('a');a.href=e.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='원소 출처 보기';d.append(a)}}
function renderCompare(){$('count').textContent='('+compare.length+'/4)';const root=$('comparison');root.replaceChildren();if(!compare.length){root.textContent='원소 상세 화면에서 비교 목록에 추가하세요.';return}const keys=[['주기','period_display'],['원소 기원','origin_display'],['원자번호','number'],['원자량 (u)','atomic_mass'],['분류','category'],['발견자','discovered_by'],['발견 연도','year_discovered'],['밀도 (g/cm³)','density'],['녹는점 (K)','melt'],['끓는점 (K)','boil'],['전기음성도','electronegativity_pauling'],['전자배치','electron_configuration_semantic']];const wrap=document.createElement('div');wrap.className='scroll';const t=document.createElement('table');const tr=document.createElement('tr');['특성',...compare.map(n=>elements[n-1].korean+' ('+elements[n-1].symbol+')')].forEach(x=>{const th=document.createElement('th');th.textContent=x;tr.append(th)});t.append(tr);keys.forEach(([label,key])=>{const row=document.createElement('tr');[label,...compare.map(n=>key==='category'?category(elements[n-1]):key==='period_display'?(elements[n-1].number<=2?1:elements[n-1].number<=10?2:elements[n-1].number<=18?3:elements[n-1].number<=36?4:elements[n-1].number<=54?5:elements[n-1].number<=86?6:7)+'주기':key==='origin_display'?(elements[n-1].number<=94?'자연계에서 발견됨':'인공 합성'):fmt(elements[n-1][key]))].forEach(x=>{const td=document.createElement('td');td.textContent=x;row.append(td)});t.append(row)});wrap.append(t);root.append(wrap)}
$('search').oninput=render;$('filter').onchange=render;$('clear').onclick=()=>{$('search').value='';$('filter').value='';favOnly=false;$('favorites').textContent='☆ 즐겨찾기만';render()};$('favorites').onclick=()=>{favOnly=!favOnly;$('favorites').textContent=favOnly?'★ 즐겨찾기만':'☆ 즐겨찾기만';render()};$('clearCompare').onclick=()=>{compare=[];renderCompare();renderDetails()};
async function load(){try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);let res;try{res=await fetch('https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json',{signal:controller.signal})}finally{clearTimeout(timeout)}if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.elements)||data.elements.length<118)throw Error('데이터 형식 오류');elements=elements.map((e,i)=>({...data.elements[i],korean:e.korean}));const cats=[...new Set(elements.map(e=>e.category).filter(Boolean))].sort();cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=category({category:c});$('filter').append(o)});render();renderDetails()}catch(err){$('status').textContent='기본 118개 원소 기호는 사용 가능하지만 상세 데이터 연결에 실패했습니다. 인터넷 연결을 확인하고 새로고침하세요.';render();renderDetails();console.warn('Atom dataset:',err)}}render();renderDetails();renderCompare();load();
</script></body></html>
