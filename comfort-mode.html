<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMFORT MODE | Formwheel</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#35244f,#111321 70%);color:#f7f4ff}main{max-width:850px;margin:auto;padding:28px 18px 70px}a{color:#d2bbff}.hero,.card{background:#ffffff0b;border:1px solid #66547e;border-radius:20px;padding:22px;margin:15px 0}.hero h1{margin:0 0 8px;font-size:clamp(29px,6vw,42px)}.muted{color:#c9c0d6;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.grid .card{margin:0}button{font:inherit;padding:12px 15px;border:1px solid #aa90df;border-radius:12px;background:#4c3671;color:#fff;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffb95f;outline-offset:3px}.status{color:#bff0c2;font-weight:700}.notice{border:1px solid #927547;background:#392c22;padding:15px;border-radius:13px;margin:20px 0}input{accent-color:#bd91ff}label{display:block;margin:12px 0;line-height:1.5}.bar{height:9px;background:#393248;border-radius:12px;overflow:hidden}.bar>span{display:block;height:100%;background:#b58aff}body.fw-high-contrast{background:#000!important;color:#fff!important}body.fw-high-contrast .card,body.fw-high-contrast .hero{background:#000;border-color:#fff}body.fw-large-controls button,body.fw-large-controls input{min-height:56px;font-size:1.12rem}body.fw-reduced-motion *,body.fw-reduced-motion *:before,body.fw-reduced-motion *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main><a href="./index.html">← Formwheel 허브</a><section class="hero"><h1>🎨 COMFORT MODE</h1><p class="muted">내게 편한 화면을 직접 설정해 보세요.</p></section><section class="card"><h2>화면 편의 설정</h2><label><input id="motion" type="checkbox"> 움직임 줄이기</label><label><input id="contrast" type="checkbox"> 고대비 화면</label><label><input id="controls" type="checkbox"> 큰 버튼과 조작 영역</label><button id="reset" type="button">설정 초기화</button><p id="status" role="status" class="status"></p></section><section class="card"><h2>설정 미리보기</h2><p class="muted">아래 버튼으로 변경된 조작 영역을 시험해 보세요.</p><button id="test" type="button">테스트 버튼</button></section><div class="notice"><strong>적용 범위 안내</strong><p class="muted">이 설정은 현재 COMFORT MODE 페이지에 적용됩니다. 다른 게임에 자동으로 적용되지는 않습니다. 게임별 지원을 연결하기 전까지 판정 규칙·게임 속도·데이터는 변경하지 않습니다. 설정은 이 브라우저에 저장됩니다.</p></div></main><script>
'use strict';const key='fw-comfort-mode-v1';const ids=['motion','contrast','controls'];let prefs={};try{const v=JSON.parse(localStorage.getItem(key)||'{}');if(v&&typeof v==='object')prefs=v}catch(e){}function apply(){document.body.classList.toggle('fw-reduced-motion',!!prefs.motion);document.body.classList.toggle('fw-high-contrast',!!prefs.contrast);document.body.classList.toggle('fw-large-controls',!!prefs.controls);for(const id of ids)document.getElementById(id).checked=!!prefs[id]}for(const id of ids){document.getElementById(id).addEventListener('change',e=>{prefs[id]=e.target.checked;apply();try{localStorage.setItem(key,JSON.stringify(prefs));document.getElementById('status').textContent='설정 저장됨'}catch(err){document.getElementById('status').textContent='설정이 화면에만 적용됨 (저장 불가)'}})}document.getElementById('reset').addEventListener('click',()=>{prefs={};apply();try{localStorage.removeItem(key)}catch(e){}document.getElementById('status').textContent='설정 초기화됨'});document.getElementById('test').addEventListener('click',()=>{document.getElementById('status').textContent='버튼이 정상 작동해요!'});apply();</script></body></html>
