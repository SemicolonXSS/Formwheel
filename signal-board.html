<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📡 SIGNAL BOARD | Formwheel</title><style>body{margin:0;background:#151426;color:#f5f1ff;font:16px system-ui}main{max-width:780px;margin:auto;padding:24px 16px}section{padding:20px;border:1px solid #665584;border-radius:18px;background:#242039;margin:16px 0}a{color:#d5bfff}button,input,select{font:inherit;padding:10px;max-width:100%;border-radius:10px;border:1px solid #a991ce;background:#40305c;color:white}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:14px 0}p{line-height:1.6}output{display:block;overflow-wrap:anywhere}li{margin:12px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange}</style></head><body><main><a href="./index.html">← 허브</a><h1>📡 SIGNAL BOARD</h1><section><p>이 기기에서 직접 확인한 결과입니다. 페이지 응답은 게임 전체 기능의 정상 작동을 보장하지 않습니다.</p><button id="check">다시 검사</button><ul id="results" aria-live="polite"></ul><p id="time"></p><p>로그인·방문자 집계·Rapid 거래: 전용 상태 API가 확인되지 않아 검사하지 않습니다.</p></section></main><script>'use strict';const root=document.getElementById('results'),button=document.getElementById('check');async function check(){button.disabled=true;root.replaceChildren();const targets=[['허브','./index.html'],['Polyrhythm','./polyrhythm.html'],['SEED LINK','./seed-link.html'],['SAVE VAULT','./save-vault.html']];await Promise.all(targets.map(async ([name,path])=>{const li=document.createElement('li');li.textContent=name+' · 검사 중';root.append(li);const start=performance.now(),c=new AbortController(),timer=setTimeout(()=>c.abort(),8000);try{const r=await fetch(path,{cache:'no-store',signal:c.signal});li.textContent=name+' · HTTP '+r.status+' · '+Math.round(performance.now()-start)+'ms · '+(r.ok?'페이지 응답 성공':'응답 오류')}catch{li.textContent=name+' · 확인 불가'}finally{clearTimeout(timer)}}));const li=document.createElement('li');try{const k='fw-signal-test-'+crypto.randomUUID();localStorage.setItem(k,'1');const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);li.textContent='로컬 저장 · '+(ok?'읽기/쓰기 성공':'확인 불가')}catch{li.textContent='로컬 저장 · 확인 불가'}root.append(li);document.getElementById('time').textContent='마지막 검사: '+new Date().toLocaleString('ko-KR');button.disabled=false}button.onclick=check;check();</script></body></html>
