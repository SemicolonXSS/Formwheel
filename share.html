<style>body{margin:0;background:#10172d;color:#fff;font:16px/1.65 system-ui,sans-serif}main{max-width:720px;margin:6vh auto;padding:25px}h1{font-size:clamp(32px,7vw,55px);line-height:1.15}p{color:#d7def3}.card{background:#202a48;border:1px solid #445071;border-radius:20px;padding:22px;margin:18px 0}.actions{display:flex;flex-wrap:wrap;gap:10px}a,button{font:inherit;display:inline-block;background:#ffcf69;color:#211b35;border:0;border-radius:12px;padding:12px 17px;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#384669;color:white}small{color:#b9c4dd}button:focus-visible,a:focus-visible{outline:3px solid #ffcf69;outline-offset:3px}</style></head>
<body><main><a class="secondary" href="./">← Formwheel Hub</a><h1>🎡 같이 놀자!<br>Formwheel</h1><p>설치 없이 즐기는 무료 웹게임, 친구와 함께하는 대전, 직접 만드는 콘텐츠까지!</p>
<div class="card"><h2>🎮 처음이라면?</h2><p>Hub에서 마음에 드는 게임을 골라 바로 시작해 보세요. 일부 멀티플레이 기능은 방 코드나 인터넷 연결이 필요해요.</p><div class="actions"><a href="./#projects">프로젝트 둘러보기 →</a><a class="secondary" href="./anniversary-40-50.html">🎉 50일 이벤트</a></div></div>
<div class="card"><h2>📣 친구에게 알려주기</h2><p>재미있는 게임을 발견했다면 링크를 공유해 보세요!</p><div class="actions"><button id="share">공유하기</button><button class="secondary" id="copy">링크 복사</button></div><p id="status" role="status" aria-live="polite"></p></div>
<small>Formwheel은 개발 중인 프로젝트로, 지원 기능은 프로젝트마다 다를 수 있어요.</small></main>
<script>const url='https://semicolonxss.github.io/Formwheel/';const status=document.getElementById('status');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);status.textContent='링크를 복사했어요!'}catch{status.textContent='링크: '+url}};document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Formwheel',text:'설치 없이 즐기는 무료 웹게임! 같이 해보자 🎮',url})}catch(e){if(e.name!=='AbortError')status.textContent='공유가 안 되면 링크 복사를 이용해 주세요.'}}else document.getElementById('copy').click()};</script></body></html>
