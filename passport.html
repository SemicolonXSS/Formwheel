<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171d30"><title>PLAY PASSPORT | Formwheel</title><meta name="description" content="PLAY PASSPORT | Formwheel 페이지를 Formwheel에서 만나보세요."><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#38245e,#121326 65%);color:#f6f3ff;min-height:100vh}main{max-width:850px;margin:auto;padding:28px 18px 65px}a{color:inherit}.back{color:#c9b9ff;text-decoration:none}.hero{padding:25px;border:1px solid #7764ac;border-radius:22px;background:#ffffff0b;margin:22px 0}.hero h1{margin:0;font-size:clamp(28px,6vw,43px)}.hero p{color:#d4cbe9}.progress{height:15px;border-radius:20px;background:#39334d;overflow:hidden}.progress span{display:block;background:linear-gradient(90deg,#a67bff,#ffa94d);height:100%;transition:width .2s}.count{font-size:22px;font-weight:800;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.game{border:1px solid #51466e;background:#221d36;border-radius:17px;padding:17px}.game.visited{border-color:#b78bff;background:#302443}.stamp{font-size:31px}.game h2{font-size:19px;margin:8px 0}.game p{color:#cfc6e3;font-size:13px;min-height:38px}.game a{display:inline-block;padding:10px 14px;background:#a57aff;color:#170e29;text-decoration:none;border-radius:10px;font-weight:800}.note{color:#d3cbe3;font-size:13px;line-height:1.6}.status{font-weight:700;color:#eec68a}.visited .status{color:#b6ffa9}button{border:1px solid #7764ac;background:transparent;color:#e9ddff;border-radius:10px;padding:10px;cursor:pointer}</style></head>
<body><main><a class="back" href="./index.html">← Formwheel 허브로</a><section class="hero"><h1>🛂 PLAY PASSPORT</h1><p>새로운 Formwheel 게임을 탐험하고 여권에 방문 도장을 모아 보세요!</p><div class="count" id="count" aria-live="polite"></div><div class="progress" role="progressbar" aria-label="방문 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span id="bar"></span></div></section><div class="grid" id="games"></div><p class="note">도장은 게임 실행 버튼을 누르면 이 브라우저에 저장됩니다. 실제 플레이 완료 인증이나 계정 간 동기화는 지원하지 않습니다. 브라우저 데이터를 삭제하면 도장도 사라질 수 있습니다.</p><button id="reset" type="button">이 기기의 방문 도장 초기화</button></main>
<script>
'use strict';
const games=[
{id:'clicker',name:'Clicker',icon:'🖱️',desc:'클릭과 업그레이드로 성장하는 게임',url:'https://semicolonxss.github.io/Formwheel_Clicker/'},
{id:'maze',name:'Maze',icon:'🌀',desc:'미로를 탐험하며 탈출에 도전',url:'https://semicolonxss.github.io/Formwheel_Maze/'},
{id:'reflex',name:'Reflex',icon:'⚡',desc:'반응 속도를 시험하는 도전',url:'https://semicolonxss.github.io/Formwheel_Reflex/'},
{id:'cook',name:'Cook',icon:'🍳',desc:'재료로 음식을 만드는 게임',url:'https://semicolonxss.github.io/Formwheel_Cook/'},
{id:'wheel',name:'Wheel',icon:'🎡',desc:'랜덤 돌림판 도구',url:'https://semicolonxss.github.io/Formwheel_Wheel/'}
];
const key='fw-play-passport-v1';
let stamps={};let storageAvailable=true;
try{const parsed=JSON.parse(localStorage.getItem(key)||'{}');if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))stamps=parsed;}catch(e){storageAvailable=false;}
function save(){try{localStorage.setItem(key,JSON.stringify(stamps));storageAvailable=true;}catch(e){storageAvailable=false;}}
function render(){const count=games.filter(g=>stamps[g.id]).length;document.getElementById('count').textContent=count+' / '+games.length+' 방문 도장';const percent=Math.round(count/games.length*100);document.getElementById('bar').style.width=percent+'%';document.getElementById('progress').setAttribute('aria-valuenow',String(percent));const grid=document.getElementById('games');grid.replaceChildren();for(const game of games){const card=document.createElement('article');card.className='game'+(stamps[game.id]?' visited':'');const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=stamps[game.id]?'✅':game.icon;const title=document.createElement('h2');title.textContent=game.name;const desc=document.createElement('p');desc.textContent=game.desc;const status=document.createElement('p');status.className='status';status.textContent=stamps[game.id]?'방문 도장 획득':'미방문';const link=document.createElement('a');link.href=game.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='게임 열기 ↗';link.addEventListener('click',()=>{stamps[game.id]=Date.now();save();render();});card.append(stamp,title,desc,status,link);grid.append(card);}}
document.getElementById('reset').addEventListener('click',()=>{if(confirm('이 브라우저에 저장된 방문 도장을 모두 지울까요?')){stamps={};save();render();}});
render();
</script></body></html>
