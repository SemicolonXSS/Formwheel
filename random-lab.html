<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Random Lab</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>body{margin:0;background:#101626;color:#f5f7ff;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px}a{color:#8eead3}section{background:#202a40;border:1px solid #3b4962;border-radius:18px;padding:20px;margin:18px 0}button{background:#9cf1d8;color:#11243b;border:0;border-radius:12px;padding:13px 18px;font-weight:750;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid orange}#target{width:85px;height:85px;border-radius:50%;background:#ffbd68;position:absolute;display:none;cursor:pointer;touch-action:manipulation}#arena{height:240px;position:relative;background:#121b2d;border-radius:14px;overflow:hidden}li{margin:12px 0}.muted{color:#bdcbe0}</style></head><body><main><a href="./index.html">← Formwheel Hub</a><h1>🎲 RANDOM LAB</h1><p>오늘의 발견, 무작위 탐험, 10초 미니게임!</p><section><h2>📅 DAILY MIX</h2><p class="muted">한국 시간 기준 매일 3개 추천 · 로그인 불필요</p><ol id="daily"></ol></section><section><h2>🌀 RANDOM PORTAL</h2><p>어디로 갈지 모르는 랜덤 여행!</p><button id="portal">랜덤 프로젝트로 이동</button></section><section><h2>⚡ 10초 MINI ARCADE</h2><p>시작하면 나타나는 원을 최대한 많이 눌러봐!</p><p id="score" aria-live="polite">준비 완료 · 최고 기록 0점</p><button id="start">10초 도전 시작</button><div id="arena"><button id="target" aria-label="목표 원 누르기"></button></div></section></main><script>const projects=[['Clicker','clicker/'],['Cook','cook/'],['Maze','maze/'],['Reflex','reflex/'],['Wheel','wheel/'],['AQS','aqs/'],['Paint','paint/'],['Sports','sports/'],['Story','story/'],['Board','board/']];const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let seed=Number(today.replace(/\D/g,''));function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const pool=[...projects];for(let i=pool.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const list=document.getElementById('daily');pool.slice(0,3).forEach(([name,path])=>{const li=document.createElement('li'),a=document.createElement('a');a.textContent=name;a.href='./'+path;li.append(a);list.append(li)});document.getElementById('portal').onclick=()=>{const p=projects[Math.floor(Math.random()*projects.length)];location.href='./'+p[1]};const arena=document.getElementById('arena'),target=document.getElementById('target'),score=document.getElementById('score'),start=document.getElementById('start');let points=0,active=false,timeout;let best=0;try{best=Number(localStorage.getItem('fw-random-lab-best')||0)||0}catch{}score.textContent='준비 완료 · 최고 기록 '+best+'점';function move(){const w=Math.max(0,arena.clientWidth-target.offsetWidth),h=Math.max(0,arena.clientHeight-target.offsetHeight);target.style.left=Math.random()*w+'px';target.style.top=Math.random()*h+'px'}target.onclick=()=>{if(!active)return;points++;score.textContent='점수 '+points+'점';move()};start.onclick=()=>{if(active)return;active=true;points=0;start.disabled=true;target.style.display='block';move();score.textContent='점수 0점 · 10초!';clearTimeout(timeout);timeout=setTimeout(()=>{active=false;target.style.display='none';start.disabled=false;if(points>best){best=points;try{localStorage.setItem('fw-random-lab-best',String(best))}catch{}}score.textContent='종료! '+points+'점 · 최고 '+best+'점'},10000)};</script></body></html>
