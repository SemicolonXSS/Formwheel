<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel 탐험 지도 · EVOLUTION 01</title><link rel="icon" href="./assets/formwheel-favicon.svg"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#292443;background:#f5f3ff}*{box-sizing:border-box}body{margin:0}header{padding:17px 20px;background:white;border-bottom:1px solid #e7e2ff;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#6244c5}main{max-width:1000px;margin:auto;padding:24px 16px}h1{margin:0 0 8px}.muted{color:#68627d}.world{position:relative;min-height:440px;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 30% 30%,#c5ebd2 0 15%,transparent 16%),radial-gradient(ellipse at 70% 65%,#a7dbca 0 20%,transparent 21%),linear-gradient(130deg,#d7eafa,#c6c4fa);border:4px solid #fff;box-shadow:0 10px 40px #5641a022}.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.zone{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:18px;padding:12px;background:#ffffffed;box-shadow:0 4px 15px #34305433;cursor:pointer;min-width:118px;max-width:150px;font-weight:750;color:#292443}.zone span{display:block;font-size:30px}.zone:focus-visible{outline:4px solid #5537be}.zone[aria-pressed=true]{background:#5f48c4;color:white}.panel{background:white;border-radius:20px;padding:20px;margin-top:16px;border:1px solid #e9e4fb}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.links a{padding:10px 14px;background:#ede8ff;border-radius:10px;text-decoration:none;font-weight:700}.note{font-size:13px}footer{padding:25px;text-align:center}@media(max-width:550px){.world{min-height:570px}.zone{min-width:95px;padding:9px;font-size:12px}.zone span{font-size:24px}}</style></head><body>
<header><strong>🌌 Formwheel · EVOLUTION 01</strong><a href="./">← Hub 돌아가기</a></header>
<main><h1>🗺️ Formwheel 탐험 지도</h1><p class="muted">프로젝트 세계를 둘러보세요! 기존 Hub와 모든 프로젝트는 그대로 유지됩니다.</p>
<div class="world" aria-label="Formwheel 지역 지도"><svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 45 L19 22 M50 45 L79 20 M50 45 L22 77 M50 45 L77 76 M50 45 L51 89" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
<button class="zone" style="left:50%;top:45%" data-zone="hub" aria-pressed="true"><span>🏙️</span>중앙 광장</button>
<button class="zone" style="left:19%;top:22%" data-zone="play" aria-pressed="false"><span>🎮</span>플레이 아일랜드</button>
<button class="zone" style="left:79%;top:20%" data-zone="tools" aria-pressed="false"><span>🛠️</span>도구 연구소</button>
<button class="zone" style="left:22%;top:77%" data-zone="aqs" aria-pressed="false"><span>🏆</span>업적 신전</button>
<button class="zone" style="left:77%;top:76%" data-zone="rapid" aria-pressed="false"><span>🛍️</span>Rapid 마을</button>
<button class="zone" style="left:51%;top:89%" data-zone="secret" aria-pressed="false"><span>🌑</span>미지의 영역</button></div>
<section class="panel" aria-live="polite"><h2 id="zone-title">🏙️ 중앙 광장</h2><p id="zone-desc">Formwheel 세계의 시작점입니다.</p><div class="links" id="zone-links"><a href="./">Hub 열기</a></div></section>
<p class="muted note">현재 지도는 탐험용 첫 버전입니다. 방문 기록·XP·Rapid 구매·업적 지급에는 영향을 주지 않습니다.</p></main><footer>Formwheel · 기존 기능 보존 우선</footer>
<script>
const zones={
hub:{title:"🏙️ 중앙 광장",desc:"Formwheel 세계의 시작점입니다.",links:[["Hub 열기","./"]]},
play:{title:"🎮 플레이 아일랜드",desc:"다양한 게임을 탐험해 보세요.",links:[["Battle","../Formwheel_Battle/"],["Quiz","../Formwheel_Quiz/"],["Reflex","../Formwheel_Reflex/"]]},
tools:{title:"🛠️ 도구 연구소",desc:"생활에 유용한 도구들이 모인 지역입니다.",links:[["Wheel","../Formwheel_Wheel/"],["Decode","../Formwheel_Decode/"],["Form","../Formwheel_Form/"]]},
aqs:{title:"🏆 업적 신전",desc:"업적과 퀘스트를 확인하세요.",links:[["AQS","../Formwheel_AQS/"]]},
rapid:{title:"🛍️ Rapid 마을",desc:"Rapid Shop은 기존 Hub에서 이용할 수 있습니다.",links:[["Hub에서 Shop 찾기","./"]]},
secret:{title:"🌑 미지의 영역",desc:"비밀은 기존 Formwheel 프로젝트 안에 숨겨져 있습니다.",links:[["Hub 탐험하기","./"]]}
};
document.querySelectorAll(".zone").forEach(button=>button.addEventListener("click",()=>{const zone=zones[button.dataset.zone];document.querySelectorAll(".zone").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));document.getElementById("zone-title").textContent=zone.title;document.getElementById("zone-desc").textContent=zone.desc;const links=document.getElementById("zone-links");links.replaceChildren();zone.links.forEach(([name,url])=>{const a=document.createElement("a");a.href=url;a.textContent=name;links.append(a)})}));
</script></body></html>
