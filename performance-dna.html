<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERFORMANCE DNA | Formwheel</title><style>body{background:#101322;color:#eee;font:16px system-ui;margin:auto;padding:24px;max-width:680px}a{color:#c4b5fd}button,select{font:inherit;padding:12px;background:#292343;color:white;border:1px solid #7661b5;border-radius:10px;margin:6px}canvas{width:100%;background:#080b14;border-radius:16px;touch-action:none}p{line-height:1.6}output{display:block;padding:12px;white-space:pre-line}</style><a href="./">← Formwheel</a><h1>PERFORMANCE DNA</h1><p>약 10초 동안 Canvas 렌더링 성능을 측정합니다. 결과는 기기 내에서만 표시됩니다.</p><button id="go">진단 시작</button><canvas id="c" width="480" height="240"></canvas><output id="out" aria-live="polite">진단 대기</output><script>const c=document.querySelector('#c'),g=c.getContext('2d'),out=document.querySelector('#out'),go=document.querySelector('#go');let active=false;go.onclick=()=>{if(active)return;active=true;go.disabled=true;let start=performance.now(),last=start,phase=-1,results=[[],[],[],[]];const names=['기본','파티클','트레일','레이저'];function frame(now){if(document.hidden){active=false;go.disabled=false;out.textContent='화면이 숨겨져 진단을 중단했습니다.';return}const elapsed=now-start,i=Math.min(3,Math.floor(elapsed/2500));if(i===phase&&now>last)results[i].push(now-last);phase=i;last=now;g.fillStyle=i===2?'#080b1433':'#080b14';g.fillRect(0,0,480,240);for(let j=0;j<[30,450,220,100][i];j++){const x=(j*37+elapsed*.08)%480,y=(j*71+Math.sin(elapsed*.002+j)*30+240)%240;g.fillStyle='hsl('+j*17%360+' 80% 60%)';if(i===3){g.fillRect(x,y,100,2)}else{g.beginPath();g.arc(x,y,3,0,Math.PI*2);g.fill()}}if(elapsed<10000){out.textContent=names[i]+' 측정 중 · '+Math.floor(elapsed/100)+'%';requestAnimationFrame(frame);return}const fps=results.map(a=>a.length?Math.round(1000*a.length/a.reduce((x,y)=>x+y,0)):0);out.textContent=names.map((n,i)=>n+': '+fps[i]+' FPS').join('\n')+'\n권장: '+(Math.min(...fps)<40?'파티클 및 트레일 경량화':'기본 효과 유지')+'\n실제 게임 설정은 자동 변경하지 않습니다.';active=false;go.disabled=false}requestAnimationFrame(frame)};</script></html>
