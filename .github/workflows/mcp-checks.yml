name: Formwheel MCP checks
on:
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-checks.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-checks.yml'
jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Validate server imports
        run: node --check server.js && node --check catalog.js
