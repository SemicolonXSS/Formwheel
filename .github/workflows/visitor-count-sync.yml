
name: Sync public Formwheel visitor count

on:
  schedule:
    # UTC 기준 매시간 2, 7, 12, 17 ... 57분
    # GitHub Actions 예약 실행은 지연되거나 누락될 수 있음
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

  # GitHub Actions에서 수동 실행도 가능
  workflow_dispatch:

  # 외부 무료 스케줄러에서 GitHub API로 호출할 수 있는 대체 트리거
  repository_dispatch:
    types: [sync-public-visitors]

permissions:
  contents: read

# 동일한 방문자 집계 작업의 중복 실행 방지
concurrency:
  group: formwheel-visitor-counter
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Firebase visitor count
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock --ignore-scripts firebase-admin@13

      - name: Show sync trigger and timestamp
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: ${RUN_EVENT}"
          echo "Schedule: ${SCHEDULE:-manual}"
          echo "Runner UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Publish verified unique visitor total
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-visitor-count.mjs
