name: Render Formwheel OG image
on:
  push:
    branches: [main]
    paths:
      - 'og-image-source.svg'
      - '.github/workflows/render-og-image.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer and Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - name: Render 1200x630 PNG
        run: |
          rsvg-convert -w 1200 -h 630 -o og-image.png og-image-source.svg
          file og-image.png
      - name: Commit regenerated PNG
        run: |
          if git diff --quiet -- og-image.png; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git commit -m "assets: refresh uncluttered Formwheel OG preview"
          git push
