name: Formwheel quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formwheel-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Syntax, assets and security core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and local assets
        run: node scripts/check-syntax.cjs
      - name: Validate Hub catalog and sitemap
        run: node scripts/check-hub-catalog.cjs
      - name: Security core regression tests
        run: node firebase-security/tests/core.test.cjs
      - name: Validate database rules JSON syntax
        run: node -e "JSON.parse(require('node:fs').readFileSync('database.rules.json','utf8')); console.log('PASS rules JSON parse')"
