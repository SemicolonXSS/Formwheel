name: Formwheel quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formwheel-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Syntax, assets and security core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and local assets
        run: node scripts/check-syntax.cjs
      - name: Validate Hub catalog and sitemap
        run: node scripts/check-hub-catalog.cjs
      - name: Validate keyboard skip navigation across Hub pages
        run: node scripts/check-hub-accessibility.cjs
      - name: Offline cache regression tests
        run: node --test tests/*.test.cjs
      - name: Security core regression tests
        run: node firebase-security/tests/core.test.cjs
      - name: Validate database rules JSON syntax
        run: node -e "const fs=require('node:fs'),config=JSON.parse(fs.readFileSync('firebase.json','utf8')); JSON.parse(fs.readFileSync(config.database.rules,'utf8')); console.log('PASS configured rules JSON parse')"
      - name: Localization and account theme regression tests
        run: node tests/localization-theme-regression.cjs
      - name: Check proposed combined database rules
        run: node scripts/check-combined-rules.cjs

  social-rules:
    name: Active social Rules emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        working-directory: firebase-security
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exercise deployed-path ownership, blocking and request transitions
        working-directory: firebase-security
        run: npx firebase emulators:exec --project demo-formwheel --only database "node --test tests/social-rules.test.mjs"

  browser-smoke:
    name: Desktop and touch UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1 @axe-core/playwright@4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise settings, shortcut focus, touch scrolling and blocked storage
        run: node tests/browser-smoke.cjs
      - name: Check WCAG contrast, names and Sudoku navigation on desktop and mobile
        run: node tests/accessibility-sweep.cjs
      - name: Check out Tool regression subject
        uses: actions/checkout@v4
        with:
          repository: SemicolonXSS/Formwheel_Tool
          ref: e8c936367cfe14f65d15af236b596405a335db43
          path: ecosystem/Formwheel_Tool
          persist-credentials: false
      - name: Check out Music regression subject
        uses: actions/checkout@v4
        with:
          repository: SemicolonXSS/Formwheel_Music
          ref: 0c860fc7bfb82b7d94d78f3a59c6c0c44f4e403f
          path: ecosystem/Formwheel_Music
          persist-credentials: false
      - name: Exercise storage recovery, owned themes and all editor keys
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem
        run: node tests/extended-regression.cjs

      - name: Prepare verified periodic-table data
        run: python3 scripts/prepare-periodic-fixture.py
      - name: Exercise periodic-table and grid accessibility across four widths
        run: node tests/more-500-regression.cjs

  dense-board-regression:
    name: Dense board touch and keyboard regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1 @axe-core/playwright@4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check all board modes across five widths and dense-board edge interactions
        run: node tests/board-density-regression.cjs
      - name: Check contrast and complete visibility of keyboard focus on wooden boards
        run: node tests/board-focus-regression.cjs

  maze-editor-regression:
    name: Maze editor keyboard and touch regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out repaired Maze subject
        uses: actions/checkout@v4
        with:
          repository: SemicolonXSS/Formwheel_Maze
          ref: 154f8d4484199570ca679d961b10dd3abe9ba134
          path: ecosystem-editor/Formwheel_Maze
          persist-credentials: false
      - name: Install isolated browser runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1 @axe-core/playwright@4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise all editor coordinates, native edits and turn focus
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem-editor
        run: node tests/maze-editor-regression.cjs

  pvp-studio-regression:
    name: Studio map keyboard and AI regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out repaired studio subject
        uses: actions/checkout@v4
        with:
          repository: SemicolonXSS/Formwheel_PVP
          ref: 243122fc16efce84dd809f6715545731b2bb40f2
          path: ecosystem-studio/Formwheel_PVP
          persist-credentials: false
      - name: Install isolated browser runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1 @axe-core/playwright@4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise every map position, pointer and touch editing, and AI rendering
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem-studio
        run: node tests/pvp-map-editor-regression.cjs

  third-app-audit:
    name: Additional app UI and game regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1 @axe-core/playwright@4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare pinned app sources and public SDK cache
        run: python3 scripts/prepare-third-audit.py ecosystem-third
      - name: Exercise app logic regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for p in sorted(Path('ecosystem-third').glob('Formwheel_*/tests/*.cjs')):
              if 'load-source' not in p.name:
                  subprocess.run(['node', str(p.resolve())], cwd=p.parent.parent, check=True)
          PY
      - name: Check desktop app screens and keyboard interaction
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem-third
        run: node tests/third-accessibility.cjs
      - name: Check mobile app screens
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem-third
          FW_VIEWPORT: '390'
        run: node tests/third-accessibility.cjs

  expanded-app-audit:
    name: Expanded UI audit (${{ matrix.viewport }}px)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        viewport: ['1280', '390']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1 @axe-core/playwright@4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare pinned ecosystem and public SDK cache
        run: python3 scripts/prepare-expanded-audit.py ecosystem-expanded
      - name: Check WCAG rules, editable fields and board edges
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem-expanded
          FW_VIEWPORT: ${{ matrix.viewport }}
        run: node tests/expanded-audit.cjs
      - name: Exercise sharing, tutorial layout, scrolling and keyboard focus
        if: matrix.viewport == '1280'
        env:
          FW_ECOSYSTEM_ROOT: ${{ github.workspace }}/ecosystem-expanded
        run: node tests/floating-actions.cjs
