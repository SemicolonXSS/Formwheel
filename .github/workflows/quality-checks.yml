name: Formwheel quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formwheel-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Syntax, assets and security core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and local assets
        run: node scripts/check-syntax.cjs
      - name: Validate Hub catalog and sitemap
        run: node scripts/check-hub-catalog.cjs
      - name: Offline cache regression tests
        run: node --test tests/*.test.cjs
      - name: Security core regression tests
        run: node firebase-security/tests/core.test.cjs
      - name: Validate database rules JSON syntax
        run: node -e "const fs=require('node:fs'),config=JSON.parse(fs.readFileSync('firebase.json','utf8')); JSON.parse(fs.readFileSync(config.database.rules,'utf8')); console.log('PASS configured rules JSON parse')"
      - name: Localization and account theme regression tests
        run: node tests/localization-theme-regression.cjs
      - name: Check proposed combined database rules
        run: node scripts/check-combined-rules.cjs

  social-rules:
    name: Active social Rules emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        working-directory: firebase-security
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exercise deployed-path ownership, blocking and request transitions
        working-directory: firebase-security
        run: npx firebase emulators:exec --project demo-formwheel --only database "node --test tests/social-rules.test.mjs"
