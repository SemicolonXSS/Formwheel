<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPTICAL CHAOS | Formwheel</title><style>body{margin:0;background:#0b1022;color:#eef2ff;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}h1{color:#c4b5fd}canvas{width:100%;aspect-ratio: 9/6;background:#101a30;border:1px solid #475569;border-radius:15px;touch-action:none}section{background:#1e293b;border-radius:14px;padding:12px;margin:12px 0}label{display:block;margin:10px 0}input{width:100%}button,select{background:#7c3aed;color:white;border:0;padding:12px;border-radius:10px;font:inherit;cursor:pointer}button{margin:3px}#status{min-height:2em;color:#fde68a}small{color:#cbd5e1}</style><main><a href="./" style="color:#c4b5fd">← Formwheel Hub</a><h1>🌈 OPTICAL CHAOS</h1><p>반사 × 굴절 × 전반사 × 프리즘 · 광학 지옥</p><canvas id="scene" width="900" height="600" aria-label="광학 퍼즐 게임"></canvas><section><strong id="level"></strong><p id="status" role="status"></p><label>광원 방향 <output id="av">0°</output><input id="angle" type="range" min="-75" max="75" value="0"></label><label>거울 회전 <output id="mv">0°</output><input id="mirror" type="range" min="-80" max="80" value="0"></label><label>매질 <select id="medium"><option value="1.33">물 1.33</option><option value="1.5" selected>유리 1.50</option><option value="2.42">다이아몬드 2.42</option></select></label><button id="fire">⚡ 발사</button><button id="next">다음 스테이지</button><button id="reset">초기화</button><p><small>화면의 거울 끝을 드래그해 회전할 수도 있어요. 빛은 실제 벡터 반사와 스넬의 법칙으로 계산됩니다. 제한 시간은 스테이지별로 적용됩니다.</small></p></section></main><script>
const C=document.querySelector('#scene'),ctx=C.getContext('2d'),$=s=>document.querySelector(s),W=900,H=600;
const stages=[{name:'01 반사의 방',time:90,goal:[800,125],mirror:[460,320],slab:false,prism:false},{name:'02 굴절 실험',time:75,goal:[810,390],mirror:[420,320],slab:true,prism:false},{name:'03 프리즘 미궁',time:65,goal:[795,150],mirror:[430,315],slab:true,prism:true},{name:'04 CHAOS',time:50,goal:[815,430],mirror:[430,315],slab:true,prism:true,moving:true}];
let stage=0,started=performance.now(),fired=false,success=false,segments=[],drag=false;
const rad=x=>x*Math.PI/180,sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1],cross=(a,b)=>a[0]*b[1]-a[1]*b[0],unit=a=>{let l=Math.hypot(...a);return a.map(v=>v/l)},reflect=(d,n)=>sub(d,n.map(v=>2*dot(d,n)*v));
function intersect(p,d,a,b){let v=sub(b,a),den=cross(d,v);if(Math.abs(den)<1e-8)return null;let q=sub(a,p),t=cross(q,v)/den,u=cross(q,d)/den;return t>0.001&&u>=0&&u<=1?{t,p:[p[0]+d[0]*t,p[1]+d[1]*t]}:null}
function refract(d,n,n1,n2){let cos=-dot(d,n),eta=n1/n2,k=1-eta*eta*(1-cos*cos);return k<0?null:unit(d.map((v,i)=>eta*v+(eta*cos-Math.sqrt(k))*n[i]))}
function geometry(t){let s=stages[stage],m=s.mirror,angle=rad(+$('mirror').value+(s.moving?Math.sin(t/650)*24:0)),v=[Math.cos(angle)*115,Math.sin(angle)*115],objects=[{a:sub(m,v),b:[m[0]+v[0],m[1]+v[1]],type:'mirror'}];if(s.slab){for(let x of [555,680])objects.push({a:[x,75],b:[x,525],type:'glass'})}if(s.prism){let pts=[[705,260],[770,365],[665,390]];for(let i=0;i<3;i++)objects.push({a:pts[i],b:pts[(i+1)%3],type:'prism'})}return objects}
function trace(t){let objs=geometry(t),angle=rad(+$('angle').value),p=[65,300],d=[Math.cos(angle),Math.sin(angle)],inside=false,ray=[],color='#facc15',n=+$('medium').value;for(let k=0;k<15;k++){let hits=objs.map(o=>({...o,hit:intersect(p,d,o.a,o.b)})).filter(o=>o.hit).sort((a,b)=>a.hit.t-b.hit.t);let h=hits[0];let end=h?h.hit.p:[p[0]+d[0]*1200,p[1]+d[1]*1200];ray.push({a:p,b:end,color});if(!h)break;p=end;let edge=unit(sub(h.b,h.a)),normal=[-edge[1],edge[0]];if(dot(d,normal)>0)normal=normal.map(v=>-v);if(h.type==='mirror')d=unit(reflect(d,normal));else{let next=inside?1:n;let nd=refract(d,normal,inside?n:1,next);if(nd){d=nd;inside=!inside;if(h.type==='prism')color=['#f87171','#facc15','#4ade80','#60a5fa'][k%4]}else d=unit(reflect(d,normal))}p=[p[0]+d[0]*0.05,p[1]+d[1]*0.05]}return ray}
function distance(p,a,b){let v=sub(b,a),w=sub(p,a),t=Math.max(0,Math.min(1,dot(w,v)/dot(v,v)));return Math.hypot(p[0]-a[0]-v[0]*t,p[1]-a[1]-v[1]*t)}
function draw(t){let s=stages[stage],left=Math.max(0,s.time-(t-started)/1000);if(left===0&&!success)fired=false;ctx.clearRect(0,0,W,H);ctx.fillStyle='#101a30';ctx.fillRect(0,0,W,H);if(s.slab){ctx.fillStyle='#164e63aa';ctx.fillRect(555,75,125,450)}let objects=geometry(t);for(let o of objects){ctx.strokeStyle=o.type==='mirror'?'#e2e8f0':o.type==='prism'?'#d8b4fe':'#67e8f9';ctx.lineWidth=o.type==='mirror'?9:3;ctx.beginPath();ctx.moveTo(...o.a);ctx.lineTo(...o.b);ctx.stroke()}ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(65,300,12,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4ade80';ctx.lineWidth=5;ctx.beginPath();ctx.arc(...s.goal,19,0,Math.PI*2);ctx.stroke();if(fired){segments=trace(t);for(let r of segments){ctx.strokeStyle=r.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(...r.a);ctx.lineTo(...r.b);ctx.stroke()}if(!success&&segments.some(r=>distance(s.goal,r.a,r.b)<19)&&left>0){success=true;$('#status').textContent='🎯 명중! 다음 스테이지로!'}}ctx.fillStyle='#fff';ctx.font='20px system-ui';ctx.fillText('⏱ '+left.toFixed(1)+'s',20,35);if(left===0&&!success)$('#status').textContent='⏰ 시간 초과! 초기화해서 재도전!';requestAnimationFrame(draw)}
function load(){started=performance.now();fired=false;success=false;$('#level').textContent=stages[stage].name+' / '+stages.length+'단계';$('#status').textContent='거울과 광원 각도를 조절한 뒤 발사!';$('#av').textContent=$('#angle').value+'°';$('#mv').textContent=$('#mirror').value+'°'}
$('#angle').oninput=()=>{$('#av').textContent=$('#angle').value+'°';fired=false};$('#mirror').oninput=()=>{$('#mv').textContent=$('#mirror').value+'°';fired=false};$('#fire').onclick=()=>{if(performance.now()-started<stages[stage].time*1000){fired=true;$('#status').textContent='광선 추적 중…'}};$('#next').onclick=()=>{if(!success){$('#status').textContent='먼저 목표를 맞혀야 해!';return}stage=(stage+1)%stages.length;load()};$('#reset').onclick=load;
function pos(e){let r=C.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}C.onpointerdown=e=>{let p=pos(e),m=stages[stage].mirror;if(Math.hypot(...sub(p,m))<150){drag=true;C.setPointerCapture(e.pointerId)}};C.onpointermove=e=>{if(!drag)return;let p=pos(e),m=stages[stage].mirror;let deg=Math.atan2(p[1]-m[1],p[0]-m[0])*180/Math.PI;$('#mirror').value=Math.max(-80,Math.min(80,deg));$('#mirror').dispatchEvent(new Event('input'))};C.onpointerup=()=>drag=false;load();requestAnimationFrame(draw);
</script></html>
