<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Shop · 미리보기</title><style>body{font-family:system-ui;background:#f5f1ff;color:#292244;margin:0}main{max-width:620px;margin:30px auto;padding:20px}section{background:white;border-radius:20px;padding:24px;margin:15px 0}button,a{font:inherit;border:0;border-radius:12px;padding:12px 16px;margin:5px;background:#e9e1ff;color:#4730a5;cursor:pointer}button[aria-pressed=true]{background:#5e45bd;color:white}.avatar{width:112px;height:112px;border-radius:50%;background:#dcd2ff;margin:20px auto;display:grid;place-items:center;font-size:56px;position:relative}.avatar.crown:before{content:"👑";position:absolute;top:-38px;font-size:35px}.avatar.aura{box-shadow:0 0 0 12px #ae89ff,0 0 35px 20px #ac8fff}.avatar.frame{border:8px double #653fd1}.muted{color:#706b83;font-size:14px}</style><link rel="icon" href="assets/formwheel-favicon.svg" type="image/svg+xml"><style id="fw-skip-link-style">.fw-skip-link{position:fixed;inset-inline-start:12px;top:12px;z-index:2147483647;padding:12px 16px;border:2px solid #24205a;border-radius:9px;background:#fff;color:#24205a;font:700 16px/1.4 system-ui,sans-serif;text-decoration:none;transform:translateY(-220%)}.fw-skip-link:focus{transform:none;outline:3px solid #ff9a21;outline-offset:2px}</style></head><body><a class="fw-skip-link" href="#fw-main-content">본문으로 바로가기</a><main id="fw-main-content" tabindex="-1"><a href="./">← Hub</a><h1>🛍️ Rapid Shop 미리보기</h1><p>상품 효과를 구매 없이 시험해 보세요.</p><section><div id="avatar" class="avatar" aria-label="미리보기 아바타">👤</div><p id="state" style="text-align:center">기본 프로필</p><div id="choices"><button data-effect="none" aria-pressed="true">기본</button><button data-effect="crown" aria-pressed="false">👑 Crown</button><button data-effect="aura" aria-pressed="false">✨ Aura</button><button data-effect="frame" aria-pressed="false">🟣 Frame</button></div><button id="reset">미리보기 초기화</button></section><p class="muted">이 페이지는 독립 UI 시제품입니다. 실제 Rapid 상품 목록, 가격, 구매, 장착, 잔액 및 Firebase 데이터는 변경하지 않습니다.</p><script>const avatar=document.getElementById('avatar'),state=document.getElementById('state'),buttons=[...document.querySelectorAll('[data-effect]')];function choose(effect){avatar.className='avatar'+(effect==='none'?'':' '+effect);state.textContent=({none:'기본 프로필',crown:'Crown 효과 미리보기',aura:'Aura 효과 미리보기',frame:'Frame 효과 미리보기'})[effect];buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.effect===effect)))}buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.effect)));document.getElementById('reset').addEventListener('click',()=>choose('none'));</script></main></body></html>
