<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Calendar</title><link rel="icon" href="assets/formwheel-favicon.svg"><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#111827;color:#f9fafb}main{max-width:900px;margin:auto;padding:20px}header,.bar,.nav,.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}a{color:#a5b4fc}button,input,textarea,select{font:inherit;border:1px solid #475569;border-radius:9px;background:#1e293b;color:white;padding:10px}button{cursor:pointer}button:hover{background:#334155}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.day{min-height:76px;text-align:left;padding:7px;overflow:hidden}.day.sel{outline:2px solid #fb923c}.day.muted{opacity:.3}.dot{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:#fdba74}.week{text-align:center;color:#94a3b8}.panel{background:#1e293b;border-radius:16px;padding:16px;margin:16px 0}.entry{padding:10px;border-bottom:1px solid #475569;display:flex;justify-content:space-between;gap:8px}.entry small{color:#cbd5e1}dialog{background:#1e293b;color:white;border:1px solid #64748b;border-radius:14px;max-width:min(92vw,480px);width:100%}form{display:grid;gap:12px}label{display:grid;gap:5px}textarea{min-height:90px}#message{color:#fdba74}@media(max-width:500px){main{padding:10px}.day{min-height:65px;padding:4px;font-size:12px}.dot{font-size:9px}}</style></head><body><main><header><div><a href="./">← Formwheel Hub</a><h1>📅 Calendar</h1></div><button id="add">+ 일정 추가</button></header><p>내 일정과 이벤트를 한눈에. 데이터는 이 브라우저에 자동 저장됩니다.</p><section class="panel"><div class="nav"><button id="prev">‹ 이전</button><h2 id="month"></h2><button id="next">다음 ›</button><button id="today">오늘</button></div><div class="grid" id="calendar"></div></section><section class="panel"><div class="dayhead"><h2 id="selectedTitle"></h2><label><input type="checkbox" id="showEvents" checked> Formwheel 이벤트 표시</label></div><div id="entries"></div></section><section class="panel"><h2>🔑 코드로 공유 · 불러오기</h2><p>Check처럼 코드를 복사해서 전달하세요. 코드에 일정 제목과 메모가 포함되므로 공개 게시에 주의하세요.</p><div class="bar"><button id="export">공유 코드 만들기</button><button id="copy">코드 복사</button></div><textarea id="code" placeholder="공유 코드를 여기에 붙여넣기"></textarea><button id="import">코드로 일정 가져오기</button><p id="message" role="status"></p></section></main><dialog id="editor"><form id="form"><h2 id="formTitle">일정 추가</h2><label>제목<input id="title" maxlength="100" required></label><label>날짜<input id="date" type="date" required></label><label>분류<select id="category"><option value="personal">개인 일정</option><option value="formwheel">Formwheel</option></select></label><label>반복<select id="repeat"><option value="none">반복 안 함</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매달</option><option value="yearly">매년</option></select></label><label>반복 종료일 (선택)<input type="date" id="until"></label><label>메모<textarea id="note" maxlength="1000"></textarea></label><div class="bar"><button type="button" id="cancel">취소</button><button type="submit">저장</button></div></form></dialog><script>
(()=>{'use strict';const key='fw-calendar-v1',el=id=>document.getElementById(id),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let items=[];try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))items=a.filter(valid)}catch{}let view=new Date(),selected=iso(new Date()),editing=null;const events=[{id:'event-halloween-2026',date:'2026-10-31',title:'🎃 Formwheel Halloween',category:'formwheel',note:'글로벌 이벤트'},{id:'event-newyear-2027',date:'2027-01-01',title:'🎉 New Year',category:'formwheel',note:'글로벌 이벤트'}];function valid(x){return x&&typeof x.id==='string'&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.title==='string'&&x.title.length<=100&&['personal','formwheel'].includes(x.category)&&typeof x.note==='string'&&x.note.length<=1000&&(!x.repeat||['none','daily','weekly','monthly','yearly'].includes(x.repeat))&&(!x.until||(/^\d{4}-\d{2}-\d{2}$/.test(x.until)&&x.until>=x.date))}function save(){localStorage.setItem(key,JSON.stringify(items))}function all(){return items.concat(el('showEvents').checked?events:[])}function occurs(x,day){if(x.date===day)return true;if(day<x.date||(x.until&&day>x.until))return false;const rule=x.repeat||'none';if(rule==='none')return false;const start=new Date(x.date+'T12:00:00'),target=new Date(day+'T12:00:00');if(rule==='daily')return true;if(rule==='weekly')return Math.round((target-start)/86400000)%7===0;if(rule==='monthly')return start.getDate()===target.getDate();if(rule==='yearly')return start.getMonth()===target.getMonth()&&start.getDate()===target.getDate();return false}function node(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function render(){el('month').textContent=view.toLocaleDateString('ko-KR',{year:'numeric',month:'long'});const grid=el('calendar');grid.replaceChildren();['일','월','화','수','목','금','토'].forEach(x=>grid.append(node('div',x,'week')));const first=new Date(view.getFullYear(),view.getMonth(),1),offset=first.getDay();for(let i=0;i<42;i++){const d=new Date(view.getFullYear(),view.getMonth(),i-offset+1),s=iso(d),b=node('button',String(d.getDate()),'day'+(s===selected?' sel':'')+(d.getMonth()!==view.getMonth()?' muted':''));b.type='button';all().filter(x=>occurs(x,s)).slice(0,2).forEach(x=>b.append(node('span',x.title,'dot')));b.onclick=()=>{selected=s;view=new Date(d.getFullYear(),d.getMonth(),1);render()};grid.append(b)}el('selectedTitle').textContent=selected+' 일정';const list=el('entries');list.replaceChildren();const matches=all().filter(x=>occurs(x,selected));if(!matches.length)list.append(node('p','일정이 없어요.'));matches.forEach(x=>{const row=node('div',undefined,'entry'),detail=node('div');detail.append(node('strong',x.title),node('div',(x.note||x.category)+(x.repeat&&x.repeat!=='none'?' · 🔁 '+({daily:'매일',weekly:'매주',monthly:'매달',yearly:'매년'}[x.repeat]):''),'small'));row.append(detail);if(!x.id.startsWith('event-')){const controls=node('div'),edit=node('button','수정'),del=node('button','삭제');edit.onclick=()=>open(x);del.onclick=()=>{if(confirm('이 일정을 삭제할까요?')){items=items.filter(y=>y.id!==x.id);save();render()}};controls.append(edit,del);row.append(controls)}list.append(row)})}function open(x){editing=x?.id||null;el('formTitle').textContent=x?'일정 수정':'일정 추가';el('title').value=x?.title||'';el('date').value=x?.date||selected;el('category').value=x?.category||'personal';el('note').value=x?.note||'';el('repeat').value=x?.repeat||'none';el('until').value=x?.until||'';el('editor').showModal()}el('add').onclick=()=>open();el('cancel').onclick=()=>el('editor').close();el('form').onsubmit=e=>{e.preventDefault();const x={id:editing||('item-'+crypto.randomUUID()),date:el('date').value,title:el('title').value.trim(),category:el('category').value,note:el('note').value,repeat:el('repeat').value,until:el('repeat').value==='none'?'':el('until').value};if(!valid(x)||!x.title)return;if(editing)items=items.filter(y=>y.id!==editing);items.push(x);save();selected=x.date;const d=new Date(x.date+'T12:00:00');view=new Date(d.getFullYear(),d.getMonth(),1);el('editor').close();render()};el('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};el('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};el('today').onclick=()=>{view=new Date();selected=iso(view);render()};el('showEvents').onchange=render;function encode(s){const bytes=new TextEncoder().encode(s);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function decode(s){const binary=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(binary,c=>c.charCodeAt(0)))}el('export').onclick=()=>{el('code').value='FWCAL1-'+encode(JSON.stringify(items));el('message').textContent=items.length+'개 일정의 공유 코드 생성 완료'};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('code').value);el('message').textContent='복사 완료'}catch{el('code').select();el('message').textContent='선택한 코드를 직접 복사해 주세요'}};el('import').onclick=()=>{try{const s=el('code').value.trim();if(!s.startsWith('FWCAL1-')||s.length>200000)throw Error();const parsed=JSON.parse(decode(s.slice(7)));if(!Array.isArray(parsed)||parsed.length>500||!parsed.every(valid))throw Error();if(!confirm(parsed.length+'개 일정을 현재 일정에 추가할까요?'))return;const existing=new Set(items.map(x=>x.id));let count=0;for(const x of parsed){if(existing.has(x.id))continue;items.push(x);existing.add(x.id);count++}save();render();el('message').textContent=count+'개 일정 가져오기 완료 (중복 제외)'}catch{el('message').textContent='유효하지 않은 공유 코드예요.'}};render()})();
</script></body></html>
