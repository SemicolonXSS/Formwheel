<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>FORMWHEEL PING! | 오프라인</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(140deg,#101827,#273653);color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(100%,650px);text-align:center}h1{margin:6px 0;color:#ffb067}p{color:#cbd5e1}canvas{width:100%;aspect-ratio:3/2;background:#152039;border:2px solid #64748b;border-radius:15px;touch-action:none;display:block}button,a{border:0;border-radius:12px;padding:12px 17px;font:700 15px system-ui;cursor:pointer;background:#fb923c;color:#172033;display:inline-block;text-decoration:none;margin:8px 3px}.secondary{background:#334155;color:white}.stats{display:flex;justify-content:space-around;margin:10px 0;font-weight:700}.hint{font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}
</style></head><body><main class="wrap"><div>📡 인터넷이 연결되지 않았어요</div><h1>🏓 FORMWHEEL PING!</h1><p>폼휠 로고를 튕겨 최대한 오래 살아남으세요!</p><div class="stats"><span>점수 <b id="score">0</b></span><span>최고 <b id="best">0</b></span></div><canvas id="game" width="600" height="400" aria-label="핑퐁 게임 화면"></canvas><button id="start">게임 시작</button><button id="retry" class="secondary">연결 다시 시도</button><p class="hint" id="status" role="status">마우스·터치·방향키로 아래 패들을 움직이세요. 공을 놓치면 종료!</p><a href="/Formwheel/" class="secondary">허브로 돌아가기</a></main><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start');const W=600,H=400;let best=0;try{best=Number(localStorage.getItem('fw-offline-ping-best'))||0}catch{}bestEl.textContent=best;let score=0,running=false,raf=0,last=0,paddle=250,ball={x:300,y:210,vx:170,vy:-190},keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1d2b46';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#475569';ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(0,200);ctx.lineTo(W,200);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fb923c';ctx.beginPath();ctx.roundRect(paddle,H-30,100,12,6);ctx.fill();ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate((performance.now()/700)%6.283);ctx.fillStyle='#fff7ed';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(-5,-9);ctx.lineTo(10,0);ctx.lineTo(-5,9);ctx.closePath();ctx.fill();ctx.restore()}function end(){running=false;cancelAnimationFrame(raf);start.textContent='다시 시작';status.textContent='게임 종료! '+score+'점 달성. 다시 도전해 보세요!';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('fw-offline-ping-best',String(best))}catch{}}draw()}function tick(t){if(!running)return;let dt=Math.min((t-last)/1000,.032);last=t;if(keys.ArrowLeft||keys.a)paddle-=340*dt;if(keys.ArrowRight||keys.d)paddle+=340*dt;paddle=clamp(paddle,0,W-100);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<15){ball.x=15;ball.vx=Math.abs(ball.vx)}if(ball.x>W-15){ball.x=W-15;ball.vx=-Math.abs(ball.vx)}if(ball.y<15){ball.y=15;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+15>=H-30&&ball.y-15<H-18&&ball.x>=paddle-15&&ball.x<=paddle+115){ball.y=H-45;score++;scoreEl.textContent=score;let speed=Math.min(540,245+score*10);let angle=(ball.x-(paddle+50))/65;ball.vx=speed*clamp(angle,-.85,.85);ball.vy=-Math.sqrt(speed*speed-ball.vx*ball.vx)}if(ball.y>H+15){end();return}draw();raf=requestAnimationFrame(tick)}function begin(){cancelAnimationFrame(raf);score=0;scoreEl.textContent=0;paddle=250;ball={x:300,y:210,vx:170,vy:-190};running=true;last=performance.now();start.textContent='처음부터';status.textContent='공을 놓치지 마세요!';raf=requestAnimationFrame(tick)}start.addEventListener('click',begin);document.getElementById('retry').addEventListener('click',()=>location.reload());function move(e){const rect=c.getBoundingClientRect();paddle=clamp((e.clientX-rect.left)*W/rect.width-50,0,W-100);if(!running)draw()}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)move(e)});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&!running)begin()});window.addEventListener('keyup',e=>{keys[e.key]=false});draw()})();
</script></body></html>
