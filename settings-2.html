<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Settings 2.0</title><style>
:root{font-family:system-ui,sans-serif;color:#273246;background:#f5f7fc;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:780px;margin:auto}h1{font-size:1.6rem}.card{background:white;border:1px solid #dce2ec;border-radius:16px;padding:18px;margin:14px 0}label{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:12px 0}select,button{font:inherit;border:1px solid #b8c5d9;border-radius:9px;padding:9px;background:white;color:#263249}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #8065ed}small{color:#58657a}nav a{color:#4934ae}.compact .card{padding:10px;margin:7px 0}.spacious .card{padding:26px;margin:22px 0}.highcontrast{background:#fff;color:#111}.highcontrast .card{border:2px solid #111}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main><nav><a href="./index.html">← Hub로 돌아가기</a></nav><h1>⚙️ Formwheel 설정 2.0</h1><p id="status" role="status">기기 설정을 불러오는 중…</p>
<section class="card"><h2>🎨 화면</h2><div id="appearance"></div></section>
<section class="card"><h2>🧭 편의 및 알림</h2><div id="convenience"></div></section>
<section class="card"><h2>🔐 계정 및 데이터</h2><p id="save">기기 설정 저장 상태: 확인 중</p><button id="export">설정 및 이용 가능한 활동 데이터 내보내기 (JSON)</button> <button id="logout">로그아웃</button><p><small>내보내기는 이 기기에 저장된 Formwheel 설정과 확인 가능한 활동 정보만 포함합니다. Rapid 및 Firebase 전체 데이터 백업을 의미하지 않습니다.</small></p></section>
<section class="card"><h2>📊 내 활동 통계</h2><p id="activity">이 기기에서 확인 가능한 기록을 조사 중…</p></section>
<section class="card"><h2>🛠️ 고급</h2><div id="advanced"></div><button id="diagnostics">오류 진단 보기</button> <button id="reset">설정 초기화</button><pre id="errors" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section>
</main><script type="module">
const KEY='fw.settings.v2',SMART='fw.smartReturn.enabled.v1';
const defaults={animation:'normal',sound:true,start:'hub',notifications:{achievement:true,reward:true,update:false,event:false},performance:'auto',reducedMotion:false,highContrast:false,density:'normal',font:'normal',recommend:true};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch{state={...defaults};}
const smart=()=>localStorage.getItem(SMART)==='true';
const specs=[
['appearance','animation','애니메이션 강도',{off:'끄기',low:'낮음',normal:'보통',high:'높음'}],
['appearance','sound','효과음',null],
['appearance','density','화면 밀도',{spacious:'넓게',normal:'기본',compact:'촘촘하게'}],
['appearance','font','글자 크기',{small:'작게',normal:'기본',large:'크게'}],
['convenience','start','시작 화면',{hub:'Hub',recent:'최근 플레이',favorites:'즐겨찾기'}],
['convenience','smart','스마트 복귀 (기존 설정)',null],
['convenience','recommend','프로젝트 종료 후 추천',null],
['advanced','performance','성능 모드',{auto:'자동',saving:'절전',balanced:'균형',high:'고성능'}],
['advanced','reducedMotion','움직임 줄이기',null],
['advanced','highContrast','고대비 모드',null]
];
const status=document.getElementById('status');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));status.textContent='이 기기에 설정 저장 완료 · '+new Date().toLocaleString();document.getElementById('save').textContent=status.textContent;}catch(e){status.textContent='저장 실패: '+e.message;}}
function apply(){document.documentElement.style.fontSize=state.font==='large'?'18px':state.font==='small'?'14px':'16px';document.body.classList.toggle('compact',state.density==='compact');document.body.classList.toggle('spacious',state.density==='spacious');document.body.classList.toggle('highcontrast',state.highContrast);document.documentElement.style.setProperty('scroll-behavior',state.reducedMotion?'auto':'smooth');}
function add(group,key,title,options){const label=document.createElement('label');label.append(document.createTextNode(title));let control;if(options){control=document.createElement('select');for(const [v,t] of Object.entries(options)){const o=document.createElement('option');o.value=v;o.textContent=t;control.append(o);}control.value=state[key];}else{control=document.createElement('input');control.type='checkbox';control.checked=key==='smart'?smart():!!state[key];}control.addEventListener('change',()=>{if(key==='smart'){localStorage.setItem(SMART,String(control.checked));status.textContent='스마트 복귀 설정 저장 완료';return;}state[key]=options?control.value:control.checked;save();apply();});label.append(control);document.getElementById(group).append(label);}
specs.forEach(s=>add(...s));for(const [key,name] of Object.entries({achievement:'업적 알림',reward:'보상 알림',update:'업데이트 알림',event:'이벤트 알림'})){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='checkbox';input.checked=!!state.notifications?.[key];input.addEventListener('change',()=>{state.notifications={...state.notifications,[key]:input.checked};save();});label.append(input);document.getElementById('convenience').append(label);}
apply();status.textContent='기기 설정 준비 완료 (Firebase 동기화와 별도)';
document.getElementById('export').onclick=()=>{const data={exportedAt:new Date().toISOString(),settings:state,smartReturn:smart(),note:'Local settings export only; not a complete Firebase account backup'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='formwheel-settings-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('reset').onclick=()=>{if(!confirm('화면·편의 설정만 초기화할까요? Rapid·업적·플레이 기록은 유지됩니다.'))return;localStorage.removeItem(KEY);localStorage.setItem(SMART,'false');location.reload();};
document.getElementById('diagnostics').onclick=()=>{document.getElementById('errors').textContent='설정 버전: 2\n로컬 저장소 사용: '+(typeof localStorage!=='undefined')+'\nFirebase 저장/오류 로그는 이 페이지에서 조회하지 않습니다.\n개인정보 및 인증 토큰은 수집하지 않습니다.';};
document.getElementById('activity').textContent='개인 활동 통계는 기존 프로젝트 기록과의 안전한 연동이 필요합니다. 현재 이 화면에서 임의의 수치를 표시하지 않습니다.';
document.getElementById('logout').onclick=async()=>{if(!confirm('Formwheel에서 로그아웃할까요?'))return;try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');const a=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');const app=m.getApps()[0];if(!app){alert('이 페이지에서 로그인 연결을 찾지 못했습니다. Hub의 로그아웃을 이용해 주세요.');return;}await a.signOut(a.getAuth(app));alert('로그아웃 완료');location.href='./index.html';}catch(e){alert('로그아웃을 확인할 수 없습니다. Hub에서 로그아웃해 주세요.');}};
</script></body></html>
