<script>
(()=>{'use strict';
const all=JSON.parse(document.getElementById('seren-data').textContent);
const key='fw-seren-random40-v1';
let saved={};try{const v=JSON.parse(localStorage.getItem(key)||'{}');if(v&&typeof v==='object')saved=v;}catch{}
const $=id=>document.getElementById(id),list=$('cards'),search=$('search'),cat=$('category'),filter=$('filter');
[...new Set(all.map(x=>x.category))].forEach(c=>{const opt=document.createElement('option');opt.value=c;opt.textContent=c;cat.append(opt)});
const persist=()=>{try{localStorage.setItem(key,JSON.stringify(saved))}catch{ $('pick').textContent='저장 공간에 접근할 수 없어 이번 방문에서만 유지돼요.' }};
const get=id=>saved[id]||{};
const shown=()=>all.filter(x=>(!cat.value||x.category===cat.value)&&(!search.value||x.name.toLocaleLowerCase().includes(search.value.trim().toLocaleLowerCase()))&&(filter.value==='all'||(filter.value==='fav'&&get(x.id).fav)||(filter.value==='review'&&get(x.id).review)));
function render(){
 list.replaceChildren();
 const results=shown();
 $('stats').textContent='총 '+all.length+'개 · 현재 '+results.length+'개 · 관심 '+all.filter(x=>get(x.id).fav).length+'개 · 검토 '+all.filter(x=>get(x.id).review).length+'개';
 for(const x of results){
  const card=document.createElement('article');card.className='item';
  const chip=document.createElement('span');chip.className='chip';chip.textContent='#'+x.id+' · '+x.category+' · 구현 후보';
  const title=document.createElement('h2');title.textContent=x.name;
  const status=document.createElement('span');status.className='state';status.textContent=get(x.id).review?'● 검토 표시됨':'○ 아직 검토 전';
  const actions=document.createElement('div');actions.className='actions';
  const fav=document.createElement('button');fav.type='button';fav.className=get(x.id).fav?'fav':'';fav.textContent=get(x.id).fav?'★ 관심':'☆ 관심';fav.setAttribute('aria-pressed',String(!!get(x.id).fav));
  fav.addEventListener('click',()=>{saved[x.id]={...get(x.id),fav:!get(x.id).fav};persist();render()});
  const review=document.createElement('button');review.type='button';review.textContent=get(x.id).review?'✓ 검토 취소':'✓ 검토';review.setAttribute('aria-pressed',String(!!get(x.id).review));
  review.addEventListener('click',()=>{saved[x.id]={...get(x.id),review:!get(x.id).review};persist();render()});
  actions.append(fav,review);card.append(chip,title,status,actions);list.append(card);
 }
 if(!results.length){const empty=document.createElement('p');empty.textContent='조건에 맞는 기능이 없어요.';list.append(empty)}
}
[search,cat,filter].forEach(el=>el.addEventListener(el===search?'input':'change',render));
$('random').addEventListener('click',()=>{const entries=shown();if(!entries.length){$('pick').textContent='추천할 후보가 없어요. 필터를 바꿔주세요.';return;}const x=entries[Math.floor(Math.random()*entries.length)];$('pick').textContent='🎲 추천: #'+x.id+' '+x.name});
$('export').addEventListener('click',()=>{const body=JSON.stringify({version:1,exportedAt:new Date().toISOString(),choices:all.map(x=>({...x,...get(x.id)}))},null,2);const url=URL.createObjectURL(new Blob([body],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='formwheel-seren-random40.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('clear').addEventListener('click',()=>{if(!confirm('이 브라우저에 저장된 세렌 관심·검토 선택만 삭제할까요?'))return;saved={};persist();render()});
render();
})();
</script></body></html>
