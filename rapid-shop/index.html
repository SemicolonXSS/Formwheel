<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Shop · Formwheel</title><style>body{font:16px system-ui;background:#f5f5fb;color:#263044;max-width:780px;margin:24px auto;padding:16px}a{color:#6354bd}.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.themes button{border:2px solid #ddd;border-radius:12px;background:white;padding:10px;font:inherit;cursor:pointer}.themes button[aria-pressed=true]{border-color:#7055c5;box-shadow:0 0 0 2px #b5a4f2}.themes button:focus-visible,#reset:focus-visible{outline:3px solid #d7721f;outline-offset:3px}.themes button:hover{border-color:#a898d5}.swatch{height:62px;border-radius:8px;margin-bottom:8px}.preview{padding:24px;border-radius:20px;min-height:165px;margin:14px 0}.cards{display:flex;flex-wrap:wrap;gap:10px}.cards span{padding:18px;border:1px solid #ffffff75;border-radius:12px;background:#ffffff28}.note{background:#fff3d8;padding:13px;border-radius:12px}.admin{background:white;border-radius:12px;padding:12px;margin-top:18px}button{cursor:pointer}</style></head><body><a href="../">← Hub</a><h1>🎨 Rapid 커스터마이징</h1><p>배경 테마를 골라 무료로 체험해 보세요.</p><p style="background:#e8e4ff;border:1px solid #d1caf5;border-radius:12px;padding:12px"><strong>🪙 실제 Rapid 구매 · 14종 신규 아이템 출시!</strong> 테마 미리보기는 아래에 그대로 있어요. <a href="https://semicolonxss.github.io/Formwheel_Clicker/rapid-shop.html" style="display:inline-block;background:#5947ba;color:white;padding:9px 13px;margin-top:7px;border-radius:9px;text-decoration:none;font-weight:750">Rapid 통합 상점 열기 →</a></p><div role="group" aria-label="테마 미리보기 선택" class="themes" id="themes"></div><div class="preview" id="preview" aria-label="선택한 테마 미리보기"><h2>내 Formwheel Hub</h2><div class="cards"><span>🎮 Clicker</span><span>🍳 Cook</span><span>🧩 Maze</span></div></div><p id="selected" aria-live="polite"></p><button id="reset">기본 테마로 복원</button><p class="note">🪙 Rapid 결제·환불은 아직 미연결입니다. 이 페이지는 무료 미리보기로, Rapid를 차감하거나 테마를 영구 구매하지 않습니다.</p><section class="admin"><h3>🛡️ 개발자 도구</h3><p id="developer">개발자 권한 확인 중…</p><a id="adminLink" href="refund-admin-demo.html" hidden>부분 환불 심사 시제품 열기 →</a></section><script>const list=[['기본',0,'linear-gradient(125deg,#e9edff,#f6f5ff)','#263044'],['선셋',300,'linear-gradient(125deg,#ffb56b,#d16891,#6150a2)','white'],['숲',500,'linear-gradient(125deg,#1f4935,#508f5a,#aecb81)','white'],['네온',800,'linear-gradient(125deg,#0c1734,#135a7c,#4a206e)','white'],['갤럭시',1500,'linear-gradient(125deg,#111733,#49398b,#191e44)','white']];let current=0;function show(){document.getElementById('themes').replaceChildren(...list.map((t,i)=>{const b=document.createElement('button');b.setAttribute('aria-pressed',String(i===current));b.setAttribute('aria-label',t[0]+' 테마, '+t[1]+' Rapid, 미리보기');const sw=document.createElement('div');sw.className='swatch';sw.style.background=t[2];b.append(sw,document.createTextNode(t[0]+' · '+t[1]+' R'));b.onclick=()=>{current=i;show()};return b}));const t=list[current],preview=document.getElementById('preview');preview.style.background=t[2];preview.style.color=t[3];document.getElementById('selected').textContent='🎨 '+t[0]+' 테마 미리보기 중 ('+(current+1)+'/'+list.length+') · 무료 · 구매/적용되지 않음'}document.getElementById('reset').onclick=()=>{current=0;show()};show();</script><script type="module">try{const [{initializeApp,getApps,getApp},{getAuth,onAuthStateChanged}]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js')]);const app=getApps().length?getApp():initializeApp({apiKey:'AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE',authDomain:'formwheel.firebaseapp.com',databaseURL:'https://formwheel-default-rtdb.firebaseio.com',projectId:'formwheel',appId:'1:431583088241:web:74e0e34ea1e3e1170c55d0'});onAuthStateChanged(getAuth(app),async user=>{const label=document.getElementById('developer'),link=document.getElementById('adminLink');link.hidden=true;if(!user){label.textContent='로그인하면 권한을 확인할 수 있어요.';return}try{const token=await user.getIdTokenResult(true);const developer=token.claims.producer===true;if(developer){label.textContent='✅ 개발자 계정 인식 완료';link.hidden=false}else label.textContent='일반 사용자 · 개발자 권한 없음'}catch{label.textContent='권한 확인 실패 · 다시 로그인해 주세요.'}})}catch{document.getElementById('developer').textContent='인증 연결 실패 · Firebase 설정을 확인해 주세요.'}</script></body></html>
