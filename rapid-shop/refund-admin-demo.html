<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid 환불 심사 · UI 미리보기</title><style>
body{font:16px system-ui,sans-serif;background:#f6f5fb;color:#27263a;padding:24px;max-width:560px;margin:auto}
main{background:white;border:1px solid #ddd9eb;border-radius:20px;padding:24px;box-shadow:0 5px 28px #2221}
label{display:block;font-weight:650;margin:18px 0 8px}input[type=range]{width:100%}
output{font-size:27px;font-weight:800}.muted{color:#655f77;font-size:14px}
button{padding:12px;border-radius:12px;border:0;background:#6655ba;color:#fff;font-weight:700}
button:disabled{background:#bbb}textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbc7da;border-radius:10px}
.banner{padding:12px;background:#fff4d7;border-radius:10px;margin:16px 0}
</style></head><body><main><h1>🪙 Rapid 부분 환불</h1>
<div class="banner">관리자 심사 화면 <b>시제품</b> · Firebase 환불 실행 및 실제 요청 조회는 미연결</div>
<p class="muted">아래 구매 정보는 테스트용 예시입니다.</p>
<h2>🌌 갤럭시 테마</h2><p>구매 가격: <strong>1,500 R</strong></p>
<label for="percent">환불 비율: <span id="percentLabel">50%</span></label>
<input id="percent" type="range" min="1" max="100" step="1" value="50">
<p>반환 예정 Rapid</p><output id="amount">750 R</output>
<p id="effect" class="muted">부분 환불: 테마 유지 (권장 기본 정책)</p>
<label for="reason">관리자 심사 사유 (필수)</label>
<textarea id="reason" rows="3" placeholder="예: 구매 설명이 모호하여 50% 보상"></textarea>
<p class="muted">실제 승인 시에는 관리자 권한 검사, 구매 금액 검증, 서버 트랜잭션, 중복 환불 차단, 감사 로그가 반드시 필요합니다.</p>
<button id="simulate">승인 결과 미리보기</button>
<p id="result" role="status"></p></main><script>
const p=document.getElementById('percent'),label=document.getElementById('percentLabel'),amount=document.getElementById('amount'),effect=document.getElementById('effect'),result=document.getElementById('result');
function render(){const value=Number(p.value);label.textContent=value+'%';amount.textContent=Math.floor(1500*value/100).toLocaleString('ko-KR')+' R';effect.textContent=value===100?'전액 환불: 테마 회수':'부분 환불: 테마 유지 (권장 기본 정책)';result.textContent='';}
p.addEventListener('input',render);document.getElementById('simulate').addEventListener('click',()=>{const reason=document.getElementById('reason').value.trim();result.textContent=reason?'시뮬레이션 완료 · 실제 Rapid 잔액은 변경되지 않았습니다.':'심사 사유를 작성해 주세요.'});render();
</script></body></html>
