<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>👻 GHOST RACE | Formwheel</title><style>body{margin:0;background:#151426;color:#f5f1ff;font:16px system-ui}main{max-width:780px;margin:auto;padding:24px 16px}section{padding:20px;border:1px solid #665584;border-radius:18px;background:#242039;margin:16px 0}a{color:#d5bfff}button,input,select{font:inherit;padding:10px;max-width:100%;border-radius:10px;border:1px solid #a991ce;background:#40305c;color:white}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:14px 0}p{line-height:1.6}output{display:block;overflow-wrap:anywhere}li{margin:12px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange}</style></head><body><main><a href="./index.html">← 허브</a><h1>👻 GHOST RACE</h1><section><p>이전 반응속도 기록과 비교하는 독립 연습 모드. 공식 Reflex 기록과는 별개이며 이 브라우저에만 저장됩니다.</p><p id="best"></p><button id="start">시작</button> <button id="hit" disabled>대기</button><p id="result" role="status"></p></section></main><script>'use strict';const key='fw-ghost-race-reaction-v1',start=document.getElementById('start'),hit=document.getElementById('hit'),result=document.getElementById('result'),bestEl=document.getElementById('best');let best=null,timer=0,phase='idle',at=0;try{const n=Number(localStorage.getItem(key));if(n>0&&Number.isFinite(n))best=n}catch{}function render(){bestEl.textContent='개인 최고: '+(best===null?'기록 없음':best+' ms')}function stop(){clearTimeout(timer);phase='idle';start.disabled=false;hit.disabled=true;hit.textContent='대기';hit.style.background=''}start.onclick=()=>{start.disabled=true;hit.disabled=false;hit.textContent='기다리세요';hit.style.background='';result.textContent='';phase='wait';timer=setTimeout(()=>{phase='go';hit.textContent='지금!';hit.style.background='#197342';at=performance.now()},1200+Math.random()*2200)};hit.onclick=()=>{if(phase==='wait'){stop();result.textContent='너무 빨랐어요. 다시 시도!';return}if(phase!=='go')return;const ms=Math.max(1,Math.round(performance.now()-at)),old=best;stop();result.textContent=ms+' ms · '+(old===null?'첫 기록!':ms<old?(old-ms)+' ms 단축!':ms===old?'동점':(ms-old)+' ms 차이');if(best===null||ms<best){best=ms;try{localStorage.setItem(key,String(best))}catch{result.textContent+=' · 저장 불가'}}render()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();</script></body></html>
