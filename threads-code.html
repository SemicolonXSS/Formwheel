<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threads 교류 | Formwheel</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#10172b;color:#f6f4ff}main{max-width:760px;margin:auto;padding:30px 16px}section{padding:22px;margin:18px 0;border:1px solid #444b70;border-radius:18px;background:#1b2340}h1{font-size:28px}p{line-height:1.6;color:#c9cde5}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #626a8c}input{width:100%;background:#0e162a;color:white;margin:8px 0}button{background:#7656e8;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:#bdaeff}li{margin:14px 0;overflow-wrap:anywhere}.muted{color:#aab3d0}#adminPanel[hidden],#dashboard[hidden]{display:none}#status{min-height:1.5em}</style></head><body><main><a href="/Formwheel/">← Formwheel 허브</a><h1>🧵 Threads 교류</h1><p>내 Threads 프로필을 등록하고 다른 사람의 계정을 구경해 보세요. 팔로우는 Threads에서 직접 결정합니다. 맞팔·팔로우는 보장되지 않습니다.</p><section><h2>내 프로필 등록</h2><p>로그인 없이도 Threads 프로필 주소를 등록할 수 있어요. 공개 목록에는 관리자 승인 후 표시됩니다.</p><button id="login">관리자 로그인</button> <button id="logout" hidden>로그아웃</button><p id="who" class="muted"></p><label for="profile">Threads 프로필 주소</label><input id="profile" placeholder="https://www.threads.net/@username" maxlength="110"><button id="submit" disabled>등록 신청</button><p id="status" role="status"></p></section><section><h2>👥 공개 프로필</h2><p>관리자가 승인한 프로필만 표시됩니다.</p><ul id="list"><li>불러오는 중…</li></ul></section><section><h2>🔐 관리자 확인</h2><p>관리자 로그인과 확인 코드가 모두 필요합니다.</p><input id="code" type="password" inputmode="numeric" maxlength="4" placeholder="확인 코드"><button id="verify">확인</button><p id="adminStatus" role="status"></p><div id="adminPanel" hidden><h3>등록 신청 검토</h3><ul id="pending"></ul></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,get,set,onValue,remove} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const config={apiKey:'AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE',authDomain:'formwheel.firebaseapp.com',databaseURL:'https://formwheel-default-rtdb.firebaseio.com',projectId:'formwheel',appId:'1:431583088241:web:74e0e34ea1e3e1170c55d0'};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),root='formwheelV2/threadsExchange',el=id=>document.getElementById(id);
let user=null,admin=false,stopPending=null;const visitorAuth=getAuth(initializeApp({...config,appId:config.appId},'threads-visitor'));
const say=(id,s)=>el(id).textContent=s;
function parseProfile(raw){try{const u=new URL(raw.trim());if(u.protocol!=='https:'||!['threads.net','www.threads.net','threads.com','www.threads.com'].includes(u.hostname))return null;const m=u.pathname.match(/^\/@([A-Za-z0-9._]{1,30})\/?$/);if(!m||u.search||u.hash)return null;return {url:'https://www.threads.net/@'+m[1],handle:m[1]}}catch{return null}}
function makeItem(uid,v,actions=false){const li=document.createElement('li'),a=document.createElement('a');a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='@'+v.handle+' · Threads에서 보기';li.append(a);if(actions){const b=document.createElement('button');b.textContent='승인';b.style.marginLeft='10px';b.onclick=async()=>{b.disabled=true;try{await set(ref(db,root+'/approved/'+uid),v);say('adminStatus','승인 완료')}catch(e){say('adminStatus','승인 실패: '+e.code)}finally{b.disabled=false}};li.append(b)}return li}
onValue(ref(db,root+'/approved'),snap=>{const ul=el('list');ul.replaceChildren();const v=snap.val()||{};Object.entries(v).forEach(([uid,x])=>{if(parseProfile(x.url))ul.append(makeItem(uid,x))});if(!ul.children.length){const li=document.createElement('li');li.textContent='아직 승인된 프로필이 없어요.';ul.append(li)}},()=>say('status','목록을 읽을 수 없어요. Firebase 규칙 배포를 확인해 주세요.'));
onAuthStateChanged(auth,async u=>{user=u;admin=false;el('login').hidden=!!u;el('logout').hidden=!u;el('submit').disabled=false;el('adminPanel').hidden=true;if(stopPending){stopPending();stopPending=null}say('who',u?'로그인: '+(u.email||'사용자'):'로그인 없이도 등록할 수 있어요.');if(u){try{const t=await u.getIdTokenResult();admin=t.claims.admin===true||t.claims.producer===true||(t.claims.email==='not404spam@gmail.com'&&t.claims.email_verified===true)}catch{}}});
el('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){say('status','로그인 실패: '+e.code)}};
el('logout').onclick=()=>signOut(auth);
el('submit').onclick=async()=>{const v=parseProfile(el('profile').value);if(!v){say('status','Threads 프로필 주소를 확인해 주세요.');return}el('submit').disabled=true;try{const current=user||visitorAuth.currentUser||await signInAnonymously(visitorAuth).then(x=>x.user);const targetDb=current===user?db:getDatabase(visitorAuth.app);await set(ref(targetDb,root+'/submissions/'+current.uid),{...v,createdAt:Date.now()});say('status','등록 신청 완료! 관리자 승인을 기다려 주세요.')}catch(e){say('status','등록 실패: '+e.code+' (보안 규칙 배포 여부 확인)')}finally{el('submit').disabled=false}};
if(location.hash==='#admin'){el('code').focus();say('adminStatus','관리자 로그인 후 확인 코드를 입력해 주세요.')}el('verify').onclick=()=>{if(!user||!admin){say('adminStatus','Firebase 관리자 로그인 권한이 필요합니다.');return}if(el('code').value!=='1340'){say('adminStatus','확인 코드가 일치하지 않습니다.');return}el('code').value='';el('adminPanel').hidden=false;say('adminStatus','관리자 확인 완료');if(stopPending)stopPending();stopPending=onValue(ref(db,root+'/submissions'),snap=>{const ul=el('pending');ul.replaceChildren();Object.entries(snap.val()||{}).forEach(([uid,v])=>{if(parseProfile(v.url))ul.append(makeItem(uid,v,true))});if(!ul.children.length){const li=document.createElement('li');li.textContent='신청 없음';ul.append(li)}},e=>say('adminStatus','조회 실패: '+e.code))};
</script></body></html>
