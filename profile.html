der="2~16자" autocomplete="nickname" required></label><label>프로필 아이콘<select id="fw-profile-icon"><option>🎡</option><option>🎮</option><option>🦊</option><option>🐱</option><option>🚀</option><option>🌟</option><option>🎲</option><option>👑</option></select></label><label>테마 색상<input id="fw-profile-color" type="color" value="#6366f1"></label><button type="submit">프로필 저장</button></form><p id="fw-profile-status" role="status" aria-live="polite"></p><p class="muted">Google 로그인과 로그아웃은 Hub 맨 아래에서 할 수 있어요.</p><a href="./id-center.html">Formwheel ID 센터 →</a> · <a href="./">← 메인으로 돌아가기</a></section><section id="fw-badges" aria-labelledby="fw-badges-title"><h2 id="fw-badges-title">🏅 내 배지 보관함</h2><p class="muted">획득한 40→50 DAYS 배지를 Firebase 계정에서 불러옵니다. 획득하지 않은 배지도 함께 확인할 수 있어요.</p><p id="fw-badges-status" class="muted" role="status" aria-live="polite">배지 조회 준비 중…</p><div id="fw-badges-grid" class="fw-badges-grid"></div><p><a href="./anniversary-40-50.html">🎉 기념 이벤트 참여하기 →</a></p></section></main><script type="module" src="./assets/profile.js?v=20261011-badges"></script></body></html>
