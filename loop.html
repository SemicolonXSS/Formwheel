<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP | Formwheel</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1021;color:#f4f0ff;font:15px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#171a34}a{color:#bcb0ff}main{max-width:1050px;margin:auto;padding:20px}h1{margin:0;font-size:26px}p{color:#aeb6d1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.panel{background:#171b36;border:1px solid #343a61;border-radius:18px;padding:16px}canvas{display:block;width:100%;aspect-ratio:1;background:radial-gradient(circle,#1c244b,#0b1024);border-radius:15px;touch-action:none}label{display:block;margin:12px 0 5px}input[type=range]{width:100%}button,select{background:#343d78;color:white;border:1px solid #6971aa;border-radius:10px;padding:10px;cursor:pointer}button:focus-visible{outline:3px solid #c2aaff}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.track{display:flex;align-items:center;gap:7px;margin:7px 0;padding:8px;background:#252b50;border-radius:9px}.track span{flex:1}.track button{padding:5px 9px}.hint{font-size:12px;line-height:1.6}@media(max-width:750px){.layout{grid-template-columns:1fr}main{padding:12px}}</style></head><body><header><h1>🔁 LOOP <small style="font-size:12px">music sandbox</small></h1><a href="./">← Formwheel 허브</a></header><main><p>원을 도는 음표들이 12시 지점을 통과할 때 소리가 납니다. 트랙을 추가하고 속도와 음을 바꿔 나만의 순환 음악을 만들어 보세요.</p><div class="layout"><section class="panel"><canvas id="scene" width="720" height="720" aria-label="순환하는 음악 트랙 시각화"></canvas><div class="actions"><button id="play">▶ 재생</button><button id="add">＋ 트랙 추가</button><button id="save">💾 저장</button><button id="reset">↺ 초기화</button></div><p class="hint">소리는 재생 버튼을 누른 후 활성화됩니다. 설정은 이 브라우저에 저장할 수 있어요.</p></section><aside class="panel"><label for="bpm">템포 <output id="bpmOut">112</output> BPM</label><input id="bpm" type="range" min="40" max="240" value="112"><label for="volume">음량 <output id="volumeOut">35</output>%</label><input id="volume" type="range" min="0" max="100" value="35"><h3>트랙</h3><div id="tracks"></div><p class="hint">각 트랙은 1~8박에 한 바퀴를 돕니다. 트랙별 음과 주기를 조절할 수 있어요.</p></aside></div></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');let audio=null,playing=false,beat=0,last=0,tracks=[{beats:4,note:60},{beats:3,note:64},{beats:5,note:67}],bpm=112,volume=.35;const notes=[48,50,52,53,55,57,59,60,62,64,65,67,69,71,72,74,76,79];function tone(note){if(!audio||!playing)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(note-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume*.17,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.36)}function renderControls(){const root=$('tracks');root.replaceChildren();tracks.forEach((tr,i)=>{const row=document.createElement('div');row.className='track';const label=document.createElement('span');label.textContent='트랙 '+(i+1);const cycle=document.createElement('select');cycle.setAttribute('aria-label','트랙 '+(i+1)+' 주기');for(let b=1;b<=8;b++){let opt=new Option(b+'박',b);cycle.add(opt)}cycle.value=tr.beats;cycle.onchange=()=>tr.beats=Number(cycle.value);const note=document.createElement('select');note.setAttribute('aria-label','트랙 '+(i+1)+' 음');notes.forEach(n=>note.add(new Option(['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][n%12]+Math.floor(n/12-1),n)));note.value=tr.note;note.onchange=()=>tr.note=Number(note.value);const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','트랙 '+(i+1)+' 삭제');del.onclick=()=>{tracks.splice(i,1);renderControls()};row.append(label,cycle,note,del);root.append(row)})}function draw(){const w=canvas.width,c=w/2;ctx.clearRect(0,0,w,w);ctx.fillStyle='#10162e';ctx.fillRect(0,0,w,w);const max=Math.max(tracks.length,1),step=Math.min(48,275/max);tracks.forEach((tr,i)=>{const r=90+i*step,angle=-Math.PI/2+2*Math.PI*((beat/tr.beats)%1),hue=(i*67+265)%360;ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.strokeStyle='hsla('+hue+',75%,70%,.4)';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(c,c-r,5,0,7);ctx.fillStyle='#f5e5ff';ctx.fill();ctx.beginPath();ctx.arc(c+Math.cos(angle)*r,c+Math.sin(angle)*r,11,0,7);ctx.fillStyle='hsl('+hue+',90%,75%)';ctx.fill()});ctx.fillStyle='#e5dcff';ctx.textAlign='center';ctx.font='bold 27px system-ui';ctx.fillText(playing?'● LIVE':'Ⅱ PAUSED',c,c+8)}function frame(now){if(playing){const prev=beat;beat+=(Math.min((now-last)||0,100)/1000)*bpm/60;for(const tr of tracks){if(Math.floor(prev/tr.beats)<Math.floor(beat/tr.beats))tone(tr.note)}}last=now;draw();requestAnimationFrame(frame)}$('play').onclick=async()=>{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();playing=!playing;$('play').textContent=playing?'⏸ 일시정지':'▶ 재생'};$('add').onclick=()=>{if(tracks.length>=12){alert('트랙은 최대 12개입니다.');return}tracks.push({beats:4,note:notes[tracks.length%notes.length]});renderControls()};$('bpm').oninput=e=>{bpm=Number(e.target.value);$('bpmOut').textContent=bpm};$('volume').oninput=e=>{volume=Number(e.target.value)/100;$('volumeOut').textContent=Math.round(volume*100)};$('save').onclick=()=>{try{localStorage.setItem('formwheel-loop-v1',JSON.stringify({tracks,bpm,volume}));alert('이 브라우저에 저장했습니다!')}catch(e){alert('저장할 수 없습니다.')}};$('reset').onclick=()=>{playing=false;beat=0;tracks=[{beats:4,note:60},{beats:3,note:64},{beats:5,note:67}];bpm=112;volume=.35;$('bpm').value=bpm;$('volume').value=35;$('bpmOut').textContent=bpm;$('volumeOut').textContent=35;$('play').textContent='▶ 재생';renderControls()};try{const saved=JSON.parse(localStorage.getItem('formwheel-loop-v1'));if(saved&&Array.isArray(saved.tracks)){tracks=saved.tracks.filter(t=>Number.isInteger(t.beats)&&t.beats>=1&&t.beats<=8&&notes.includes(t.note)).slice(0,12);bpm=Math.max(40,Math.min(240,Number(saved.bpm)||112));volume=Math.max(0,Math.min(1,Number(saved.volume)||0));$('bpm').value=bpm;$('volume').value=volume*100;$('bpmOut').textContent=bpm;$('volumeOut').textContent=Math.round(volume*100)}}catch(e){}renderControls();requestAnimationFrame(frame);
</script></body></html>
